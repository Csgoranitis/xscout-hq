https://t.co/3VL4V7tvTQ`,thumb:null,media:null,why:"1,389 views/min; 34 min old (sweet spot); only 34 replies; on pace for 100K+ views, where your replies do best"},{id:"2115241238773350855",url:"https://x.com/MarioNawfal/status/2115241238773350855",h:"MarioNawfal",name:"Mario Nawfal",f:3970244,at:"2026-10-28T00:36:25.000Z",age:89,views:97433,replies:18,likes:184,reposts:49,quotes:1,vpm:1099.9,score:95,genre:"Memes & viral",topics:["Memes & viral","Food"],tags:["politics","sports"],text:`\u{1F1EE}\u{1F1F1}\u{1F1EE}\u{1F1F7} Think Netanyahu lost? The exit polls just handed him the one result that keeps him in power long enough to restart the war with Iran

The bloc that wants him gone has the most seats on paper, but a chunk of those are Arab parties that no right-leaning Jewish party will sit with after October 7, so the math is a tie, and Likud itself came out bigger than expected by eating the seats of Ben-Gvir, Smotrich and the religious parties.

Shaiel Ben-Ephraim, former IDF intelligence officer, says that leaves Bibi holding the levers that matter:

"You've taken one of the most dangerous men in the world.

You put them in a desperate situation, but you've given them a lot of levers to get out of that situation."

Shaiel says Netanyahu's pre-election plan was to run an exact replica of the preparations that preceded the last two attacks on Iran, so Tehran would fire first, until the chief of staff vetoed it.

If no coalition forms, a caretaker government means he can start that war, use the crisis to pull Bennett and Lieberman into a unity deal, and if that fails, push the next election from spring into summer while Arab voters conclude their record turnout changed nothing.

He has broken Gantz and Mofaz the same way, and Shaiel expects him to do it again.
