"Business & startups"],tags:["politics","sports","tragedy"],text:`Reporter: If I said Joe Biden is the part owner of a company and it has all of these investments from the Middle East, you would say that sounds corrupt, right?

Trump: Well, he did have a lot of different things.

Reporter: Sure, but why is it different for you?

Trump: Because I know nothing about it. I made a lot of money before.

Reporter: But then why do you need the money? Why not just divest, walk away?

Trump: I do.

Reporter: No, you didn\u2019t.

Trump: I have a company. My sons are in the company. It\u2019s hard to say to them, don\u2019t do anything anymore for four years because I\u2019m president.

Reporter: But you could divest from the company yourself and let them do whatever they want. That\u2019s all. You\u2019re not, like, sitting in the Oval Office thinking, Thank God I have that $50 million in World Liberty Financial, right?

Trump: How do you divest from cash?

Reporter: Do you think the people, the people who are investing in the company that you co-own with your sons, who are coming from foreign countries, who want things from your government, don\u2019t you think they think that they are buying influence?

Trump: I don\u2019t know, but that\u2019s true. Look, every president has a problem. You have people, and they work for you. And guys like you cover them, and you do profiles on them, and they become like everybody thinks that Trump loves them and everything else, which in some cases is true and some cases are not. This is true for every president, going back to George Washington.

Reporter: Every president has not owned a cryptocurrency company, however.

Trump: But they own something, whatever crypto was at the time. Okay, you know, there\u2019s crypto. And before that, there was oil. Okay. And every president has had this problem.`,type:"post",ver:!0,bm:127,len:1741,thumb:null,media:null,why:"2,589 views/min; 101 min old; only 55 replies; on pace for 100K+ views, where your replies do best"},{id:"2119778202931388769",url:"https://x.com/saylor/status/2119778202931388769",h:"saylor",name:"Michael Saylor",f:5218496,at:"2026-11-09T13:04:41.000Z",age:33,views:114002,replies:255,likes:2859,reposts:342,quotes:89,vpm:3421.8,score:96,genre:"Crypto",topics:["Crypto"],tags:[],text:"Strategy has acquired 1,036 $BTC and repurchased $188M of $STRC. As of 11/8/26, we hold 850,364 BTC and $4.9B of USD Assets. $MSTR https://t.co/Pxqso5aVRU",type:"post",ver:!0,bm:25,len:154,thumb:null,media:null,why:"3,422 views/min; 33 min old (sweet spot); only 255 replies; on pace for 100K+ views, where your replies do best"},{id:"2119771977523056914",url:"https://x.com/DeItaone/status/2119771977523056914",h:"DeItaone",name:"*Walter Bloomberg",f:1972025,at:"2026-11-09T12:39:57.000Z",age:58,views:105277,replies:73,likes:497,reposts:58,quotes:22,vpm:1813.6,score:96,genre:"Markets & stocks",topics:["Markets & stocks","AI","Tech"],tags:["politics"],text:`$GOOGL $NVDA - GOOGLE ESCALATES AI CHIP WAR WITH NVIDIA

$GOOGL is introducing two new specialized versions of its eighth-generation TPU systems, bringing its lineup to four configurations, Bloomberg reports.

The new systems target two increasingly important AI workloads:

1) TPU 8tx: Designed for secure, confidential computing. It pairs with $AMD CPUs to enable chip-level data encryption, targeting government agencies and companies in regulated industries.

2) TPU 8i Max: Combines two TPU chips in a single package for greater computing power and memory capacity. It's designed for AI workloads requiring long context windows, including coding, drug discovery and complex mathematics.

Both are reconfigured versions of Google's existing TPU designs, rather than entirely new chips, and are expected to become available in 2027.

Google is increasingly focusing on specialized AI hardware as customer requirements evolve.

A massive coronal hole has opened on the Sun\u2014an area where the magnetic field is "open," allowing solar wind particles to escape more freely into space. When such a stream reaches Earth, it can disrupt the planet\u2019s magnetic field, triggering bright auroras far south of their usual latitudes. Forecasts for November 6\u20138 indicate a possibility of minor (G1-level) geomagnetic storms, with a chance of intensifying to moderate (G2-level) storms on November 7\u20138. The distinction is significant: during a G1 storm, auroras are typically visible across the northern United States\u2014for instance, in northern Michigan or Maine. If the storm reaches G2 intensity, the viewing zone could shift further south, potentially extending as far as New York and Idaho.

This is due to the speed and composition of the solar wind. A high-speed stream\u2014traveling at 550\u2013650 km/s, compared to the typical ~400 km/s\u2014is racing toward Earth from this large, unusually elongated coronal hole. The stream is expected to arrive around November 6\u20137 and may persist for much of the weekend, fueling disturbances in the magnetosphere and increasing the likelihood of spectacular auroral displays.

Coronal holes appear darker in ultraviolet imagery because the plasma within them is cooler and less dense. It is through these "windows" that accelerated charged particles stream outward; upon encountering Earth\u2019s magnetic field, they are channeled toward the poles, where they excite the upper atmosphere\u2014creating the phenomenon known as the northern lights (aurora borealis). However, accurately forecasting auroras always remains a challenge with many unknown variables. The key factor is the orientation of the interplanetary magnetic field within the solar wind stream. If its vertical component shifts southward, energy can more easily enter Earth\u2019s magnetosphere, intensifying the geomagnetic storm. Conversely, if the field is oriented northward, the effect will weaken\u2014even if the solar wind speed is high.

For those hoping to catch a glimpse of the phenomenon, standard stargazing guidelines apply: seek out a dark location away from city lights, ensure an unobstructed view of the northern horizon, and keep an eye on the sky anytime from early evening until the hours before dawn.`,type:"post",ver:!0,bm:0,len:2316,thumb:"https://pbs.twimg.com/media/HWrruKHXwAA4QSn.jpg",media:"photo",why:"41 views/min; 83 min old (sweet spot); only 1 replies"},{id:"2119744059078066501",url:"https://x.com/CoinDesk/status/2119744059078066501",h:"CoinDesk",name:"CoinDesk",f:4078735,at:"2026-11-09T10:49:01.000Z",age:169,views:25395,replies:33,likes:286,reposts:68,quotes:1,vpm:150.3,score:64,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:"NEW: @MidnightNtwrk upgrades its mainnet to Ledger 9, adding private asset transfer support, contract-to-contract execution and new cryptographic standards including Keccak-256 and ECDSA. https://t.co/cEBUmPjw3K",type:"post",ver:!0,bm:7,len:211,thumb:"https://pbs.twimg.com/media/HWrX_TeWUAAj4a-.jpg",media:"photo",why:"150 views/min; 169 min old; only 33 replies"},{id:"2119741308549865501",url:"https://x.com/Investingcom/status/2119741308549865501",h:"Investingcom",name:"Investing.com",f:1538818,at:"2026-11-09T10:38:05.000Z",age:180,views:23326,replies:8,likes:57,reposts:8,quotes:1,vpm:129.6,score:64,genre:"Markets & stocks",topics:["Markets & stocks","Tech","Business & startups"],tags:[],text:`*NVIDIA CEO HUANG ADMITS TO AFFAIR; SHARES DROP AS BOARD LAUNCHES INVESTIGATION

Imagine a star that suddenly becomes hundreds or even thousands of times brighter, only to return to its original luminosity days or weeks later. The star itself does not change; rather, the path its light takes to reach us does. Astronomers have identified more than a hundred such events in the "Dragon" galaxy, located approximately 6.5 billion light-years away.

Between us and the "Dragon" lies a massive galaxy cluster, Abell 370, whose gravity acts as a vast, albeit irregular, lens. It stretches parts of the galaxy into an arc, intensifying the light most strongly along specific paths known as "caustics." Individual stars within the cluster\u2014and potentially dark matter as well\u2014further fragment these into "micro-caustics." As the galaxy slowly shifts relative to the lens, a star may cross one of these lines, causing two of its images to merge and its apparent brightness to peak.

A team led by Jos\xE9 Mar\xEDa Palencia at the Institute of Physics of Cantabria analyzed images of the "Dragon" captured by the James Webb Space Telescope between 2022 and 2024. Because the frames were taken from slightly different angles, the researchers carefully aligned them and removed interference from the galaxy\u2019s bright core and other extraneous objects. In total, they identified 104 such events\u2014more than double the previous record of 44 for this same galaxy.

Only exceptionally bright stars can be detected in this manner; consequently, nearly all of them are supergiants\u2014either hot, blue stars or cool, red ones. The ratio between these types serves as an indicator of age: a young, metal-poor stellar population will have a higher proportion of blue stars, while an older, metal-rich population will contain more red stars. In "The Dragon," there is a roughly equal mix of both types: the galaxy is already relatively mature, yet stars are still being born within it.

The most intriguing aspect lies in the statistics. Near the critical curve\u2014the line of maximum magnification\u2014there are fewer transient events on one side than on the other. This asymmetry is consistent with a model of "fuzzy" dark matter, composed of ultralight particles that behave like waves. The authors note a caveat: the same effect could also arise from an error in the lens model\u2019s placement of this curve. For now, this is merely a hint\u2014one that remains to be verified.`,type:"post",ver:!0,bm:2,len:2379,thumb:"https://pbs.twimg.com/media/HWrnOw0WkAAqK5a.jpg",media:"photo",why:"33 views/min; 102 min old; only 1 replies"},{id:"2119750094425899283",url:"https://x.com/Rainmaker1973/status/2119750094425899283",h:"Rainmaker1973",name:"Massimo",f:4441604,at:"2026-11-09T11:13:00.000Z",age:145,views:13863,replies:7,likes:178,reposts:26,quotes:2,vpm:95.6,score:60,genre:"Internet culture",topics:["Internet culture","Travel & nature"],tags:[],text:`The snow leopard is a felid native to the mountain ranges of Central and South Asia. Its global population is estimated in fewer than 10,000 mature individuals and is expected to decline about 10% by 2040

On the Tiangong orbital station, during an experiment, a cloud of rubidium atoms was produced at a temperature of only 9.7 picokelvin.

To conduct such experiments, special installations are used that employ lasers, vacuum, and complex systems for confining matter. Ground-based installations of this type weigh about 10 tons, but for the space experiment, a modification weighing only 500 kg was created. With its help, a Bose-Einstein condensate of 20 thousand rubidium atoms was created, cooled to a temperature of only 0.0000000000097 kelvin above absolute zero.

Such research belongs to fundamental science. It allows studying the deep structure of matter, quantum effects, and interactions between atoms. Hypothetical practical applications of the obtained data include the creation of ultra-sensitive sensors and measuring instruments.

This matches recent reporting: a paper in *Science* (around early November 2026) described Chinese researchers using the Cold Atom Physics Rack (CAPR) on Tiangong\u2019s Mengtian module. They created a Bose-Einstein condensate of ~20,000 rubidium-87 atoms with an equivalent temperature of 9.7 picokelvin (uncertainty roughly 7.0\u201312.9 pK) and observed free expansion for 7 seconds\u2014surpassing the prior record of 38 pK.`,type:"post",ver:!0,bm:4,len:1328,thumb:"https://pbs.twimg.com/media/HWre3rHWgAA3Vjj.jpg",media:"photo",why:"36 views/min; 139 min old; only 4 replies"},{id:"2119657232698867739",url:"https://x.com/NoContextHumans/status/2119657232698867739",h:"NoContextHumans",name:"Out of Context Human Race",f:4242450,at:"2026-11-09T05:04:00.000Z",age:514,views:58610,replies:6,likes:963,reposts:28,quotes:2,vpm:114,score:56,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"So true. https://t.co/Y1PvuW3jLM",type:"post",ver:!0,bm:28,len:32,thumb:"https://pbs.twimg.com/media/HWb0oDSW8AAFarK.jpg",media:"photo",why:"114 views/min; 514 min old; only 6 replies"},{id:"2119716633308696690",url:"https://x.com/InternetH0F/status/2119716633308696690",h:"InternetH0F",name:"internet hall of fame",f:3948534,at:"2026-11-09T09:00:02.000Z",age:278,views:44894,replies:26,likes:761,reposts:19,quotes:3,vpm:161.5,score:56,genre:"Memes & viral",topics:["Memes & viral","AI","Business & startups","Food"],tags:[],text:`Coffee company Dutch Bros makes all their executives, including the CEO, do a two-week bootcamp to learn the ropes of making the company drinks, and running the stores

prove our workflow",by:"witcheer",u:"https://x.com/witcheer/status/2119708822289907795",why:"Just an idea for the Hermes traders you run over Telegram: after you change a trader's rules, refresh its session so it picks up the new rules mid-chat instead of starting fresh and losing context."},{t:"Bloomberg: Anthropic IPO buyers are discussing a valuation as low as $1.1T (earlier estimates went up to $2T). OpenAI reportedly cut its raise to about $20B at $1.25T",label:"Worth knowing",by:"rohanpaul_ai",u:"https://x.com/rohanpaul_ai/status/2119767465253331109",why:"Follow-up to yesterday's roadshow headline. Margin calls on leveraged AI positions in Asia are pushing prices down. That's useful context if AI stocks keep sliding this week."},{t:"Simon Willison hides the bulk of his AI-written GitHub PR descriptions inside a collapsed <details> tag so reviewers aren't buried",label:"Worth knowing",by:"simonw",u:"https://x.com/simonw/status/2119650353142747181",why:"Easy habit if cloud agents open PRs on your repos: a short human summary on top, the agent's long write-up collapsed underneath."},{t:"The new MacBook Pro with PROLED: @AlexFinn says the M5 Max runs smaller local models at about 70 words a second, and MKBHD says the 14-inch Pro is lighter than the 15-inch Air",label:"Ignore",by:"AlexFinn",u:"https://x.com/AlexFinn/status/2119609159289336006",why:"Only matters if you're shopping for a Mac. Your setup doesn't need local models."}],drafts:[{kind:"Quote post (trending now)",quote:"https://x.com/DeItaone/status/2119771977523056914",quoteBy:"DeItaone",text:`Google waited until Nvidia was down 6% premarket to announce two new AI chips.
