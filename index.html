After Haley Stevens backed Republican Mike Rogers over El-Sayed, Jeffries publicly urged Michigan voters to support El-Sayed.

\u201CVote [El-Sayed] in Michigan!\u201D

Senate Democratic leader Chuck Schumer also called for support for El-Sayed, without mentioning Stevens.

The number of suicides in Germany rose to 11,334 in 2025, the highest level in nearly 30 years, official statistics showed, reversing a long-term decline and prompting renewed calls for stronger prevention measures.

The Federal Statistical Office reported the figure this month, a 9.3 percent increase from 10,372 deaths the previous year and 15.6 percent above the average of the past decade. It was the highest annual total since 1998.

Men accounted for 7,846 of the deaths, or 69.2 percent, while women accounted for 3,488, or 30.8 percent. The increase was sharper among women, up 17.9 percent from 2024, compared with a 5.8 percent rise among men. The overall rate for men stood at about 19 per 100,000 people and for women at 8.2 per 100,000.

- Emil Cioran

Emil Cioran (1911\u20131995) was a Romanian-born philosopher and essayist celebrated for his bleak examinations of human existence, suffering, time, and the weight of self-awareness. His writings explored life\u2019s deepest contradictions, frequently challenging conventional beliefs about religion, progress, and optimism. Among his most notable works are The Trouble with Being Born, A Short History of Decay, and On the Heights of Despair. Known for his sharp aphorisms and relentless skepticism, Cioran established himself as a distinctive and influential figure in modern philosophical literature.

Cioran\u2019s personal experiences were shaped by chronic insomnia, emotional anguish, and a profound sense of isolation. During his younger years, he endured periods of overwhelming despair that significantly influenced his philosophical perspective. In 1937, he left Romania for Paris, where he eventually adopted French as his primary literary language. He lived a relatively modest life, distancing himself from academic institutions and public recognition. His early involvement with Romania\u2019s far-right nationalist movement later became a controversial aspect of his past, one he would reflect upon with regret.

Throughout his life, Cioran transformed his personal struggles and existential doubts into powerful writings that questioned humanity\u2019s faith in happiness and progress. Remaining largely withdrawn from public life in Paris, he developed a unique literary voice that combined philosophical reflection, personal confession, and poetic intensity. Instead of presenting a structured philosophical system, he expressed his ideas through brief, provocative observations that revealed the paradoxes of existence. His work continues to resonate with readers fascinated by the complexities of consciousness, the inevitability of suffering, and the fragile nature of human hope.`,type:"post",ver:!0,bm:8,len:2029,thumb:"https://pbs.twimg.com/media/HWC-OaaXkAAnqzp.jpg",media:"photo",why:"255 views/min; 130 min old; only 7 replies"},{id:"2116966350836879669",url:"https://x.com/DailyLoud/status/2116966350836879669",h:"DailyLoud",name:"Daily Loud",f:6901809,at:"2026-11-01T18:51:24.000Z",age:139,views:41082,replies:9,likes:172,reposts:28,quotes:0,vpm:296.4,score:74,genre:"Internet culture",topics:["Internet culture"],tags:[],text:"Lincoln Riley has words after beating Ohio State  https://t.co/BxoarCYMCY",type:"post",ver:!0,bm:20,len:73,thumb:"https://pbs.twimg.com/amplify_video_thumb/2116735433367568385/img/SPegdeFTjGbTuvuU.jpg",media:"video",why:"296 views/min; 139 min old; only 9 replies"},{id:"2116998164293247395",url:"https://x.com/FirstSquawk/status/2116998164293247395",h:"FirstSquawk",name:"First Squawk",f:575233,at:"2026-11-01T20:57:48.000Z",age:12,views:9934,replies:0,likes:3,reposts:2,quotes:0,vpm:814.3,score:74,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:"TRUMP SAYS HE WILL CONTACT AND THANK MICHIGAN\u2019S STEVENS AFTER HER ROGERS ENDORSEMENT",type:"post",ver:!0,bm:1,len:84,thumb:null,media:null,why:"814 views/min; 12 min old; only 0 replies"},{id:"2116997613870575751",url:"https://x.com/FirstSquawk/status/2116997613870575751",h:"FirstSquawk", pace for 100K+ views, where your replies do best"},{id:"2116988649355002325",url:"https://x.com/konstructivizm/status/2116988649355002325",h:"konstructivizm",name:"Black Hole",f:877114,at:"2026-11-01T20:20:00.000Z",age:50,views:3206,replies:0,likes:24,reposts:8,quotes:1,vpm:64.1,score:67,genre:"Internet culture",topics:["Internet culture","Gaming","Memes & viral","Science & space"],tags:[],text:`For two full days in mid-October, Earth\u2019s most distant machine simply vanished.

Sixteen billion miles out, in the cold dark beyond the solar system, Voyager 1\u2019s faint radio whisper stopped arriving. On October 18 and again on the 19th, the giant dishes of NASA\u2019s Deep Space Network pointed themselves at the probe\u2019s expected position and heard nothing. For a spacecraft that has been answering for nearly half a century, the silence was unnerving.

Then, on October 20, the signal was simply back. No commands had been sent. No one on Earth had fixed anything. Voyager had repaired itself.

Engineers later pieced together what had happened. One set of thrusters\u2014the tiny engines that keep the spacecraft\u2019s big dish pointed precisely at Earth\u2014had shut down. Backup thrusters automatically took over. This is the spacecraft\u2019s built-in \u201Cfault protection,\u201D a decades-old safety routine that drops everything non-essential and locks the probe into a stable configuration so ground teams have time to figure out what went wrong. It worked exactly as designed. The exact trigger is still under investigation.

\u201CThis is the first time we\u2019ve seen the spacecraft do something like this,\u201D said Voyager mission manager Kareem Badaruddin, \u201Cbut we are also at a point in the mission where we have to expect the unexpected.\u201D

The scare came on the heels of a carefully planned victory. In September, engineers executed a high-stakes maneuver they nicknamed the \u201CBig Bang\u201D: they simultaneously powered down three aging heaters and switched on lower-power replacements. Voyager\u2019s electricity comes from the slow decay of plutonium, and it loses about 4 watts every year. Without the swap, the team would have been forced to shut off another science instrument by the summer of 2027. The simultaneous switch was the only way to save power while still keeping critical parts warm enough to function.

Launched in 1977, Voyager 1 is now roughly 16 billion miles from home. On November 18 it will cross a quiet but profound milestone: one light-day from Earth. From that moment on, any message sent to the spacecraft will take a full day to arrive, and any reply will take another day to come back.

The machine is old. The power is dwindling. The thrusters are cranky. And yet, somewhere in the interstellar dark, Voyager 1 is still listening, still pointing itself home, and still, when it has to, fixing itself.`,type:"post",ver:!0,bm:2,len:2395,thumb:"https://pbs.twimg.com/amplify_video_thumb/2116968280699129856/img/Qo8kgADxB2Gx7MkG.jpg",media:"video",why:"64 views/min; 50 min old (sweet spot); only 0 replies"},{id:"2116960497400520880",url:"https://x.com/Rainmaker1973/status/2116960497400520880",h:"Rainmaker1973",name:"Massimo",f:4446525,at:"2026-11-01T18:28:08.000Z",age:162,views:21242,replies:1,likes:12,reposts:2,quotes:0,vpm:131.2,score:67,genre:"Internet culture",topics:["Internet culture"],tags:[],text:`If you are interested in captivating, unusual stories, this account has a totally different subscriptions section.

- Ivan Turgenev

Ivan Turgenev (1818\u20131883) was a renowned Russian novelist, playwright, and short-story writer considered one of the most influential literary figures of the 19th century. His writing examined human relationships, social inequality, generational tensions, and the conflict between traditional beliefs and emerging ideas. His celebrated novel Fathers and Sons introduced the character Bazarov, helping popularize the concept of nihilism in literature. Other significant works include A Sportsman\u2019s Sketches and Rudin.

Turgenev\u2019s personal life was shaped by emotional struggles and a lifelong romantic attachment. In 1843, he met the famous opera singer Pauline Viardot and developed a deep affection for her. Despite her marriage to another man, he remained closely connected to her and her family for decades, frequently living near them in Europe. He also endured a troubled relationship with his controlling mother, whose harsh treatment of the serfs on their estate profoundly affected him. Witnessing such cruelty strengthened his opposition to serfdom and social injustice.

Although he spent much of his adulthood outside Russia, Turgenev continued producing literature that explored human psychology and the transformation of Russian society. His criticism of serfdom and political circumstances brought him into conflict with Russian authorities, leading to a brief imprisonment and subsequent house arrest in 1852. Nevertheless, he eventually achieved widespread international acclaim and formed close relationships with prominent writers such as Gustave Flaubert and Henry James. Through his literary contributions, Turgenev helped bring Russian literature to Western audiences, establishing a lasting legacy as one of the greatest novelists of his era.`,type:"post",ver:!0,bm:19,len:1906,thumb:"https://pbs.twimg.com/media/HWC9rOkWoAAJK87.jpg",media:"photo",why:"182 views/min; 250 min old; only 10 replies"},{id:"2116968519846031379",url:"https://x.com/pubity/status/2116968519846031379",h:"pubity",name:"Pubity",f:332144,at:"2026-11-01T19:00:01.000Z",age:130,views:7222,replies:10,likes:230,reposts:19,quotes:2,vpm:55.6,score:58,genre:"Memes & viral",topics:["Memes & viral","Animals & wholesome"],tags:[],text:"Jeff Bezos has committed to donating $100,000,000 to help save over 31,000 endangered animal species from extinction. https://t.co/dvRbaXY6Tw",type:"post",ver:!0,bm:9,len:141,thumb:"https://pbs.twimg.com/media/HWDh_V_WAAA9zPP.jpg",media:"photo",why:"56 views/min; 130 min old; only 10 replies"},{id:"2116924337949405496",url:"https://x.com/chartdata/status/2116924337949405496",h:"chartdata",name:"chart data",f:6135823,at:"2026-11-01T16:04:27.000Z",age:306,views:71893,replies:62,likes:3376,reposts:263,quotes:47,vpm:235.3,score:58,genre:"Music",topics:["Music"],tags:[],text:"2027 #GRAMMYs nominees will be revealed this month. https://t.co/o6km8wBxMW",type:"post",ver:!0,bm:91,len:75,thumb:"https://pbs.twimg.com/media/HWDTc-vXkAABMtw.jpg",media:"photo",why:"235 views/min; 306 min old; only 62 replies"},{id:"2116970942609957025",url:"https://x.com/en - Max Stirner

Max Stirner (1806\u20131856) was a German philosopher and author recognized for his radical philosophy of individualism, known as egoism. He rejected the idea that religion, morality, governments, or social institutions should dictate how individuals live. In his most famous book, The Ego and Its Own (1844), Stirner argued that people should prioritize their own independence rather than submit to abstract ideals or collective expectations. Though his work received limited recognition during his lifetime, it later influenced anarchism, existentialism, and individualist philosophy.

Stirner\u2019s personal life was filled with hardship and financial struggles. His father died when he was an infant, and his mother later experienced severe mental illness. Throughout adulthood, he struggled to establish himself as a respected intellectual. His first wife died shortly after their wedding, while his second marriage ended in separation. His unconventional ideas brought little financial stability, forcing him to rely on teaching and other temporary work to support himself.

Despite his ambitions, Stirner never gained lasting recognition while alive. Following the publication of The Ego and Its Own, his influence gradually faded, and he withdrew from intellectual circles. His final years were marked by poverty, mounting debts, and periods of imprisonment over unpaid financial obligations. He died in Berlin in 1856, largely forgotten by his contemporaries. Decades later, his writings were rediscovered, establishing him as an influential figure in philosophical discussions surrounding personal freedom, authority, and individual identity.`,type:"post",ver:!0,bm:106,len:1815,thumb:"https://pbs.twimg.com/media/HWC4iaXWQAAydca.jpg",media:"photo",why:"151 views/min; 423 min old; only 21 replies"},{id:"2116877927459791164",url:"https://x.com/NoContextHumans/status/2116877927459791164",h:"NoContextHumans",name:"Out of Context Human Race",f:4247577,at:"2026-11-01T13:00:02.000Z",age:490,views:65045,replies:12,likes:1207,reposts:65,quotes:0,vpm:132.8,score:56,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"\u{1F1F2}\u{1F1FD} https://t.co/uo8N2VJ6Ds",type:"post",ver:!0,bm:26,len:26,thumb:"https://pbs.twimg.com/media/HV4QsWaXIAA9pla.jpg",media:"photo",why:"133 views/min; 490 min old; only 12 replies"},{id:"2116877920094273555",url:"https://x.com/InternetH0F/status/2116877920094273555",h:"InternetH0F",name:"internet hall of fame",f:3953924,at:"2026-11-01T13:00:00.000Z",age:490,views:67377,replies:24,likes:1149,reposts:24,quotes:0,vpm:137.5,score:56,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:`Matthew Lillard gives his top 4 favorite films of all time
