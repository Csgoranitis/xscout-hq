appened next.

At its heart lies a bright central bulge and a powerful bar of stars, with a smaller inner bar nested inside it. These bars act like gravitational engines: their slow, sweeping resonances pull gas inward from the galaxy\u2019s disk and then fling much of it outward, concentrating it into a vast outer ring. That ring is alive \u2014 filled with gas, dust, and relatively young stars still being born \u2014 while the core itself has grown quiet, dominated by older stellar populations.

With a total stellar mass of roughly 58 billion suns, NGC 1291 has become a favorite natural laboratory for astronomers studying how bars reshape galaxies over billions of years. In November 2026, ESA\u2019s Euclid mission released some of the sharpest views yet of this elegant system, tracing the intricate structure of its rings and the blue glow of ongoing star formation in remarkable detail.

The money was recovered during a corruption investigation into a former minister accused of accepting millions in bribes under Viktor Orb\xE1n's government https://t.co/JiwSS26deR`,type:"post",ver:!0,bm:10,len:264,thumb:"https://pbs.twimg.com/media/HXGqluGWoAARhLS.jpg",media:"photo",why:"93 views/min; 204 min old; only 4 replies"},{id:"2121712274054226209",url:"https://x.com/konstructivizm/status/2121712274054226209",h:"konstructivizm",name:"Black Hole",f:877549,at:"2026-11-14T21:10:00.000Z",age:15,views:2055,replies:2,likes:10,reposts:2,quotes:0,vpm:137,score:59,genre:"Internet culture",topics:["Internet culture","History & facts"],tags:["politics","tragedy"],text:`A Cosmic Odd Couple Caught in a Rare Evolutionary Moment

Deep inside the crowded globular cluster NGC 362, about 29,300 light-years away, astronomers have found a striking stellar pair: a rapidly spinning millisecond pulsar and the youngest white dwarf companion ever identified next to one.

The pulsar, NGC 362D, rotates once every 5.83 milliseconds\u2014more than 10,000 times per minute. These extreme \u201Ccosmic lighthouses\u201D form only in binary systems. A companion star swells, spills material onto the neutron star, and spins it up to incredible speeds in a process called recycling.

What makes this system special is the timing. The companion, COM-NGC 362D, is a low-mass helium white dwarf still in its earliest \u201Cpre-cooling\u201D phase. Models indicate the mass-transfer phase ended only about 600 million years ago\u2014making it the youngest white dwarf partner to a millisecond pulsar known so far.

By combining radio data from the pulsar with a decade of Hubble ultraviolet and near-infrared observations, researchers led by Greta Ettorre found another clue: residual material still surrounding the young white dwarf, left over from the recent mass transfer. This material appears to dim some of its ultraviolet light, offering a rare snapshot of the system right after the recycling process finished.

\u201CWhat makes this system particularly interesting is the possibility of observing it at a very early stage of its evolution,\u201D Ettorre said.
