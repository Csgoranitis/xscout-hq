Gemini 4 Carbon scores 59 on Intelligence Index v5, driven by leading performance in complex reasoning, knowledge, and scientific tasks. It also has large gains in coding and knowledge work, particularly when compared to other Gemini models, but it is not leading in all these areas.

As with launch of Gemini 4 Argon, Gemini 4 Carbon is being rolled out to selected users and is not yet publicly available. Google is offering a 50% launch discount, with no confirmed end date. All our charts and figures use standard pricing for both Gemini 4 Carbon and Argon.

Key results for Gemini 4 Carbon with high reasoning:
\u27A4 Gemini 4 Carbon leads the Intelligence Index v5, with the #1 score in 4 of the 9 Index evaluations: HLE-Diamond, Terminal-Bench-Science, AA-Omniscience, AutomationBench-AA. Carbon makes substantial gains elsewhere but is not leading in coding and knowledge work

\u27A4 Behind only Claude Opus 5.5 on coding agents: With Antigravity CLI, Gemini 4 Carbon (high) scores 59 only 3 points behind Claude Code with Claude Opus 5.5 (max, 62) on the Artificial Analysis Coding Agent Index. Carbon ranks second on both Terminal-Bench 4.0 (64%) and FrontierCode v1.1 (51%), behind Claude Opus 5.5 (max) at 56%. Google has historically underperformed in this area and so this improvement stands out

\u27A4 Improved agentic knowledge work, but not yet leading: On AA-Briefcase, Gemini 4 Carbon (high) scores 1609 Elo, a 126-point improvement over Gemini 4 Argon (high, 1483), but still behind models including Grok 4.7 (xhigh, 1638), Muse Wonder (max, 1659) and Kimi K3.1 Pro (1678). The largest gain comes from Presentation, up 293 Elo to 1598, alongside a 120-point improvement in Analytical Quality to 1671

\u27A4 Lower Cost per Task than Claude Opus 5.5 for comparable overall intelligence: Gemini 4 Carbon costs $7.76 per Intelligence Index task, ~23% less than Claude Opus 5.5 (max, $10.04) but ~1.2x GPT-6 Astra (max, $6.25). It uses 123k output tokens per task, 29% fewer than Claude Opus 5.5 (max, 173k). At the same $4/$20 standard pricing, its Cost per Task is in line with Gemini 4 Argon ($7.68), while scoring 9 points higher on the Intelligence Index

\u27A4 Leading AA-Omniscience v1.1 score, with low hallucination: Gemini 4 Carbon scores 54 on our recently updated AA-Omniscience v1.1, 6 points ahead of Claude Opus 5.5 (max, 48) and 8 points ahead of Gemini 4 Argon (46). Accuracy (% correct) rises 10 points over Argon to 58%, while its hallucination rate rises from 4% to 11%. This is still the second lowest of any model, behind only Argon, compared with 50% for both Claude Opus 5.5 (max) and GPT-6 Astra (max)

Key model details:
\u27A4 Context Window: 1M tokens
\u27A4 Multimodality: Text, image, video, and speech input, with text output
\u27A4 Pricing: $4/$20 per 1M input/output tokens, the same as Gemini 4 Argon\u2019s standard pricing, with a 50% discount. Cached input tokens receive a 95% discount ($0.20 per 1M)

I sat down with Trita Parsi, Co-founder of the Quincy Institute, to discuss the uncertain path ahead.

The U.S. demanded Iran ship out its uranium up front and open the Strait of Hormuz immediately. 

Iran called these "unacceptable" demands. Qatar\u2019s mediation efforts have hit a wall.

The structural problem, Parsi says, is that the U.S. keeps asking for irreversible concessions while only able to offer reversible ones in return. 

Congress controls sanctions, not Trump. Lifting them takes over a year. That asymmetry is what kills every proposal before it's even offered.

\u201CNo one would have been able to predict exactly the scenario we\u2019re talking about on February 20th of this year. And that\u2019s going to be the same case if we go into a third round.\u201D

The danger window is post-midterms through January, before a potential Democratic Congress makes funding the war politically harder.

If Netanyahu returns, he hits the ground running toward round three. If Eisenkot takes over, it buys time, but Parsi is clear: it doesn\u2019t change where this is heading.

Meanwhile, WSJ is reporting the U.S. has already warned Gulf states to brace for a short, intense campaign after the midterms. 

Diplomacy is failing; the military is gearing back up...

From January to June, an Italian cybersecurity group counted 4,911 serious cyber attacks worldwide, up a wild 71% from last year.

Half a year in, and they\u2019d already hit 93% of the entire 2025 total.

That\u2019s roughly 819 serious attacks every single month, or about 27 a day.

And here comes the twist, with researchers already spotting AI agents handling parts of attacks on their own, and warning that whole teams of them could one day run full attacks solo, changing tactics on the fly.

So companies are being told to build defenses that react just as fast, all on their own, before the bots get there first.

The next hacker might not need sleep, coffee breaks or even a human at the keyboard, and that\u2019s the terrifying part.

@AssemblyAI has launched its first Text to Speech model, AssemblyAI-TTS-1! We evaluated its performance across both Speech Arenas and our Pronunciation Robustness benchmark.

Key takeaways:

\u27A4 Text to Speech, Provider Voice: AssemblyAI-TTS-1 scores an Elo of 1,227 across 1,626 arena appearances, ranking #12, just behind Breeze TTS 2 at 1,228 and ahead of Mistral's Voxtral 3 TTS at 1,221 and Inworld's Realtime TTS-2 Flash at 1,218. It ranks #12 in both English (US) and English (UK).

\u27A4 Text to Speech, Controlled Voice: AssemblyAI-TTS-1 scores 1,110 across 1,674 appearances, ranking #10 with the same 8 cloned voices, behind Cartesia's Sonic 3.5 at 1,118 and ahead of Speechify's Simba 3.2 at 1,086. It ranks #6 in Knowledge Sharing.

\u27A4 Pronunciation Robustness: AssemblyAI-TTS-1 scores 81.7% across 2,115 rated clips, ranking #16, behind HeyGen Voice at 83.2% and ahead of Inworld Realtime TTS-2 at 80.7%. It ranks #6 in Preserving Exact Sequences at 81.5%.

\u27A4 Speed: AssemblyAI-TTS-1 generates 162 characters per second, faster than Cartesia's Sonic 3.6 at 148.6 and Mistral's Voxtral 3 TTS at 112.3.

\u27A4 Pricing: AssemblyAI-TTS-1 is priced at $15/1M characters. Of the eleven models ranked above it on Provider Voice, only two cost less: Gemini 3.8 Flash-Lite TTS at $11/1M and Simba 3.2 at $6.6/1M. Eleven v4 is $80/1M and Sonic 3.6 $49/1M.
