Mag 7 stocks are mixed:

Alphabet (GOOGL) plunges 11% after the company reported disappointing search and advertising sales that reinforced investor concerns about AI\u2019s threat to its core business. 

Microsoft (MSFT) is up 1.7% after the company posted increasing growth in its cloud business and kept its capital expenditures in check, satisfying investors amid a drumbeat of concern that spending on artificial intelligence won\u2019t pay off.

Apple (AAPL) +1.3%, Meta Platforms (META) +1%, Tesla (TSLA) -0.2%, Nvidia (NVDA) -0.5%, Amazon (AMZN) -1.8%

Software companies are broadly lower after disappointing quarterly results from ServiceNow and Fortinet added to concerns about the industry\u2019s prospects in a world awash with AI.

Blue Owl Capital (OWL) rises 4% after reporting a larger uptick in fees than analysts expected in the third quarter.

Carvana (CVNA) is up 8% after the used-car retailer reported better-than-expected results on a key profit measure.

Caterpillar (CAT) shares slump 9% after the company posted third-quarter earnings that only modestly beat expectations, raising concerns about the durability of the broad rally in AI-related stocks.

Chipotle (CMG) is up 7% after the restaurant chain reported comparable sales for the third quarter that beat the average analyst estimate.

DoorDash (DASH) agreed to buy rival Instacart (CART) in a deal that values the company at about $17 billion, the latest sign of consolidation in an increasingly competitive delivery market. Shares of Instacart are halted.

EBay (EBAY) jumps 6% after the online auction company\u2019s net revenue forecast for the full year beat the average analyst estimate.

Fortinet (FTNT) plunges 26% after the security software company gave a disappointing outlook for service revenue.

Glaukos (GKOS) is up 15% after the eye-focused medical device maker boosted its net sales guidance for the full year. The guidance surpassed Wall Street\u2019s expectations.

Marvell Technology (MRVL) falls 11% as the company is said to be in advanced talks to buy data center optics maker Lumentum Holdings (LITE), according to people familiar with the matter. Lumentum rises 6%.

ServiceNow (NOW) drops 19% after the software company\u2019s forecast for fourth quarter current remaining performance obligation fell short of the average analyst estimate.`,thumb:null,media:null,why:"1,030 views/min; 31 min old (sweet spot); only 21 replies"},{id:"2115783488762740820",url:"https://x.com/DeItaone/status/2115783488762740820",h:"DeItaone",name:"*Walter Bloomberg",f:1968138,at:"2026-10-29T12:31:07.000Z",age:7,views:29744,replies:8,likes:75,reposts:29,quotes:3,vpm:4321.2,score:84,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:`US SEPTEMBER PCE INFLATION RISES TO 3.6%, MATCHING EXPECTATIONS

NVIDIA \u{1F525}:
