The woman had been heading to meet family members, who went looking for her when she failed to arrive.

A relative then discovered her lying unconscious and wounded near the bike path.

Emergency responders rushed her to NYU Langone Hospital, where she remains in critical condition.

Police have made no arrests, released no suspect description and have yet to establish a motive for the attack.

While filming a fight scene with Ron Perlman, an extra was wearing such heavy makeup that they could barely see what was happening. With their vision severely restricted, keeping up with the carefully choreographed action became a challenge.

When Perlman stopped throwing punches, the extra apparently had no idea the fight was over and continued reacting as if they were still being hit. The result was an unintentionally hilarious moment that perfectly captured the unpredictability of filmmaking.

storic Vids",f:6083046,at:"2026-10-31T02:00:02.000Z",age:642,views:85240,replies:12,likes:441,reposts:47,quotes:3,vpm:132.8,score:56,genre:"History & facts",topics:["History & facts","Music"],tags:[],text:`In 2019, a U.S. Coast Guardsman made a daring leap onto a moving drug-smuggling vessel in the Pacific Ocean during a high-stakes counternarcotics operation.

After spotting a suspicious semi-submersible attempting to escape, Coast Guard personnel launched a pursuit. In an incredible display of courage, one Guardsman jumped from the pursuing boat onto the vessel\u2019s slippery surface while it was still moving through open water.

Standing atop the partially submerged craft, he repeatedly shouted \u201CAlto su barco,\u201D meaning \u201CStop your boat,\u201D while pounding on the hatch. For several tense moments, those inside refused to respond. Eventually, the hatch opened, allowing Coast Guard personnel to seize control and detain the occupants.

The dramatic interception was part of a broader effort to disrupt drug trafficking routes across the eastern Pacific. In July 2019, the Coast Guard announced that multiple operations had resulted in the seizure of approximately 39,000 pounds of cocaine.
