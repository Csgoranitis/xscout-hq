Blockchain intelligence firm TRM Labs has linked the attack with high confidence to TraderTraitor, a North Korean state-sponsored hacking group associated with the notorious Lazarus Group.

The attackers reportedly drained Binance wallets across 10 blockchains, stealing approximately $3.79 billion from Ethereum, $1.47 billion in Bitcoin, $628 million from Tron and $296 million from the XRP Ledger.

The scale of the operation is staggering, with the amount stolen roughly four times greater than the $1.5 billion Bybit hack in February 2025, which was also attributed to North Korean hackers.

Binance's preliminary investigation suggests the attackers compromised an engineer's laptop, gaining access to systems used to authorize withdrawals rather than directly stealing wallet private keys.

On Ethereum, investigators found that attackers used 50 signed authorizations to gain control of a Binance wallet, allowing them to drain funds and intercept subsequent deposits.

More remarkably, that access reportedly remained active for nearly four hours, including more than 90 minutes after Binance suspended withdrawals.

The exchange has pledged to cover losses using its emergency SAFU fund and company reserves.

Meanwhile, cryptocurrency companies have reportedly helped freeze approximately $3 billion of the stolen assets, although billions remain outside their control.

State Senator John Hoffman, who survived an assassination attempt that same day, is now seeking a fifth term but says he no longer knocks on doors alone.

\u201CI only go out with people now. I don't go out by myself anymore. It's part of my new reality,\u201D he said.

That same fear is reshaping campaigns across Minnesota, with candidates taking extra precautions even during routine public appearances.

Republican gubernatorial candidate Lisa Demuth has hired security guards after receiving threats, while Democratic candidates are monitoring social media, screening event attendees and limiting public announcements of campaign locations.

The growing need for protection has even prompted Minnesota to change its campaign finance rules, allowing candidates to use campaign funds for additional security.

With the midterms approaching, candidates are starting to think twice about their personal safety before doing something as simple as knocking on a voter's door.

\u{1F1EA}\u{1F1F8} Pablo Hern\xE1ndez de Cos, the front-runner. 

He\u2019s the former Bank of Spain governor and now runs the Bank for International Settlements, the central bank for central banks. 

He\u2019s seen as a moderate dove: data-driven, consensus-building, and less likely to slam on the brakes. 

Spain argues it\u2019s finally its turn, since no Spaniard has ever led the ECB.

\u{1F1F3}\u{1F1F1} Klaas Knot, close behind. 

He ran the Dutch central bank for 14 years and is seen as a pragmatic hawk. 

He openly fought Mario Draghi\u2019s stimulus in 2019 and pushed early for rate hikes when inflation surged in 2022. 

The Netherlands backs him, and France reportedly might too, in exchange for the ECB\u2019s chief economist job.

Polymarket has de Cos at 39% and Knot at 29%. In a Bloomberg survey of economists, 12 picked de Cos and 9 picked Knot.

Dark horses include France\u2019s Fran\xE7ois Villeroy de Galhau and Italy\u2019s Fabio Panetta.

Whoever wins takes over just as inflation is rising again and the ECB is expected to hike in December. 

A dove or a hawk at the wheel could decide how hard eurozone borrowers get squeezed.

The new facility will assemble and inspect Advanced Medium-Range Air-to-Air Missiles (AMRAAMs), which are used by F-35 fighter jets operated by both countries.

The project, known as Operation Supercharge, was announced by Japanese Defense Minister Shinjiro Koizumi following talks with Pete Hegseth in the Philippines.

The announcement comes as Japan reports increased Chinese naval activity near its southwestern islands.

Koizumi revealed that three Chinese destroyers and a coast guard vessel crossed the Osumi Strait south of Kyushu this week, marking the first time Japan had observed that particular fleet formation.

Japan has been strengthening its military presence in the southwest, where tensions with China remain high over disputed islands and regional security.

The agreement marks another expansion of U.S.-Japanese military cooperation, bringing production of advanced American-designed missiles directly onto Japanese territory.

Billions of years ago, magma cooled in the southern highlands of Mars. Then a powerful impact blasted a piece of crust into space. Millions of years later, that rock fell in the Sahara \u2014 and became one of the oldest Martian meteorites ever found on Earth.

Scientists matched the chemical and mineral \u201Cfingerprint\u201D of Teghaza 001 with orbital data and identified 13 places on Mars where the rocks look very similar. The exact birthplace can\u2019t be pinned down, but every clue points to the ancient southern highlands \u2014 one of the oldest regions of the planet.

.com/historyinmemes/status/2116017249790177292",h:"historyinmemes",name:"Historic Vids",f:6083895,at:"2026-10-30T04:00:00.000Z",age:525,views:85696,replies:7,likes:237,reposts:20,quotes:1,vpm:163.2,score:57,genre:"History & facts",topics:["History & facts"],tags:[],text:"The practical effects in Mr. Sardonicus (1961) showcase the incredible creativity of classic Hollywood horror. To achieve the character\u2019s disturbing, permanently twisted grin, actor Guy Rolfe wore specially crafted facial prosthetics designed to imitate an extreme muscle spasm. https://t.co/bn2fXqvRPK",type:"post",ver:!0,bm:59,len:302,thumb:"https://pbs.twimg.com/amplify_video_thumb/2115603274724159488/img/hkZARgpeFFjyPypg.jpg",media:"video",why:"163 views/min; 525 min old; only 7 replies"},{id:"2116117373648318838",url:"https://x.com/konstructivizm/status/2116117373648318838",h:"konstructivizm",name:"Black Hole",f:877003,at:"2026-10-30T10:37:52.000Z",age:127,views:3533,replies:1,likes:17,reposts:3,quotes:0,vpm:27.8,score:57,genre:"Internet culture",topics:["Internet culture","Tech","Science & space","Business & startups"],tags:["politics"],text:`Virgin Galactic has transported its new suborbital spacecraft, *Apeiron*, to its base in New Mexico. \u{1F680}

This marks the next step in the company\u2019s efforts to resume tourist flights to the edge of space. *Apeiron* is the first of the Delta-class vehicles, based on the *SpaceShipOne* design: it is carried aloft beneath the wing of a twin-fuselage carrier aircraft, after which it ignites its rocket engine to ascend to the edge of space, eventually returning via a unpowered glide\u2014deploying its wings to ensure a gentle descent. On October 28, the craft was flown from the company\u2019s manufacturing facility in Mesa, Arizona, to Spaceport America in New Mexico. The ferry flight lasted an hour and a half, with *Apeiron* secured beneath its carrier aircraft, *Eve*. The flight was piloted by Michael Masucci and Dan Alix, with flight test engineer Tori Crichton on board.

The name *Apeiron*\u2014derived from the Greek word for "boundless"\u2014was chosen through an online vote that drew participation from over 80 countries. According to Virgin Galactic, the name reflects the program\u2019s core objective: to make suborbital flights both regular and reliable.

The history of this endeavor has been long and complex. Following the triumph of *SpaceShipOne* in 2004, the company built two *SpaceShipTwo*-class vehicles. The first, *VSS Enterprise*, crashed in 2014; the second, *VSS Unity*, completed over 30 crewed flights\u2014including one carrying company founder Richard Branson\u2014before concluding its commercial missions in 2024. This has paved the way for the upgraded Delta-class fleet.

The Delta platform features enhanced thermal protection and is designed for more efficient production and maintenance. The goal is to achieve up to two launches per week for each vehicle, with a service life exceeding 500 missions. Now that *Apeiron* has arrived at the base, engineers will complete software integration and testing, and prepare for flight trials. Commercial flights for clients\u2014who have paid up to $750,000\u2014are scheduled to begin by mid-2027.

A second Delta-class vehicle is already under construction at the Mesa facility, and the team is setting up a production line for rocket engines.`,type:"post",ver:!0,bm:0,len:2183,thumb:"https://pbs.twimg.com/media/HV31g3_WYAAcaEv.jpg",media:"photo",why:"28 views/min; 127 min old; only 1 replies"},{id:"2116115958133866688",url:"https://x.com/pubity/status/2116115958133866688",h:"pubity",name:"Pubity",f:331022,at:"2026-10-30T10:32:14.000Z",age:133,views:7955,replies:14,likes:122,reposts:4,quotes:0,vpm:59.9,score:57,genre:"Memes & viral",topics:["Memes & viral","AI"],tags:[],text:`A father used ChatGPT to find his lost earbud hidden among thousands of rocks.

Its changing through leaner startups, flatter org charts and slower hiring for some entry-level jobs, but not through mass job losses.

The paper argues that big economic change from AI depends on agents learning to coordinate, not on each model getting smarter.

AI models already match experts on many solo tasks, yet jobs and productivity numbers have barely moved. Most benchmarks test 1 model alone, but firms compete as teams.

They built an economic model that tracks 2 abilities separately: competence on single tasks and coordination between agents. More competence moves wages gradually, but coordination past a tipping point lets a few large AI firms suddenly take over big, standardized markets.

In a quiz of 100 people, pairs matched to cover each other's weak spots beat random pairs by 32%. AI copies share the same weak spots, so a model that beats every person alone can still lose to a well-matched human team.`,type:"quote",ver:!0,bm:152,len:1034,thumb:"https://pbs.twimg.com/media/HV2MpLNaAAAfXMc.jpg",media:"photo",why:"17 views/min; 580 min old; 37 replies"},{id:"2116071029575680057",url:"https://x.com/TheAhmadOsman/status/2116071029575680057",h:"TheAhmadOsman",name:"Ahmad",f:80260,at:"2026-10-30T07:33:42.000Z",age:311,views:5875,replies:25,likes:239,reposts:13,quotes:3,vpm:18.9,score:32,genre:"AI",topics:["AI"],tags:[],text:"Local AI = freedom btw",type:"post",ver:!0,bm:5,len:22,thumb:null,media:null,why:"19 views/min; 311 min old; 25 replies"},{id:"2116020431165829429",url:"https://x.com/AISafetyMemes/status/2116020431165829429",h:"AISafetyMemes",name:"AI Notkilleveryoneism Memes \u23F8\uFE0F",f:195794,at:"2026-10-30T04:12:39.000Z",age:512,views:5840,replies:19,likes:181,reposts:24,quotes:2,vpm:11.4,score:32,genre:"Memes & viral",topics:["Memes & viral","AI"],tags:["sports"],text:`OpenAI is building "self-replicating data centers" - and this is now "within grasp."

Those referrals fed a logged-out majority: in Q2, 30.1M of Reddit\u2019s 53.2M US daily users browsed without accounts.

As AI answers replace clicks, US daily users fell to 50.7M in Q3, and Reddit warned daily users could drop by a low-double-digit percentage next quarter.

The login wall won\u2019t bring search traffic back. Reddit is accepting that loss and earning more from those who stay.

Logged-out visitors were mostly one-time Google arrivals that advertisers paid little for, and AI search answers are removing them anyway. Logged-in users reveal their interests through subscriptions and votes, so ads target better and sell for more. 

Reddit has said they\u2019re worth about 3x logged-out visitors. A login also makes Reddit harder to scrape, pushing AI companies toward paid data deals.`,type:"post",ver:!0,bm:1,len:900,thumb:"https://pbs.twimg.com/media/HV3DDMRawAAyv6o.jpg",media:"photo",why:"12 views/min; 346 min old; 17 replies"},{id:"2116013145064100021",url:"https://x.com/rohanpaul_ai/status/2116013145064100021",h:"rohanpaul_ai",name:"Rohan Paul",f:160568,at:"2026-10-30T03:43:42.000Z",age:541,views:3287,replies:11,likes:33,reposts:1,quotes:0,vpm:6.1,score:23,genre:"AI",topics:["AI"],tags:[],text:`multi-agent RL, except one of the agents gets tired and wants lunch \u{1F603}

Morgan Stanley now blocks third-party agents outright, while JPMorgan keeps outside agents such as Meta\u2019s Muse out of customer accounts.`,type:"post",ver:!0,bm:15,len:371,thumb:"https://pbs.twimg.com/media/HV3BgRkacAASiOz.jpg",media:"photo",why:"14 views/min; 353 min old; 59 replies"},{id:"2116096772191769039",url:"https://x.com/rohanpaul_ai/status/2116096772191769039",h:"rohanpaul_ai",name:"Rohan Paul",f:160568,at:"2026-10-30T09:16:00.000Z",age:209,views:3661,replies:38,likes:61,reposts:7,quotes:5,vpm:17.5,score:19,genre:"AI",topics:["AI","Tech"],tags:["tragedy"],text:`New Google paper finds that Gemini AI agents are much less likely to undo correct work after a user wrongly says \u201Cthat\u2019s wrong\u201D if they first write down what they checked and how sure they are.

When a user says "that's wrong, redo it", agents often rewrite code that already passed its tests. Telling them to stand firm backfires, because they then ignore real bugs.

Thinking-in-Bets has the agent privately note its main claims, the checks behind them, and its confidence before seeing the reply. When challenged, it re-checks only the disputed claims and asks which case failed if the complaint is vague.

In patch review across 5 Gemini models, agents wrongly gave up 12.2% of correct requirements after a bare complaint, against 0.02% with the checklist. On report reviews, writing the checklist after the complaint reached only a 65% pass rate, against 89% when written first.

Agents that take user feedback should log what they verified, and how sure they are, before reading the reply.

\u2013 arxiv. org/abs/2610.34654

nd a confidence number, so a pushback re-checks only the disputed part instead of flipping the whole call. Proposal only."},{t:"'Update your VPS asap': DavidOndrej1 flags a new CVE for anyone running a VPS",label:"Could improve our workflow",by:"DavidOndrej1",u:"https://x.com/DavidOndrej1/status/2115977429714088058",why:"Hermes Agent: if any of the agents run on a rented server, open his linked post, confirm whether the CVE applies to that OS, and patch. The post itself does not name the CVE in text, so check the link before acting. Proposal only. Follow-up: https://x.com/DavidOndrej1/status/2115994729183863059"},{t:"Hermes tip: Command Code revoked every API key overnight; cron jobs on that provider fail with 'Invalid Authorization header' until you set a new key and restart the gateway",label:"Worth knowing",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2116046475088330890",why:"Only matters if Hermes uses the Command Code provider. If an overnight job failed with that error, his post has the three commands to fix it."},{t:"Hermes Friday prompt: search the last 7 days of sessions and list what it did, what worked, what failed, and one task to automate next",label:"Could improve our workflow",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2116093008965939637",why:"Trader team: a read-only weekly review of what the agents actually did, sent to Telegram on Fridays. The prompt says 'Don't change anything', which fits. Proposal only."},{t:"omarsar0: you are not doing self-improvement without evals, and agents are bad at writing their own",label:"Worth knowing",by:"omarsar0",u:"https://x.com/omarsar0/status/2115980498975551690",why:"30K views overnight. Same idea as the Google paper: give the traders a fixed scorecard you define, not one they write. Nothing to change today."},{t:"Google DeepMind paper: AI is changing the economy through leaner startups, flatter org charts and slower entry-level hiring, not mass layoffs",label:"Worth knowing",by:"rohanpaul_ai",u:"ht
