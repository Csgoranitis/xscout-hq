Three primary reasons:

1. ETH as fee-burning token never was as strong as it seemed
2. Optimizing for ETH as fee-burning token would demand Ethereum and ETH function in ways that are very hard to make compatible with decentralization and capture resistance.
3. Meanwhile, optimizing for ETH as SoV is aligned with Ethereum focusing on its unique strengths (decentralization and CROPS)

EIP-1559 (including its burn) is fine and good, we should keep them. But we should not feel sad if fee burn is < 10% of breakeven indefinitely; the value of ETH comes from elsewhere.

The core idea: the big thing that people appreciate about Ethereum is decentralization and CROPS. The main pragmatic benefit that these things translate into is stability. SoV is the category where that is not an unneeded extra we merely put effort into for ideological reasons, but rather a pragmatic strength from the perspective of people putting in their assets. And in the era of AI disruption, stability will be highly valued.`,type:"post",ver:!0,bm:307,len:1128,thumb:null,media:null,why:"1,666 views/min; 98 min old; only 304 replies; on pace for 100K+ views, where your replies do best"},{id:"2119406729074979035",url:"https://x.com/elonmusk/status/2119406729074979035",h:"elonmusk",name:"Elon Musk",f:241407250,at:"2026-11-08T12:28:35.000Z",age:76,views:112624,replies:292,likes:1025,reposts:57,quotes:14,vpm:1473.8,score:91,genre:"AI",topics:["AI"],tags:[],text:"@teslaownersSV @bot Does it offer an easy way to shift to per token pricing?",type:"reply",ver:!0,bm:33,len:76,thumb:null,media:null,why:"1,474 views/min; 76 min old (sweet spot); only 292 replies; on pace for 100K+ views, where your replies do best"},{id:"2119398276264853539",url:"https://x.com/MarioNawfal/status/2119398276264853539",h:"MarioNawfal",name:"Mario Nawfal",f:3979180,at:"2026-11-08T11:55:00.000Z",age:110,views:118645,replies:52,likes:293,reposts:38,quotes:7,vpm:1078.6,score:91,genre:"Markets & stocks",topics:["Markets & stocks","TV & streaming"],tags:[],text:`The footage they don't show you on TV \u{1F62C}

2026-11-08T13:00:01.000Z",age:45,views:25316,replies:6,likes:69,reposts:14,quotes:1,vpm:562.8,score:83,genre:"History & facts",topics:["History & facts","Science & space"],tags:["politics"],text:`One of the most fascinating details in Cold War nuclear test footage is the mysterious vertical smoke trails visible moments before detonation. During the 1950s, military scientists needed a way to study the enormous shockwaves produced by atomic explosions, which were otherwise invisible to the naked eye. To make them visible, researchers launched small rockets into the sky shortly before each test, creating thin columns of smoke.

When the nuclear device exploded, the powerful shockwave tore through the smoke trails, bending and distorting them in midair. High-speed cameras captured these movements, allowing scientists to measure the shockwave\u2019s speed and better understand the blast\u2019s destructive effects.

These eerie lines weren\u2019t accidental. They were part of a carefully designed scientific experiment, revealing how researchers studied the devastating power of nuclear weapons during the Cold War.

Rather than flying the entire distance themselves, the drones hitch a ride on high-altitude balloons before being released closer to their targets, conserving battery power for the final attack.

The development comes as NATO faces a \u20AC7 BILLION shortfall in its \u20AC70 billion military aid pledge to Ukraine, with European donors struggling to sustain support as another winter of Russian missile and drone attacks approaches.

With expensive Western weapons becoming harder to finance, Ukraine's use of low-cost alternatives is taking on greater significance.

- Sigmund Freud

Sigmund Freud (1856\u20131939) was an Austrian neurologist and the founder of psychoanalysis whose groundbreaking ideas reshaped how people understood the human mind. He explored concepts such as the unconscious, repression, dreams, and the tension between human instincts and society\u2019s expectations. Freud believed that hidden desires and unresolved childhood experiences could influence thoughts and behavior. His most notable works include The Interpretation of Dreams, Civilization and Its Discontents, and The Ego and the Id.

Throughout his career, Freud faced intense criticism, professional opposition, and considerable personal suffering. His theories challenged traditional medical and moral beliefs, making him one of the most controversial thinkers of his era. In 1923, he developed jaw cancer and underwent more than thirty painful surgeries over the next sixteen years. As a Jewish intellectual, he also faced increasing persecution under the N*zi regime. Following Germany\u2019s annexation of Austria in 1938, Freud was forced to leave Vienna and seek refuge in London, while his books became targets of public burnings.

Despite declining health and political upheaval, Freud remained devoted to his intellectual pursuits. During his final years, he completed Moses and Monotheism and continued examining religion, civilization, and the complexities of human psychology. He died in London in September 1939 at the age of 83.

Although many of Freud\u2019s theories have since been questioned or rejected by modern psychology, his influence remains undeniable. His work helped shape generations of thinkers and continues to leave a lasting imprint on psychology, philosophy, literature, and our understanding of human behavior.`,type:"post",ver:!0,bm:25,len:1892,thumb:"https://pbs.twimg.com/media/HWdAk-AW4AAnDNV.jpg",media:"photo",why:"106 views/min; 405 min old; only 2 replies"},{id:"2119293843376165318",url:"https://x.com/historyinmemes/status/2119293843376165318",h:"historyinmemes",name:"Historic Vids",f:6072891,at:"2026-11-08T05:00:01.000Z",age:525,views:53391,replies:11,likes:357,reposts:49,quotes:3,vpm:101.7,score:55,genre:"History & facts",topics:["History & facts","Travel & nature"],tags:["tragedy"],text:`\u201CI want to talk about everything with at least one person the way I talk about things with myself.\u201D

- Fyodor Dostoevsky

Fyodor Dostoevsky remains one of literature\u2019s most profound explorers of the human mind. Through his novels, he examined guilt, fear, faith, redemption, and the constant struggle between logic and emotion. Rather than providing easy answers, his stories force readers to question their beliefs and confront the darker, more complicated sides of human nature.

His influence extends well beyond Russian literature, leaving a lasting mark on philosophy, psychology, and modern storytelling. More than a century after his death, his insights into human behavior remain remarkably relevant, proving that great literature transcends time.

If you enjoy books that stay with you long after the final page, Dostoevsky is an author worth exploring.
