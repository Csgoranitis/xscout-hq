\u201CBefore everything else, Patrick was defined by being born and bred in Yorkshire, the proud county in the north of England which he loved to the end. You could hear it in his accented voice and in the stern honesty with which he told you what he thought and felt. Yorkshiremen have no truck with half-truths or avoidance of big issues. He wore his heart on his sleeve, which made him a man to rely on, to admire and in my case, love.

We first met as ambitious young actors with the Royal Shakespeare Company half a century ago but we weren't in the same productions. My first strong memory was a few years later, meeting him in the street in central London when he told me about an offer to take over a leading part in 'Star Trek'. \u201CBut Patrick think of your stage career in the UK. Do you really want to risk-getting lost in Hollywood for years and years?".
Well, he took the risk and thank goodness for us all that he did for not just his devoted Trekkies but film and theatre audiences, who marvelled at his using international celebrity to star in a string of cinema successes ('X-Men' of course) and in great classical plays by Shakespeare, Ibsen, Arthur Miller, Peter Shaffer, Pinter and Beckett at Stratford-upon-Avon, in London's West End and on Broadway.

America was his adopted home, where he met his adored Sunny who has cared for him through sickness and health, through thick and thin. But he never forsook his origins: and the proudest achievement of the most respected and beloved actor of his generation on either side of the Atlantic, was his appointment as Chancellor of Huddersfield University in Yorkshire.\u201D`,type:"post",ver:!0,bm:728,len:1689,thumb:"https://pbs.twimg.com/media/HV1pHesWAAAHHOs.jpg",media:"photo",why:"2,065 views/min; 72 min old (sweet spot); only 35 replies; on pace for 100K+ views, where your replies do best"},{id:"2115970958918111742",url:"https://x.com/WatcherGuru/status/2115970958918111742",h:"WatcherGuru",name:"Watcher.Guru",f:4910586,at:"2026-10-30T00:56:04.000Z",age:40,views:128139,replies:135,likes:1587,reposts:174,quotes:31,vpm:3208.8,score:98,genre:"Markets & stocks",topics:["Markets & stocks","Crypto"],tags:[],text:"JUST IN: Binance says $3,000,000,000 worth of stolen crypto has now been frozen following major hack.",type:"post",ver:!0,bm:45,len:101,thumb:null,media:null,why:"3,209 views/min; 40 min old (sweet spot); only 135 replies; on pace for 100K+ views, where your replies do best"},{id:"2115970069696217576",url:"https://x.com/binance/status/2115970069696217576",h:"binance",name:"Binance",f:16115954,at:"2026-10-30T00:52:32.000Z",age:43,views:248581,replies:360,likes:2089,reposts:367,quotes:164,vpm:5718.9,score:97,genre:"Crypto",topics:["Crypto","Business & startups"],tags:[],text:`Update: The current verified total frozen amount is around $3 billion.

Well, he took the risk and thank goodness for us all that he did for not just his devoted Trekkies but film and theatre audiences, who marvelled at his using international celebrity to star in a string of cinema successes ('X-Men' of course) and in great classical plays by Shakespeare, Ibsen, Arthur Miller, Peter Shaffer, Pinter and Beckett at Stratford-upon-Avon, in London's West End and on Broadway.

America was his adopted home, where he met his adored Sunny who has cared for him through sickness and health, through thick and thin. But he never forsook his origins: and the proudest achievement of the most respected and beloved actor of his generation on either side of the Atlantic, was his appointment as Chancellor of Huddersfield University in Yorkshire.\u201D`,type:"post",ver:!0,bm:276,len:1684,thumb:"https://pbs.twimg.com/media/HV1qQsyXcAEh8YN.jpg",media:"photo",why:"1,080 views/min; 67 min old (sweet spot); only 14 replies; on pace for 100K+ views, where your replies do best"},{id:"2115967060530594093",url:"https://x.com/KobeissiLetter/status/2115967060530594093",h:"KobeissiLetter",name:"The Kobeissi Letter",f:2704119,at:"2026-10-30T00:40:34.000Z",age:55,views:99302,replies:117,likes:2181,reposts:274,quotes:56,vpm:1791.4,score:95,genre:"Markets & stocks",topics:["Markets & stocks","Crypto","Memes & viral"],tags:[],text:`BREAKING: Bitcoin falls below $77,000 and ETH falls below $2,200 after Binance confirms that they have been hacked.

Founder CZ says \u201Cit does look like a hack\u201D after billions of dollars moved out of Binance-linked hot wallets into fresh addresses.

Mt. Gox (2014): $BTC roughly halved. It hit $19.7k by 2017, nearly 100x off its post-collapse low.

Bitfinex (2016): $BTC fell ~20%. It was back above pre-hack levels within 3 months and hit new all-time highs in 2017.

Coincheck (2018): The hack hit during the 2018 bear market. $BTC climbed from its $3.1k bottom to $29k by the end of 2020, then reached $69k in 2021.

Binance (2019): $BTC dipped ~4%. It rallied ~136% in just 7 weeks.

FTX (2022): $BTC fell ~22% in a week to ~$15.5k. It was up ~134% a year later and hit a new ATH of $73.7k by March 2024, ~375% off the low.

Bybit (2025): The largest hack on record at the time. $BTC dipped ~5%, hit a new ATH exactly 3 months later and went on to $126k, ~70% above its 2025 low.

Binance (2026): $BTC is down ~3% so far, Binance says user funds are SAFU, and ~$2.4B of the stolen funds is already frozen.

Limited exposure:
- Wintermute: exposure is under 20% of net equity. CEO Evgeny Gaevoy sees no disruption to operations in any scenario.
- GSR: exposure is under 5% of net equity, with no material disruption to business as usual expected. The firm says it's working with contacts at Binance to understand the issue.

No direct exposure:
- Ethena: all collateral with exchange exposure sits with off-exchange custodians, not directly on exchanges.
- Lido: stETH is not affected, and staking and withdrawals are running normally. Lido Earn has no direct exposure.

Blockchain researchers spotted billions of dollars in suspicious transfers from Binance's hot wallets to newly created addresses, with some funds quickly moved to other wallets.

One of the initial Ethereum transfers involved roughly $1.6B in USDT and 167,000 ETH.

Estimates of total suspicious outflows have now reached approximately $5.9B across multiple blockchain networks, although the amount actually stolen remains unconfirmed.

In response, Tether and Circle have frozen more than $2.38B in stablecoins linked to the incident, preventing those funds from being transferred further.

Binance founder CZ says it \u201Cdoes look like a hack\u201D and expects customer funds to be fully covered.

Binance says user funds remain safe and is investigating the security issue. Some customers have also experienced withdrawal disruptions.

For context, the previous largest crypto hack was the $1.5B Bybit theft in February 2025.

Betelgeuse has a secret roommate\u2014and it is not being subtle.

The famous red supergiant in Orion\u2019s shoulder already had a dramatic reputation after the Great Dimming of 2019\u20132020, when it belched a billion tons of material and briefly looked like it might be preparing to explode. Now fresh radio images show the star has largely recovered from that event, yet something else is still shaking its enormous outer atmosphere. That something is a close-in companion star named Siwarha, orbiting so near that it actually plows through Betelgeuse\u2019s extended atmosphere, leaving a detectable wake.

Using the NSF\u2019s Very Large Array and ALMA, a team led by Lynn D. Matthews of MIT Haystack Observatory observed the star at seven radio frequencies between 2021 and 2026. Different wavelengths peer to different depths, giving a layered view from just above the visible surface out to several times the star\u2019s radius. The data show the atmosphere has rebounded: at roughly 2.7 times the stellar radius the gas is back to about 3,500 K\u2014comparable to the star\u2019s own surface temperature. Closer in, the observations also confirmed a long-suspected cool \u201Ctemperature minimum\u201D and the molecular shell known as the MOLsphere, where temperatures drop to around 2,200 K.

The real surprise is the shape. Betelgeuse\u2019s radio-emitting atmosphere is not perfectly round. It becomes noticeably more elongated (egg-shaped) when Siwarha is expected to be at its greatest apparent separation, and rounder when the companion is passing in front of or behind the giant. The companion itself is far too faint to see directly at these wavelengths, but its gravitational and physical presence is written in the changing outline of its host\u2014like watching ripples on a pond and knowing something is moving just beneath the surface.

Siwarha, named \u201Cher bracelet\u201D after Betelgeuse\u2019s Arabic meaning \u201Cthe hand of al-Jawza,\u201D was proposed in 2024 to explain a mysterious ~2,100-day brightness cycle and has since been supported by other imaging and spectroscopic work. It orbits at only about twice the radius of the supergiant, deep inside the extended atmosphere. Future observations covering more of its orbit, and eventually sharper views from the next-generation Very Large Array, should pin down exactly how this close companion influences the way Betelgeuse sheds material in its final evolutionary stages.

In short: the star that made headlines by almost vanishing has bounced back, but it is no longer alone. A smaller star is actively stirring its outer layers, and radio telescopes have finally caught the disturbances in the act.`,type:"post",ver:!0,bm:1,len:2698,thumb:"https://pbs.twimg.com/amplify_video_thumb/2115923170590875648/img/3T-IJe4LEk8d--Kw.jpg",media:"video",why:"41 views/min; 73 min old (sweet spot); only 0 replies"},{id:"2115977741808157030",url:"https://x.com/paulg/status/2115977741808157030",h:"paulg",name:"Paul Graham",f:5414594,at:"2026-10-30T01:23:01.000Z",age:13,views:6511,replies:24,likes:132,reposts:15,quotes:2,vpm:501.5,score:64,genre:"Business & startups",topics:["Business & startups","Film & TV"],tags:["sports"],text:"Funding rounds aren't milestones. It shouldn't be your goal to raise a series A. It should be your goal not to need to.",type:"post",ver:!0,bm:10,len:119,thumb:null,media:null,why:"501 views/min; 13 min old; 24 replies"},{id:"2115973131206799619",url:"https://x.com/garrytan/status/2115973131206799619",h:"garrytan",name:"Garry Tan",f:1141701,at:"2026-10-30T01:04:42.000Z",age:31,views:5041,replies:18,likes:22,reposts:5,quotes:0,vpm:161.1,score:64,genre:"Business & startups",topics:["Business & startups","AI"],tags:[],text:`Now you can use the smartest-for-the-money codegen model Particle-1 with the easiest setup codegen agent swarm harness Capy

Four thousand light-years away in Scorpius, the Cat\u2019s Paw Nebula (NGC 6334) is a nursery in full upheaval. In this layered view, the James Webb Space Telescope\u2019s infrared light reveals thick, overlapping rings of dark orange dust, while Chandra\u2019s X-rays paint a mottled pinkish-purple glow across the heart of the cloud\u2014marking the presence of million-year-old stars still half-hidden behind their natal blankets.

Webb\u2019s longer wavelengths expose the turbulence still unfolding. Massive newborn stars blast cavities into the surrounding gas and dust with fierce radiation and stellar winds, their intense light flooding the region in electric blue. These energetic infants are both architects and destroyers: they sculpt the nebula into its familiar paw-like shape even as their feedback begins to choke off the next generation of star formation.

More than a century after Albert Einstein wrote down his equations of gravity, physicists are still uncovering unexpected features inside them. One of the most productive tricks is simply rewriting the equations in different variables. Mathematically nothing changes, but the structure suddenly starts looking familiar from other areas of physics. That lets researchers apply tools that have already proven useful elsewhere\u2014especially in plasma physics.

That\u2019s exactly what the authors of a new paper did. They reformulated general relativity so that it resembles electrodynamics and the physics of the hot plasmas that make up the Sun and most of the universe. In this form, the gravitational field acquires analogues of electric and magnetic quantities.

In plasmas, one of the key processes is magnetic reconnection. Magnetic field lines stretch, twist, snap, and then reconnect in a new configuration, releasing energy. This is how solar flares are born. Earlier work showed that the ideal evolution of the gravitational field has topological constraints\u2014an analogue of the \u201Cfrozen-in\u201D condition for magnetic field lines. The new study builds a theory of how the gravitational field itself can \u201Cbreak\u201D and reconnect. The results were published in Physical Review D.

Because spacetime is four-dimensional, gravity doesn\u2019t have ordinary field lines. Instead it has \u201Csheets\u201D\u2014bundles of lines stacked into surfaces. These are mathematical structures, not physical objects you could touch. In ideal evolution their connectivity is preserved: the sheets can deform, but they cannot tear or stick together.

The theorists relaxed the ideal condition and introduced a quantity that measures deviations from it. A mere deviation, however, does not automatically allow reconnection. In many cases the deviation can be removed by a simple redefinition of the transport field, restoring the prohibition. True reconnection requires a deviation that cannot be eliminated this way.

They then introduced quantitative measures of the reconnection rate, analogous to those used for magnetic reconnection in plasmas. The process changes how energy and momentum are exchanged between the gravitational field and matter, and it can create or destroy gravitational helicity\u2014a measure of the field\u2019s twist and linkage. Sources of the necessary \u201Cnon-ideality\u201D can include spacetime singularities (such as those near black holes), quantum effects like Hawking radiation, or modifications of general relativity.

The conclusion is that gravitational reconnection is mathematically possible. It simultaneously rearranges the field\u2019s connectivity, redistributes energy between the field and matter, and alters helicity. Whether it actually occurs in realistic situations\u2014such as black-hole mergers\u2014remains a question for future work. If it does appear, it could leave detectable signatures in the energy of events and in the shape of the gravitational waves recorded by observatories like LIGO. That is the next step.

In short, physicists have found an analogue of solar flares inside Einstein\u2019s equations: under the right conditions, spacetime itself can tear and rejoin, transferring energy from the field into matter.`,type:"post",ver:!0,bm:5,len:3280,thumb:"https://pbs.twimg.com/amplify_video_thumb/2115891668670947328/img/a_NinScFVHqmqJKc.jpg",media:"video",why:"27 views/min; 164 min old; only 4 replies"},{id:"2115942334911377864",url:"https://x.com/teslaownersSV/status/2115942334911377864",h:"teslaownersSV",name:"Tesla Owners Silicon Valley",f:1446693,at:"2026-10-29T23:02:19.000Z",age:154,views:4599,replies:11,likes:76,reposts:14,quotes:0,vpm:29.9,score:50,genre:"AI",topics:["AI"],tags:[],text:'.@elonmusk on the days it finally worked, from Falcon 1 to Starship:\u2028"One of the best days of my life." "I prayed for this one." "Crazy things can come true."\u2028Which one still gives you chills? https://t.co/YXOvwyNX8L',type:"post",ver:!0,bm:4,len:216,thumb:"https://pbs.twimg.com/amplify_video_thumb/2115942241344839680/img/twnjTbl7_7OtLzTh.jpg",media:"video",why:"30 views/min; 154 min old; only 11 replies"},{id:"2115977019078938891",url:"https://x.com/Collider/status/2115977019078938891",h:"Collider",name:"Collider",f:235124,at:"2026-10-30T01:20:08.000Z",age:16,views:576,replies:0,likes:1,reposts:0,quotes:0,vpm:36.3,score:49,genre:"Film & TV",topics:["Film & TV"],tags:[],text:"Robert De Niro has been in many great gangster movies throughout his acting career, including Casino, Goodfellas, and Once Upon a Time in America. https://t.co/VOAcxNsuhA https://t.co/2wdTjuxI5Z",type:"post",ver:!0,bm:0,len:194,thumb:"https://pbs.twimg.com/media/HV114tPWUAA9xMf.jpg",media:"photo",why:"36 views/min; 16 min old; only 0 replies"},{id:"2115935835602165924",url:"https://x.com/MiaAI_lab/status/2115935835602165924",h:"MiaAI_lab",name:"Mia",f:43863,at:"2026-10-29T22:36:30.000Z",age:180,views:3970,replies:4,likes:36,reposts:3,quotes:0,vpm:22.1,score:48,genre:"AI",topics:["AI","Food"],tags:["trag
