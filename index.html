Companies that rushed to replace workers with AI are now cleaning up the mess, per The Guardian.

Meta scaled back plans to cut staff and use more AI agents after employees spent growing time cleaning up the agents\u2019 technical and security errors. It\u2019s now rehiring managers.
Microsoft and McKinsey are limiting employee AI use as costs pile up.
Walmart workers say AI scheduling and task tools set impossible standards and generate false alerts.

government.

President Isaac Herzog has officially selected Gadi Eisenkot, Netanyahu's main rival, to try to build a governing coalition.

The formal ceremony is scheduled for Sunday at 5 p.m. in Jerusalem.

And the numbers explain why.

Eisenkot received recommendations from 67 lawmakers, compared with just 46 for Netanyahu.

He'll now have 28 days to put together a government, with a possible two-week extension.

But there's a rather significant catch.

Those 67 endorsements don't mean Eisenkot actually has 67 lawmakers willing to sit in the SAME government. Several potential coalition partners are refusing to work with one another.

So Netanyahu hasn't lost the premiership just yet.

But after years in power, he's now watching his biggest rival get the first opportunity to replace him.

And for once, Netanyahu isn't the one holding the mandate.

UCLEAR STRIKE on IRAN at UP TO 20%

University of Chicago professor Robert Pape has spent decades studying military escalation.

His latest assessment is deeply concerning.

Pape previously estimated the risk of Trump using a nuclear weapon against Iran at just 5\u20138%. He now puts it closer to 15%, potentially as high as 20%.

Pape believes the president's crushing midterm defeat has created a dangerous window before the new Congress takes office on January 3.

He identified THREE warning signs of another major attack: renewed strikes on Iranian air defenses, Trump publicly presenting a new imminent threat, and the collapse of diplomacy.

He says the first has already happened.

We also discussed a scenario in which massive American airstrikes weaken Iran's military before US Marines are deployed on the ground.

And Pape raised another disturbing possibility.

An escalation abroad could trigger protests at home, potentially creating the conditions for Trump to invoke the Insurrection Act. That's a scenario Pape fears, not an established plan.

Pape believes an Israeli nuclear strike would carry much the same consequences for Washington as an American one.

Iranian retaliation, radioactive fallout and a possible global financial shock would not necessarily distinguish between the two.

A new 2026 midterm breakdown redraws all 50 states based on what the map would look like if only ONE group had voted: 

Men, women, white men, white women, independents, suburban voters, rural voters, Catholics, Protestants, seniors, under-30s, Black voters, Latino voters, college whites, non-college whites and more.

And yes, the country looks VERY different depending on who's holding the pen.

Each state is colored by whichever party that specific group backed in the state's main 2026 race, usually Senate, sometimes governor.

The data comes from AP VoteCast, the same voter survey used by NBC, CNN and Fox.

There are some estimates mixed in, especially in states with no usable poll and for smaller demographic groups that were too small to report cleanly.

But the core point is the interesting part:

There is no single \u201Creal\u201D America hidden inside the results. There are multiple political countries sitting on top of each other, and they vote very differently.

Source: deardataa on IG / Writer: Oliver`,type:"post",ver:!0,bm:12,len:1082,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119167810563620864/img/u8Vs5uY_kyBkBnyv.jpg",media:"video",why:"683 views/min; 28 min old; only 6 replies"},{id:"2119162975953252769",url:"https://x.com/MarioNawfal/status/2119162975953252769",h:"MarioNawfal",name:"Mario Nawfal",f:3978836,at:"2026-11-07T20:20:00.000Z",age:48,views:26852,replies:15,likes:53,reposts:9,quotes:3,vpm:559.4,score:83,genre:"Markets & stocks",topics:["Markets & stocks","AI","Business & startups"],tags:["tragedy"],text:`\u{1F1FA}\u{1F1F8} Anthropic is teaching Claude to fix its memories while it's idle.

It's testing a process called "dreaming," where Claude goes back through old conversations, checks what it remembers and corrects mistakes it made earlier.

And no, it's not dreaming like a human. It's basically cleaning up its memory so it can do a better job next time.

In one test, Claude got stuck playing Pok\xE9mon Red because it had remembered a location incorrectly.

After reviewing its old notes against the original gameplay, it spotted the mistake, fixed it and finally reached the next city.

Anthropic also tested the idea on 350,000 company documents. Claude's performance on a set of questions improved from 13% to 48% after building a connected knowledge base.

The idea is pretty interesting. Instead of just remembering more, AI could get smarter by learning which memories it got wrong.

I spoke with Professor Glenn Diesen shortly after CENTCOM announced Task Force Iron Gate, a new operation targeting weapons, sanctioned materials and revenue moving across Iran's borders.

And the scale of the ambition is extraordinary.

Iran shares borders with SEVEN countries, with additional access to Russia through the Caspian Sea.

The American task force coordinating this effort?

Just 20 military and civilian personnel.

Glenn seriously doubts Washington can enforce anything resembling a complete land blockade without neighboring countries cooperating.

But that's precisely what makes this dangerous.

If the pressure actually works, he believes Iran will retaliate rather than allow its economy to be slowly strangled.

We also discussed Joe Kent's accusation that CENTCOM is undermining JD Vance's diplomatic efforts.

Could parts of the American military be pushing escalation while Trump is trying to negotiate?

Glenn wouldn't rule it out, although neither of us could establish that CENTCOM acted without presidential authorization.

Then there's RUSSIA.

We discussed Moscow's growing contacts with Tehran and reports of possible S-400 air-defense deliveries. Glenn expects Russia and China to help Iran discreetly, particularly through intelligence, but says actual weapons transfers remain uncertain.

His broader concern is that Washington keeps increasing pressure without offering Iran a credible way out.

The U.S. wants to make the war economically unbearable for Iran without triggering another round of fighting. Glenn doubts Tehran will accept that arrangement.

And with negotiations still underway, the timing of this new task force could hardly be worse.

Alice Dobson, 31, who worked for West Yorkshire Police, passed sensitive details of an ongoing investigation to Rahees Khan, 43, one of five men convicted of conspiracy to murder.

The attack took place in Bradford in May 2025, when the victims' vehicle was rammed by several cars before armed men descended on them with machetes.

One victim suffered severe neck wounds, while the other had his left hand completely severed and sustained devastating leg injuries. Surgeons later managed to reattach his hand.

:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:`\u{1F6A8}\u{1F1FA}\u{1F1F8} Trump just handed Stephen Miller one of the most powerful jobs in Washington, DAYS after Republicans lost control of Congress.

And anyone expecting Trump to soften his approach after the midterm defeat might want to reconsider.

Miller, the architect of Trump's aggressive immigration crackdown, is replacing Susie Wiles as White House chief of staff on Monday.

He's pushed for 3,000 immigration arrests a DAY, defended military strikes on Iran and consistently advocated expanding presidential authority.

One White House official put it like so:

\u201CHe's not changing course.\u201D

And Democrats are already preparing to investigate Miller's immigration policies.

Incoming House Oversight Democrat Robert Garcia had a message for him:

\u201CStephen Miller should lawyer up.\u201D

With Democrats taking over BOTH chambers in January, Trump has chosen one of his most confrontational advisers to run the White House.

That's quite a response to losing an election.

And it makes the coming showdown with Congress considerably more interesting.

That's a 35-POINT gap.
