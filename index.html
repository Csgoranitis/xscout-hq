2026-11-13T11:05:00.000Z",age:160,views:56464,replies:75,likes:593,reposts:44,quotes:3,vpm:352.9,score:69,genre:"Markets & stocks",topics:["Markets & stocks","Crypto","Memes & viral","History & facts"],tags:["tragedy"],text:`\u{1F6A8} Bitcoin is now BACK at the 200-week moving average.

This is one of the most important levels in Bitcoin\u2019s entire history.

And what happened at this level during previous market cycles is extremely interesting.

Historically, the 200W moving average has acted as one of Bitcoin\u2019s strongest long-term accumulation zones.

Here\u2019s what happened in previous cycles.

\u2022 2015: Bitcoin bottomed near the 200W moving average before entering a massive bull market.

\u2022 2018: Bitcoin found support around this level before eventually recovering and reaching new all-time highs.

\u2022 2020: Bitcoin briefly dropped below the 200W moving average during the COVID crash before starting its rally toward $69,000.

\u2022 2022: Bitcoin broke below the 200W moving average and spent months trading around and below it before recovering in 2023.

And now, in 2026, Bitcoin is testing this historical level once again.

But here\u2019s what makes this so interesting.

Every previous major bear market eventually created an enormous long-term buying opportunity around this indicator.

That doesn\u2019t mean Bitcoin cannot fall further.

In fact, the 2022 bear market proved that Bitcoin can remain below the 200W moving average for an extended period.

But historically, investors who accumulated Bitcoin around these levels and held through the following cycle were rewarded.

And that\u2019s why I\u2019m watching this level so closely.`,type:"post",ver:!0,bm:25,len:1396,thumb:"https://pbs.twimg.com/media/HW_lc8RXwAAeEgR.jpg",media:"photo",why:"353 views/min; 160 min old; only 75 replies"},{id:"2121236981900525704",url:"https://x.com/Polymarket/status/2121236981900525704",h:"Polymarket",name:"Polymarket",f:2057868,at:"2026-11-13T13:41:21.000Z",age:4,views:5683,replies:6,likes:27,reposts:4,quotes:1,vpm:1557,score:69,genre:"Markets & stocks",topics:["Markets & stocks","AI","Tech"],tags:["politics"],text:"BREAKING: Commerce Sec. Howard Lutnick reportedly agrees to testify before the Senate Banking Committee about Nvidia\u2019s AI chip sales to China.",type:"post",ver:!0,bm:2,len:142,thumb:null,media:null,why:"1,557 views/min; 4 min old; only 6 replies"},{id:"2121205371465592898",url:"https://x.com/cb_doge/status/2121205371465592898",h:"cb_doge",name:"DogeDesigner",f:1909796,at:"2026-11-13T11:35:45.000Z",age:129,views:18617,replies:29,likes:203,reposts:53,quotes:7,vpm:144,score:69,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:`NEWS: Zimbabwe\u2019s Government is rolling out 8,000 @Starlink kits to schools, helping rural students access digital education. \u{1F1FF}\u{1F1FC}

izm",name:"Black Hole",f:877371,at:"2026-11-13T13:11:00.000Z",age:34,views:2694,replies:1,likes:14,reposts:3,quotes:0,vpm:79.2,score:67,genre:"Internet culture",topics:["Internet culture","Gaming","Science & space","Animals & wholesome"],tags:["tragedy"],text:`Deep inside the vast Carina Nebula, 7,500 light-years away, a shadowy pillar of gas and dust has been caught mid-prowl. NASA\u2019s Hubble and the NASA/ESA/CSA James Webb Space Telescope have turned their eyes on the Cat\u2019s Head Nebula\u2014a temporary, cat-shaped filament that looks like it\u2019s sitting with its back to us, head turned, and one glowing eye fixed on the stars.

Hubble\u2019s visible-light view (first image) shows the classic silhouette: a dark, elongated dust pillar edged in luminous gas, with a crimson \u201Ceye\u201D that is most likely a young star still wrapped in its natal cocoon. The surrounding colors shift from deep blue to fiery yellow and red as ionized gas and starlight illuminate the scene.

Switch to infrared and the cat becomes translucent. Webb\u2019s NIRCam (near-infrared) peels back the dust to reveal a dense field of stars and the pillar\u2019s intricate, textured surface. MIRI (mid-infrared) goes further, lighting up warm dust and carbon-rich molecules so the structure glows like a spectral feline\u2014wispy filaments, a bright eye, and hidden details that visible light completely misses.

Together, the three views capture a fleeting moment in star formation: denser material resisting the fierce ultraviolet radiation and winds from massive nearby stars, while new stars ignite inside the dust. Eventually this cosmic cat will disperse, but for now Hubble and Webb have frozen its haunting pose in extraordinary detail.

In a crowded star cluster 160,000 light-years away, astronomers thought they had found a quiet stellar-mass black hole. What they actually found was a pair of ordinary stars caught in a dramatic, still-unfinished gravitational dance\u2014one of them spinning so fast it nearly blurs its own light.

Back in 2022, the system known as NGC 1850 BH1 looked like a classic dormant black hole binary. A visible star roughly five times the Sun\u2019s mass appeared to be orbiting an unseen companion of about eleven solar masses. Because the companion produced almost no X-rays, the natural conclusion was that it was a black hole quietly tugging on its partner. Models suggest our own Milky Way may hide around 100,000 such \u201Csilent\u201D black holes, yet only a handful have ever been confirmed. Finding another was exciting.

It was also wrong.

A new study led by Rhys Seeburger of Liverpool John Moores University, posted to arXiv in late October 2026, used a technique called spectral disentangling on fresh, higher-resolution spectra from the Very Large Telescope\u2019s FLAMES instrument. By carefully separating the mixed light of the two stars\u2014especially in bluer wavelengths where a hidden luminous star would stand out more clearly\u2014the team revealed two bright objects instead of one star and a black hole.

The primary is a cool, inflated, stripped star of only about 1.7 solar masses. Its companion is hotter, more massive (roughly 5.2 solar masses), and spinning at a projected speed of about 280 kilometers per second. That configuration is the natural outcome of earlier mass transfer: one star donated material to the other, spinning it up while itself becoming bloated and stripped. What looked like a black hole was simply a luminous star whose light had been partly hidden by the interaction.

The result demotes NGC 1850 BH1 from black-hole candidate to \u201Cimpostor\u201D\u2014a known class of systems that can contaminate searches for dormant black holes. Mass ratios are still uncertain, and earlier observations had suggested the companion contributed far less light than the new data indicate. Sharper spectra from Hubble or large ground-based telescopes will be needed, but the crowded cluster and the stars\u2019 relative faintness make that challenging.

The larger lesson is caution. When hunting the quietest black holes in the universe, the impostors can look almost perfect\u2014until the light is carefully pulled apart and the spinning star is finally seen.`,type:"post",ver:!0,bm:3,len:2530,thumb:"https://pbs.twimg.com/amplify_video_thumb/2121182856286203904/img/wlwR_9EfdlOXyCKN.jpg",media:"video",why:"24 views/min; 171 min old; only 1 replies"},{id:"2121124903323672748",url:"https://x.com/billboard/status/2121124903323672748",h:"billboard",name:"billboard",f:16849182,at:"2026-11-13T06:16:00.000Z",age:449,views:20029,replies:2,likes:318,reposts:113,quotes:0,vpm:44.6,score:51,genre:"Music",topics:["Music","Gaming"],tags:[],text:`\u2018The Hunger Games\u2019 Soundtrack, ATEEZ, U2 Feat. Dolly Parton &amp; More: New Music\xA0Friday\xA0Guide

ews) and a steady stream of AI and business headlines. Quote the source instead of the reposts. You don't follow it yet.",src:"https://x.com/Reuters/status/2121208423283069419"},{h:"historyinmemes",f:6067669,kind:"topic",why:"Evergreen stories that keep getting views for hours (the Johnny Depp / Jack Sparrow post was at ~97K after ~6.75 hours with only 8 replies), so a reply there gets seen. It's a break from markets that still fits your humor. You don't follow it yet.",src:"https://x.com/historyinmemes/status/2121135979310522838"}],brief:{atIso:"2026-11-13T13:55:00Z",at:"7:55 AM CT",analytics:"Pull 7:41 AM CT Nov 13 (vs 2:52 PM CT yesterday). Followers 712, down 1 from 713 (714 yesterday morning). New follows: @HiAlanHoa (13,463 followers), @Ben1Sal0 (8,758) and @DaisyStick16277 (39). None of them show up in your replies or mentions, so there's no clear source. Unfollows: @Eminic_the1st (21,228), @shirhand59 (7,514), @CLukerf (116) and @orcatron007 (98). Last 24 hours: 1 post and 13 replies, all between 8:17 and 8:51 AM CT yesterday. Nothing since, so no new posts to rank this morning. Best post: 'Ready for another day, thanks Jensen $SPY $NVDA $QQQ $NBIS' (8:25 AM CT yesterday): 310 views, 18 likes, 8 replies, 1 repost, 0 bookmarks. It went from 259 to 310 views overnight. It worked because it went out before the open, on the day's biggest story, with tickers people search, and your regulars showed up in the replies. Top replies by views: '\u{1F480}\u{1F480}\u{1F923}' to @Candace_XSI (66 views, 1 like), 'You might get there by tomorrow' to @Candace_XSI (40, 1 like, 1 reply), 'Cheers!' to @ZacWhelan_ (28, 2 likes), 'There you go' to @AdamInvestss (22) and '2 weeks ago this would be unimaginable' to @bullish1312 (16, 2 likes). No bookmarks on anything. Who engaged: @Candace_XSI, @Momo_Douk45 (4 replies), @bullish1312 (2), @FLASTOCKWATCH ('You in FLA yet'), @PenneyInvests, @Joe_Moto_Coffee (9.3K followers), @amktparticipant, @linbo_tang, @JayThetaIQ and @Gandalfthegrn ('Thank you Jensen', 2:58 PM CT, the only new mention since the last pull). No spikes: all your items together gained 410 views overnight. The @RockstarGames reply gained the most (+217, now 262,880), then the Jensen post (+51) and the @theinvestnow reply (+35, now 404). This morning's timeline: Microsoft's Outlook/Teams/Copilot outage passed 12 hours, Claude had login problems (fix deployed), PPI came in at 6.5% YoY vs 6.6% expected and then Goolsbee said inflation is 'going the wrong way', Taylor Swift teased a 'big announcement' on GMA, and a new Friday the 13th movie got announced on Friday the 13th.",ai:[{t:"Microsoft's outage is past 12 hours: Outlook, Teams and Copilot were still down this morning, disrupting businesses and governments worldwide (Reuters, ~138K views). zerohedge's take: 'one MSFT cloud outage and the entire AI ecosystem grinds to a halt'",label:"Worth knowing",by:"Reuters",u:"https://x.com/Reuters/status/2121208423283069419",why:"You use Copilot at work, so if it's flaky today, that's why. Nothing to change on your side. It's also today's most relatable story for anyone with an office job (see drafts). zerohedge: https://x.com/zerohedge/status/2121235545812779119"},{t:"Claude had problems too: 3,800+ users reported issues as Microsoft's meltdown entered day two (per @MarioNawfal), and @financialjuice relayed Anthropic's update: 'Issues with authenticating to Claude, fix deployed'",label:"Could improve our workflow",by:"MarioNawfal",u:"https://x.com/MarioNawfal/status/2121215248883741066",why:"Workflow: any Hermes Agent or Grok Bot job, or trader step, that depends on one model provider. Proposal only: give scheduled jobs a backup model and a 'this run failed' ping, so an outage doesn't silently skip a morning run. Anthropic update: https://x.com/financialjuice/status/2121207459557859488"},{t:"Railway published its full report on the October breach: the attacker searched for AI provider keys by name, and about $740K was spent on stolen keys
