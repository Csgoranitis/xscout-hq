- Italian Proverb

This traditional Italian proverb offers a powerful reminder of life\u2019s inevitable end, emphasizing that death makes no distinction between wealth and poverty, power and weakness, or greatness and obscurity. Much like a game of chess, society places individuals in different positions, granting some the authority of kings while others move through life with the limited influence of pawns. Yet when the game concludes, every title, privilege, and distinction loses its meaning. In the face of mortality, all are ultimately equal.

This timeless message is beautifully illustrated by a black-and-white photograph of chess pieces scattered together inside a wooden box after a match. The once-powerful king lies among ordinary pawns, stripped of the importance and authority he possessed on the board. No piece retains its former rank once the game is over. The image captures a profound truth about human existence: regardless of how much power, recognition, or fortune we accumulate, we all share the same inevitable destination.`,type:"post",ver:!0,bm:21,len:1110,thumb:"https://pbs.twimg.com/media/HWtgltXXEAAJcmX.jpg",media:"photo",why:"582 views/min; 36 min old (sweet spot); only 6 replies"},{id:"2121959009984839944",url:"https://x.com/zerohedge/status/2121959009984839944",h:"zerohedge",name:"zerohedge",f:3437263,at:"2026-11-15T13:30:26.000Z",age:6,views:17943,replies:4,likes:24,reposts:8,quotes:1,vpm:3223.3,score:83,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:`"D\xE9j\xE0 Vu": JPMorgan Finds 3.8GW Of Malaysia's Data Center Pipeline Tied To Chinese Operators As Washington Moves To Shut The Backdoor https://t.co/fmN1T6hFQg`,type:"post",ver:!0,bm:8,len:157,thumb:null,media:null,why:"3,223 views/min; 6 min old; only 4 replies; on pace for 100K+ views, where your replies do best"},{id:"2121951356479262736",url:"https://x.com/MarioNawfal/status/2121951356479262736",h:"MarioNawfal",name:"Mario Nawfal",f:3985865,at:"2026-11-15T13:00:01.000Z",age:36,views:22091,replies:11,likes:31,reposts:4,quotes:0,vpm:613.9,score:83,genre:"Markets & stocks",topics:["Markets & stocks","Gaming"],tags:[],text:`Who needs GTA VI when you live there \u{1F62C}

Friday's nationwide aviation shutdown, which lasted more than FOUR HOURS and caused thousands of flight disruptions, has exposed a major weakness in America's air traffic control system.

The U.S. relies on 22 regional control centres to guide aircraft between airports, all connected through an enormous telecommunications network.

When a contractor replacing old copper wiring with fibre-optic cables triggered a communications malfunction, the disruption spread to as many as 17 of those 22 centres.

The system was reportedly receiving more than 1,000 connection attempts every FOUR TO FIVE SECONDS, disrupting radar feeds and communications with pilots.

Because aircraft are continuously handed off between controllers as they cross the country, a failure in one part of the network can affect flights thousands of miles away.

The FAA is now modernising the ageing infrastructure, with $12.5 BILLION already approved by Congress.

The incident shows how a problem involving cables on the ground can paralyse an entire nation's skies.

The agreement, signed in Manila today, will slash bureaucratic hurdles for joint military operations, training and deployments.

Philippine Defence Sec. Gilberto Teodoro said procedures that previously required 100 steps could now take just TEN.

The pact covers maritime, air and land cooperation, alongside intelligence sharing, disaster response and defence infrastructure development.

Australian PM Anthony Albanese also announced additional investment in drone technology, surveillance equipment and training to help the Philippines detect maritime and cybersecurity threats.

The agreement comes as Manila expands its network of security partnerships beyond its longstanding alliance with Washington.

Australia backs the 2016 international arbitration ruling rejecting China's sweeping maritime claims, while Beijing continues to oppose joint military exercises involving the Philippines and its allies.

U.S. District Judge Ana Reyes ordered East Potomac Golf Links to remain open, ruling that the administration likely violated environmental laws and failed to follow required public consultation procedures.

Trump wants to transform the municipal course into a championship-level facility, but the project has faced fierce opposition from golfers and preservationists concerned about losing public access.

The dispute intensified after more than 400 trees were removed from the site, prompting the judge to impose restrictions on further removals.

Reyes also rejected the administration's claim that the closure was necessary for safety, describing its arguments as "pretextual."

The Justice Department says planning can continue despite the ruling, leaving Trump's redevelopment ambitions facing another legal obstacle.

The golf course joins several of Trump's Washington projects facing legal challenges, including his proposed triumphal arch and White House ballroom.

t:`\u201CIf you are depressed you are living in the past. If you are anxious, you are living in the future. If you are at peace, you are living in the present.\u201D

- Lao Tzu

Lao Tzu, traditionally believed to have lived during the 6th century BCE, was an ancient Chinese thinker regarded as the legendary founder of philosophical Taoism. His philosophy centered on humility, simplicity, compassion, and living in harmony with the Tao, the natural way of the universe. He is traditionally credited with authoring the Tao Te Ching, one of the most influential texts in Chinese philosophy. Among its central teachings is Wu Wei, often translated as effortless action, which encourages individuals to work with the natural flow of life rather than constantly resisting or attempting to control it.

Much of Lao Tzu\u2019s personal history remains uncertain. According to ancient tradition, he worked as a keeper of records in the royal court of the Zhou dynasty, where he developed a deep understanding of classical writings and philosophical thought. Growing increasingly troubled by political corruption and social unrest, he reportedly chose to abandon society. Legend tells that while traveling westward, he encountered a gatekeeper named Yin Xi, who persuaded him to preserve his wisdom in writing. Lao Tzu then composed the Tao Te Ching, traditionally divided into 81 brief chapters, before departing into the wilderness and disappearing from historical accounts.

Historians continue to debate whether Lao Tzu existed as a single historical figure or whether the teachings attributed to him emerged from several thinkers over generations. Regardless of these uncertainties, his philosophical legacy has profoundly shaped Chinese culture, influencing religion, literature, medicine, art, and spiritual traditions. Centuries later, his ideas remain remarkably relevant, challenging humanity\u2019s obsession with status, power, and control. His enduring message suggests that genuine wisdom and strength are often found not through force or endless ambition, but through patience, moderation, simplicity, and harmony with the natural world.`,type:"post",ver:!0,bm:76,len:2122,thumb:"https://pbs.twimg.com/media/HWtfhguXAAA-ei8.jpg",media:"photo",why:"231 views/min; 156 min old; only 16 replies"},{id:"2121937509449867758",url:"https://x.com/Rainmaker1973/status/2121937509449867758",h:"Rainmaker1973",name:"Massimo",f:4451916,at:"2026-11-15T12:05:00.000Z",age:91,views:11426,replies:2,likes:23,reposts:3,quotes:0,vpm:125.6,score:70,genre:"Internet culture",topics:["Internet culture"],tags:[],text:"The beauty of chemistry https://t.co/YflP9gA9ZI",type:"post",ver:!0,bm:7,len:47,thumb:"https://pbs.twimg.com/amplify_video_thumb/2121523307417600000/img/bAjGkdSqR08bLcDs.jpg",media:"video",why:"126 views/min; 91 min old; only 2 replies"},{id:"2121928699691868549",url:"https://x.com/Rainmaker1973/status/2121928699691868549",h:"Rainmaker1973",name:"Massimo",f:4451916,at:"2026-11-15T11:30:00.000Z",age:126,views:14829,replies:6,likes:280,reposts:38,quotes:3,vpm:117.7,score:70,genre:"Internet culture",topics:["Internet culture","Travel & nature"],tags:[],text:"A compilation of birds showing nature\u2019s most beautiful colors https://t.co/gNTLtJlRuA",type:"post",ver:!0,bm:29,len:85,thumb:"https://pbs.twimg.com/amplify_video_thumb/2121515479562940416/img/Y6U3HMLaIiY35c4G.jpg",media:"video",why:"118 views/min; 126 min old; only 6 replies"},{id:"2121923666606948 me:"Historic Vids",f:6062523,at:"2026-11-15T07:00:00.000Z",age:396,views:101672,replies:20,likes:760,reposts:112,quotes:8,vpm:256.7,score:67,genre:"History & facts",topics:["History & facts","Travel & nature"],tags:["tragedy"],text:`Euler\u2019s Disk, a heavy metal spinning toy developed by Joseph Bendik in the late 1980s and named after legendary mathematician Leonhard Euler, produces a fascinating effect. As it spins across a mirrored surface, its wobbling becomes increasingly rapid and its whirring grows louder, until the motion abruptly stops.

In 2000, Cambridge physicist Keith Moffatt published a paper in Nature proposing that air trapped beneath the disk plays a crucial role in its unusual behavior. His theory suggested that the disk\u2019s wobbling frequency approaches a mathematical singularity as it loses energy.

The chips are destined for Samsung, SK Group, Hyundai, Naver and the South Korean government, forming a major part of the country's AI infrastructure expansion.

However, Elon has warned that many of Nvidia's supply agreements were based on handshakes with Huang rather than written contracts.

Elon spoke about the matter by saying, "without Jensen, at least some of those critical deals will be lost."

https://t.co/jLRcsuHTf6`,type:"post",ver:!0,bm:1,len:66,thumb:null,media:null,why:"96 views/min; 155 min old; only 2 replies"},{id:"2121960172541055468",url:"https://x.com/minchoi/status/2121960172541055468",h:"minchoi",name:"Min Choi",f:392563,at:"2026-11-15T13:35:03.000Z",age:1,views:1452,replies:3,likes:5,reposts:1,quotes:0,vpm:1452,score:65,genre:"AI",topics:["AI","Tech","Gaming"],tags:["sports"],text:`Amazon is rebuilding NBA plays in 3D with AI. During live games.

This isn't a drone. It isn't a video game. It's real game footage from a camera angle that never existed.

It's called Prime 360. Here's how it actually works:

1. A ring of cameras
High-res cameras sit in a full perimeter around the court. Every one is calibrated and synchronized, catching the play from all angles.

2. The play becomes a 3D scene
The footage goes to the AWS cloud, where the play is reconstructed as a 3D scene. Once it's a scene, the camera is free. You can fly it through the play, down on the floor, behind a shooter, right next to the ball.

3. Diffusion models paint the picture
Amazon says it runs on diffusion models, the same class of AI behind image generators. Each frame gets split into dozens of overlapping tiles that go through the model one by one.

4. Custom chips make it fast enough for live TV
That's billions of computations per frame. Amazon runs it on its own Trainium chips and says it cut latency by more than 40%, enough to use during live games.

What people miss:

This launched in October. It blew up Friday night because a Knicks vs Pacers reel had everyone saying it looks like NBA 2K.

It's not on every game. Prime 360 shows up in select NBA on Prime broadcasts, in-game and in pregame, halftime and postgame breakdowns.

And Amazon hasn't said how many cameras are in the ring or how long a replay takes to build.

Why it matters:

For years we asked when AI video would look real. This goes the other way. Real footage, rebuilt by AI, so a camera can go where no camera can.

Sports broadcasts are starting to look like video games. Soon video games will look like broadcasts.

Would you watch a whole game like this?`,type:"quote",ver:!0,bm:3,len:1737,thumb:"https://pbs.twimg.com/amplify_video_thumb/2121960123438391296/img/4h5tvg31BlYkv9sh.jpg",media:"video",why:"1,452 views/min; 1 min old; only 3 replies"},{id:"2121942297944133742",url:"https://x.com/people/status/2121942297944133742",h:"people",name:"People",f:7406562,at:"2026-11-15T12:24:02.000Z",age:72,views:3829,replies:1,likes:2,reposts:0,quotes:0,vpm:53.2,score:65,genre:"Celebrity & pop culture",topics:["Celebrity & pop culture","Film & TV","Travel & nature","History & facts"],tags:[],text:"What Happened to the Cast of \u2018Gilligan\u2019s Island\u2019? Inside Their Lives After the Show Premiered Over 60 Years Ago https://t.co/D5qBrcXXaf",type:"post",ver:!0,bm:0,len:135,thumb:null,media:null,why:"53 views/min; 72 min old (sweet spot); only 1 replies"},{id:"2121939278477275442",url:"https://x.com/people/status/2121939278477275442",h:"people",name:"People",f:7406562,at:"2026-11-15T12:12:02.000Z",age:84,views:4715,replies:3,likes:2,reposts:1,quotes:1,vpm:56.2,score:65,genre:"Celebrity & pop culture",topics:["Celebrity & pop culture","Fashion","History & facts"],tags:[],text:"Nicolas Cage Says He Still Doesn\u2019t Know Who Stole Comic Collection Worth Millions from His Home During Christmas Party 26 Years Ago (Exclusive) https://t.co/PX0hmz2Hd5",type:"post",ver:!0,bm:0,len:167,thumb:null,media:null,why:"56 views/min; 84 min old (sweet spot); only 3 replies"},{id:"2121938271173226773",url:"https://x.com/people/status/2121938271173226773",h:"people",name:"People",f:7406562,at:"2026-11-15T12:08:02.000Z",age:88,views:4207,replies:0,likes:0,reposts:0,quotes:0,vpm:47.8,score:65,genre:"Celebrity & pop culture",topics:["Celebrity & pop culture"],tags:[],text:"Yes, You Can Get MacKenzie-Childs Seasonal D\xE9cor for as Little as $6 \u2014 Thanks to This Secret Sale https://t.co/q56zgW1Ynv",type:"post",ver:!0,bm:0,len:121,thumb:null,media:null,why:"48 views/min; 88 min old (sweet spot); only 0 r Fran\xE7ois de La Rochefoucauld\u2019s Maxim 86\u2014\u201CNearly all of our faults are more forgivable than the means we use to hide them\u201D\u2014reveals a profound truth about human nature: our imperfections are often far less damaging than the lies, pride, and deception we use to conceal them. His observation suggests that the desperate effort to appear flawless can compromise our character more deeply than the original mistake.

This idea finds a striking visual parallel in Nicolaes Maes\u2019s 1655 painting The Naughty Boy, also known as The Scolding. The Dutch Golden Age work depicts a young child standing with his head lowered in shame as others respond to his misbehavior. What began as an ordinary act of childhood mischief becomes a moment of embarrassment and judgment. Together, the painting and La Rochefoucauld\u2019s words highlight humanity\u2019s discomfort with admitting fault and the emotional burden of trying to protect ourselves from exposure.`,type:"post",ver:!0,bm:56,len:1050,thumb:"https://pbs.twimg.com/media/HWteQd0WcAAp3V0.jpg",media:"photo",why:"161 views/min; 276 min old; only 11 replies"},{id:"2121959150733176834",url:"https://x.com/konstructivizm/status/2121959150733176834",h:"konstructivizm",name:"Black Hole",f:877654,at:"2026-11-15T13:31:00.000Z",age:5,views:1694,replies:6,likes:10,reposts:3,quotes:1,vpm:338.8,score:57,genre:"Internet culture",topics:["Internet culture"],tags:[],text:`\u{1F30A}Gulf of Mexico

,"Film & TV"],tags:[],text:`An incredibly emotional moment unfolds in Ride On as legendary action star Jackie Chan watches footage of his most unforgettable and dangerous stunts alongside the actress portraying his daughter.

The touching scene reveals a more vulnerable side of the martial arts icon as he reflects on decades of dedication, painful injuries, and extraordinary achievements throughout his filmmaking career.

As clips of his breathtaking jumps, intense fight sequences, and countless stunt mishaps play on screen, the moment becomes a moving tribute to the sacrifices that shaped his legendary career.

Jackie Chan didn\u2019t simply become an action movie star. He transformed the genre by performing his own dangerous stunts, combining incredible martial arts skills with comedy and fearless physical performances that inspired generations of filmmakers.

While most performers followed their lines, Williams frequently abandoned the script and let his creativity take over. His spontaneous jokes, endless character impressions, and lightning-fast delivery often left directors, fellow actors, and production crews struggling to keep up.

Planet TrES-2b \u2014 darker than coal\u{1FA90}

In the constellation Draco, 750 light-years from Earth, hides one of the darkest worlds ever discovered. The gas giant TrES-2b is nearly 1.2 times larger and more massive than Jupiter, yet it reflects almost no light at all \u2014 its albedo is less than 1%. It absorbs nearly every bit of radiation that strikes it.

It races around its Sun-like star at a furious pace, completing a full orbit in just 2.5 Earth days. Because of this extreme proximity, the planet\u2019s surface and atmosphere are scorched to thousands of degrees. Under such conditions, ordinary clouds cannot form. Instead, the atmosphere is filled with a dense haze of metallic particles and gases that greedily swallow light.

Estimated value: $30 million.

He called the shares "blood money".

Mad respect.

(Claude explains the estimate:

"Ballpark: about $30M before tax. Plausible range is $10M to $70M. Nobody has reported his actual number, so this is built up from what\u2019s typical for someone in his role.

What he\u2019s said himself (Patrick Bet-David podcast and other interviews):

- He joined OpenAI through its 6-month training program for math and physics people, when the company had about 300 staff. He stayed about 3 years and calls himself \u201Cpretty junior.\u201D He left around May 2026.
- He still holds the OpenAI shares. He calls them \u201Cblood money,\u201D and when asked if he\u2019d give them up he said \u201CI like money, bro.\u201D He said he gave up \u201C7 figures\u201D of unvested stock by leaving Anthropic.
- He\u2019s living on \u201Cmoney from OpenAI,\u201D which is \u201Cenough for a few years.\u201D That probably means he already sold some shares in OpenAI\u2019s employee buybacks, so his remaining stake could be below my estimate.

The math:

- A junior OpenAI researcher hired around 2023 usually got about $1-2 M in stock spread over 4 years. That was priced when OpenAI was worth about $29B.
- He worked about 3 of those 4 years, so roughly three quarters of the grant vested. Later stock awards would add more, and new investors since then would shrink his slice somewhat.
- If OpenAI goes public around $1.5T, that slice is worth about $20-50 M. Hence roughly $30M.

The IPO price: I\u2019d guess about $1.5T. FutureSearch\u2019s forecast says $1.65T at the median, with a range of $1.0T to $2.5T. I think that\u2019s a bit high. Last week\u2019s private round came in at $1.25T, and OpenAI raised only about half what it was aiming for. The betting markets also sit lower than FutureSearch. Timing is probably 2027 or 2028. Sam Altman has ruled out 2026, and FutureSearch\u2019s middle guess is March 2028.

Caveats: if he started in 2020 (one court filing says so, though his own account doesn\u2019t fit), his shares would be worth more. If his stock was granted after the training program at OpenAI\u2019s higher early-2024 price (~$86B), they\u2019d be worth less, around $10-20 M. Insiders are also usually blocked from selling for about 6 months after an IPO."`,type:"quote",ver:!0,bm:14,len:2260,thumb:"https://pbs.twimg.com/media/HXKKsvyaYAAHOu5.jpg",media:"photo",why:"30 views/min; 182 min old; only 4 replies"},{id:"2121785291526520879",url:"https://x.com/billboard/status/2121785291526520879",h:"billboard",name:"billboard",f:16852121,at:"2026-11-15T02:00:09.000Z",age:696,views:19652,replies:4,likes:19,reposts:2,quotes:1,vpm:28.2,score:48,genre:"Music",topics:["Music"],tags:[],text:`Five Reasons Country Has the Top 5 Songs on the Billboard Hot 100 for the First Time

k', so it's a follow-for-follow account), @maxwilliamson__ (3,066, New Zealand stocks/crypto/commodities analyst), @YieldMemo (711, Toronto dividend investor) and @FLAKAngel292198 (40, spam-looking 'join our team' account). Lost: @sohrabonfire412 (11,163), @Ben1Sal0 (8,799), @masbent_ (7,334) and @Vunchiazuw (449). None of the four new ones replied to you or mentioned you before following. Your last 24h (since 7:35 AM CT Sat): 1 post and 17 replies, all before 11:15 AM CT yesterday, then nothing for 20 hours. Ranked by views: 1) Your post 'Hard to believe that Bitcoin is back at 65K...' (10:05 AM CT Sat): 145 views (+38 overnight), 8 likes, 6 replies, 0 bookmarks. Best post of the day by every number. 2) @bullish1312 'So it's like paper trading for prediction markets': 31 views, 1 like, 1 reply. 3) @AKan99476 'What's good bro, all of the above': 28 views (+12). 4) @Gandalfthegrn 'Depends on who posted it...': 23 views, 2 likes. 5) @Mustafa03648352 Jensen reply: 16 views, 2 replies. The rest were weekend check-ins at 2-17 views. Older stuff still growing overnight: 'We are so close' to @unusual_whales is at 4,128 views (+142), 55 likes, 1 bookmark, your best grower for the third pull in a row; the @RockstarGames reply is at 263,240 (+95), 3,930 likes, 148 bookmarks. About 369 new views across everything since yesterday afternoon. What worked: the Bitcoin post kept pulling conversation, and Bitcoin kept falling (@cryptorover: down 15.6% in 11 days), so the post still reads well. What didn't: no posts or replies after 11:15 AM CT Saturday, so there was nothing new for X to push, and four bigger accounts (8K-11K) unfollowed. Who engaged: @Gandalfthegrn (539) hit 500 followers this morning and thanked you by name in his post (https://x.com/Gandalfthegrn/status/2121942240922566815, 16 replies), and @Momo_Douk45, @bullish1312, @jorjittoo, @StockTortoise, @njcAllocates, @MoneyActuallyUK, @Path21Mil, @LoneGreyWolfUK, @OptionEdgeHQ, @TheIncomeLever, @DAKInvests and @Adarsh_On rred skills on a demo Hermes and ranked them (~21K views)",label:"Worth knowing",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2121725115524391193",why:"Worth a 5-minute look at which skills your Hermes and Grok Bot setups have installed. The 31,132 and 1-in-4 numbers are his summary of NVIDIA's check, so link it instead of restating it as your own stat."},{t:"0xSero: Ornith-1.5-35B-3A running locally on a $3,000 Dell XPS laptop (64GB, integrated graphics) at 30 tok/s, editing a screen recording (~26K views)",label:"Worth knowing",by:"0xSero",u:"https://x.com/0xSero/status/2121859048240992302",why:"Local models on normal laptops keep getting faster. Not useful for the traders yet, but a good one to keep an eye on for cost. Related: @TheAhmadOsman's 'Top 4 open source models to archive in November' (~29K): https://x.com/TheAhmadOsman/status/2121771510562230771"},{t:"rohanpaul_ai: Eric Schmidt says if he could invest in only one AI theme it would be long reasoning, models that can stay on one problem for hours or days (~8K views)",label:"Worth knowing",by:"rohanpaul_ai",u:"https://x.com/rohanpaul_ai/status/2121804554425741703",why:"Good framing if you ever post about why the traders run as long-running agents instead of one-off prompts."},{t:"TheAhmadOsman: 'Opus 5.5 in under 1B by 2029 btw' (~8K views)",label:"Ignore",by:"TheAhmadOsman",u:"https://x.com/TheAhmadOsman/status/2121844393800032434",why:"A prediction with nothing to act on today."}],drafts:[{kind:"Stock market (real headline)",text:`This week: Warsh speaks Monday, Nvidia reports Tuesday with an interim CEO, and there are 15 Fed speaker events.
