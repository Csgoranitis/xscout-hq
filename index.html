Gulf governments have been warned to prepare for possible U.S. strikes shortly after the November 3 midterms, while Qatar is trying to stop things from getting there.

Its mediators spent more than 12 hours in Tehran discussing the nuclear file, sanctions relief and the Strait of Hormuz.

At the same time, the Pentagon is still moving.

Flight-tracking analysis cited in the discussion counted nearly 200 U.S. military transport flights heading toward the Middle East over the past month.

Iran is not sitting around waiting either.

Tehran has warned it could strike first if it becomes convinced an American attack is imminent, while U.S. forces are already under heavy strain escorting shipping through Hormuz.

Then there was one especially unusual detail: an Army exercise involving the temporary burial of thousands of battlefield casualties.

That does not prove a major offensive has been ordered.

But taken together, this looks less like preparation for a quick exchange of missiles and more like both sides getting ready for something that could become much harder to contain.

And inside Washington, the political pressure is building too.

Some Trump allies who once strongly backed him are now openly warning that another Iran war could split his own coalition, cost American lives and become the defining mistake of his presidency.

https://t.co/SixvD0DqFr`,type:"post",ver:!0,bm:5,len:150,thumb:"https://pbs.twimg.com/amplify_video_thumb/2116598772352335872/img/zx8q_8xpaZGX0vp-.jpg",media:"video",why:"549 views/min; 32 min old (sweet spot); only 4 replies"},{id:"2116615932722454783",url:"https://x.com/MarioNawfal/status/2116615932722454783",h:"MarioNawfal",name:"Mario Nawfal",f:3974906,at:"2026-10-31T19:38:57.000Z",age:33,views:34502,replies:57,likes:118,reposts:32,quotes:5,vpm:1043.9,score:83,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:`\u{1F6A8}\u{1F1F5}\u{1F1F1} Polish PM Donald Tusk is DEFENDING the police intervention at the Constitutional Tribunal, and he's making it clear he has NO INTENTION of backing down.

Following the suspension of the court's president, Bogdan \u015Awi\u0119czkowski, protesters clashed with police outside the building in Warsaw.

President Nawrocki calls it an illegal takeover of the judiciary.

Tusk sees things rather differently.

\u201CThe way to maintain peace cannot be to give in to lawlessness and violence.\u201D

He insists the government is restoring judicial independence after years of political interference under PiS.

And that's where Poland's crisis becomes particularly difficult.

The president says the Constitution is being violated. The prime minister says he's enforcing it.

https://t.co/So1k1WAqX2`,type:"post",ver:!0,bm:3,len:183,thumb:null,media:null,why:"280 views/min; 109 min old; only 7 replies"},{id:"2116614919810625670",url:"https://x.com/APompliano/status/2116614919810625670",h:"APompliano",name:"Anthony Pompliano \u{1F32A}",f:2436980,at:"2026-10-31T19:34:56.000Z",age:37,views:10591,replies:19,likes:24,reposts:2,quotes:0,vpm:285.7,score:77,genre:"Crypto",topics:["Crypto","AI","Tech","Celebrity & pop culture"],tags:["sports"],text:`My goal with @cfosilvia is to build the best piece of software for serious investors who want to control their own money.

The big idea is that AI technology can help these investors navigate the complexities of managing their household finances, especially when it comes to tax, estate planning, investment decisions, and generational wealth transfer. 

Anyone can sign up, connect their financial accounts, and begin talking to Silvia about their finances. The more context you give her, the more helpful she can be. 

My initial suggestion for every user is to connect your accounts and then ask Silvia to interview you, so she gets relevant information that will make her even better at her job. 

Today we have over 20,000 investors and more than $60 billion in assets connected to the platform. The average user is a multi-millionaire and paying users ask Silvia 20+ questions per week. 

Given the product touches personal financial data, it has been important to me since day one that we embrace three core ideas of privacy, security, and accuracy. 

For example, we applied for SOC II certification when there was literally only me and @shaincodes at the company. Almost no one does that, but the privacy and security of our users is front-and-center for us.

Additionally, we have spent the last ~ 6 months rebuilding the AI tech stack to reduce our dependency on frontier models. This has allowed us to improve the accuracy of Silvia's answers on important personal finance topics like tax, mortgage, and credit cards. 

If you search the internet or here on X, you will find tons of people who love the product. They are tired of the amateurish budgeting and saving apps. These individual investors need a product that can help them grow their assets and net worth, not save $5 on Starbucks.

We are proud of the product we have built and think there is tons of room for improvement too. Our team is currently only ~ 10 full-time employees, so we are rapidly shipping new features and products with the hopes of delivering on Silvia's core promise to help serious investors accelerate their net worth growth.

If this approach resonates with you, I would appreciate it if you took a few minutes to sign up for the product and gave it a try. It is free to use when you get started and you only have to pay if you become a power user. 

Try Silvia: https://t.co/bMI7hLeK8s 

Feedback is a gift, so once you have tried the product, please send any ideas on how we could improve it. No idea is too small or too silly. We can only build the best product if we have smart users who share their ideas. 

I appreciate you reading this far and hope you enjoy using Silvia. We are having a blast building it.

In February, it hired a Singapore company to develop ketamine wafers that dissolve under wounded soldiers' tongues, easing severe pain without an injection.

The idea is simple. Give medics a quicker way to treat wounded soldiers, especially now that some other battlefield painkillers are no longer available.

Sounds good. Except there's a problem.

The company's U.S. partner in Nevada, which is supposed to make the wafers, doesn't even have the license it needs to operate.

And it's already tried twice to get one. Both times, it pulled back its application after regulators made clear they weren't ready to approve it.

Now the FDA timeline is slipping too.

The company originally wanted to apply for emergency authorization by the end of 2026. But that's been pushed back, and it now expects to file within the next 12 months.

So the Pentagon has nearly $41 million riding on a new battlefield painkiller, while the company still hasn't figured out how to make it in the U.S.

It's impressive to see how well this book has aged, and at the same time, how much faster its predictions have come true than expected. For example:

At the beginning of the book, Bostrom writes that at that time (2014), Go computers would be playing in the amateur leagues, and - according to his prediction - if development continued at its current pace, they would win the world championship in 10 years.

Well, as we know, things happened much faster: In 2016, Google's AlphaGo defeated Lee Sedol and catapulted itself into the world rankings. And in 2017, AlphaGo Zero followed up, mastering the ancient board game of Go completely from scratch.

The other predictions have also become reality far more quickly: image analysis, object recognition, and controlling a robot are particularly challenging, and a general intelligence that "understands natural language as well as an adult" is the future, capable of "everything humans are capable of."

Twelve years later, in 2026, almost everything has become reality and arrived faster than expected. The most difficult unsolved mathematical problems are being solved weekly. A review using this book clearly demonstrates how exponential the current developments are and how quickly all expectations have been met. I highly recommend rereading this book.`,type:"post",ver:!0,bm:28,len:1442,thumb:"https://pbs.twimg.com/media/HV98JPgXcAAtcen.jpg",media:"photo",why:"126 views/min; 67 min old (sweet spot); 36 replies"},{id:"2116597102004293807",url:"https://x.com/people/status/2116597102004293807",h:"people",name:"People",f:7389531,at:"2026-10-31T18:24:08.000Z",age:108,views:4649,replies:2,likes:7,reposts:2,quotes:0,vpm:43.1,score:62,genre:"Celebrity & pop culture",topics:["Celebrity & pop culture"],tags:[],text:"Multiple Chili\u2019s Customers Suffer Chemical Burns After Drinking Margaritas Made with Cleaning Product Mistaken for Sugar https://t.co/3YT7YJAxVf",type:"post",ver:!0,bm:0,len:144,thumb:null,media:null,why:"43 views/min; 108 min old; only 2 replies"},{id:"2116594297533243637",url:"https://x.com/Complex/status/2116594297533243637",h:"Complex",name:"Complex",f:2661559,at:"2026-10-31T18:12:59.000Z",age:119,views:6367,replies:1,likes:18,reposts:9,quotes:1,vpm:53.5,score:62,genre:"Fashion",topics:["Fashion"],tags:[],text:"LL COOL J to be Named Living Landmark by New York Landmarks Conservancy Details: https://t.co/x4Mvhs1jse https://t.co/28pt4HXURQ",type:"post",ver:!0,bm:3,len:128,thumb:"https://pbs.twimg.com/media/HV-nS9LXkAAQIL8.jpg",media:"photo",why:"53 views/min; 119 min old; only 1 replies"},{id:"2116621227414454323",url:"https://x.com/Pirat_Nation/status/2116621227414454323",h:"Pirat_Nation",name:"Pirat_Nation \u{1F534}",f:373058,at:"2026-10-31T20:00:00.000Z",age:12,views:3769,replies:12,likes:65,reposts:5,quotes:0,vpm:314.1,score:62,genre:"Gaming",topics:["Gaming","Celebrity & pop culture"],tags:[],text:`Someone has spray-painted SaveMassEffect outside EA\u20
