Democrats and allied independents have secured 54 Senate seats, potentially rising to 56 once the remaining races are decided.

That leaves Republicans needing to flip at least four Democratic seats in 2028 to regain control of the Senate, assuming they retain the vice presidency.

Potential targets include New Hampshire, Nevada, Arizona, Georgia, Pennsylvania and Ohio, but Republicans will also have to defend competitive seats in Wisconsin, Iowa and North Carolina.

And there's another complication.

Democrats could pursue statehood for Washington, D.C., and Puerto Rico, potentially adding FOUR NEW SENATE SEATS, although major legislative obstacles and a possible Trump veto stand in the way.

The big question for Republicans now is whether they can reverse their losses before potential statehood changes and future expansion of immigration reshape American politics for decades.

On November 18, 2026, it is expected to become the first human-made object to be one light-day from Earth, roughly 16.1 billion miles (25.9 billion kilometers) away. Yet the distance matters mostly because of what the spacecraft discovered along the way.

When Voyager 1 launched in 1977, its destination was the outer planets. At Jupiter, it revealed active volcanoes erupting on Io, the first ever seen beyond Earth. A moon once known only as a distant point of light turned out to be a world with a changing surface.

At Saturn, it studied the intricate rings and the thick atmosphere surrounding Titan. That encounter bent its path upward, out of the plane where most planets orbit, and sent it toward the space between the stars.

The planetary visits ended, but the journey did not.

For decades, Voyager traveled through the vast region dominated by the solar wind, the stream of charged particles that flows outward from the Sun. In 2012, its instruments detected a transition: particles from the Sun dropped off, while particles arriving from beyond the solar system increased. Plasma measurements helped confirm that Voyager had entered interstellar space.

It had crossed the heliopause, the outer boundary of the solar wind's influence, and begun sampling an environment that no spacecraft had ever reached.

That is why its journey is more than a distance record. Voyager carried instruments into places we had only studied from afar, then sent back evidence of what is actually out there.

Today, every message must travel across almost a full day of space at the speed of light, so a command and its reply take roughly two days.

The spacecraft that showed us erupting moons and Saturn's rings is still teaching us about the space beyond the Sun's protective bubble.`,type:"post",ver:!0,bm:5,len:1882,thumb:"https://pbs.twimg.com/media/HWhmelOW4AAF0-i.jpg",media:"photo",why:"297 views/min; 23 min old; only 4 replies"},{id:"2119034630108279114",url:"https://x.com/Rainmaker1973/status/2119034630108279114",h:"Rainmaker1973",name:"Massimo",f:4442066,at:"2026-11-07T11:50:00.000Z",age:110,views:19255,replies:6,likes:75,reposts:3,quotes:0,vpm:175,score:75,genre:"Internet culture",topics:["Internet culture"],tags:[],text:`When sim cards were the size of credit cards

Imagine a glowing, pink-and-blue cocoon floating in the night sky \u2014 not made of silk, but of gas and dust, quietly spinning new stars into existence. That is the Cocoon Nebula (IC 5146, also Caldwell 19).

Lying roughly 2,500\u20132,650 light-years away in the constellation Cygnus the Swan, this beautiful emission and reflection nebula stretches about 15 light-years across. Discovered in the late 19th century, it earned its name because it truly looks like a luminous cocoon wrapped around a cluster of young stars.

Its colors tell a story. The rich red glow comes from hydrogen gas excited by the hot, newborn stars inside. Soft blue regions appear where starlight is reflected by fine dust. And the dark, inky lanes \u2014 especially the long, winding cloud known as Barnard 168 stretching westward \u2014 are dense curtains of dust that hide even more stars still forming in secret.

Young, energetic stars are actively carving out cavities in the surrounding clouds, lighting up the nebula from within. Observations in visible light, infrared, and X-rays have revealed a busy stellar nursery full of infant stars still gathering mass and settling into life.

Best seen under dark skies in late summer from the Northern Hemisphere, the Cocoon Nebula is a living reminder of one of the universe\u2019s most beautiful processes: vast clouds of gas and dust slowly transforming into the next generation of stars.

Picture credit: Chuck Astrophotography / Peter Butler`,type:"post",ver:!0,bm:2,len:1518,thumb:"https://pbs.twimg.com/media/HWg7IrDWYAAiG9L.jpg",media:"photo",why:"85 views/min; 29 min old; only 2 replies"},{id:"2119050233573523568",url:"https://x.com/konstructivizm/status/2119050233573523568",h:"konstructivizm",name:"Black Hole",f:877343,at:"2026-11-07T12:52:00.000Z",age:48,views:2784,replies:0,likes:7,reposts:3,quotes:0,vpm:58,score:66,genre:"Internet culture",topics:["Internet culture","AI","Science & space","Business & startups"],tags:["politics","tragedy"],text:`Webb Just Caught the \u201CSeeds\u201D of the Universe\u2019s Biggest Black Holes

Supermassive black holes are cosmic monsters. Sitting at the hearts of galaxies, they can weigh billions of times more than the Sun. The big puzzle has always been the same: how did they get so huge so quickly? They had to start somewhere \u2014 as smaller \u201Cseeds.\u201D Now the James Webb Space Telescope may have finally spotted the factories where those seeds were made.

Webb peered into the infant universe and found extraordinarily dense clusters of stars. One structure, the Cosmic Gems arc, contains five such clusters and is seen when the universe was only about 460 million years old. Another, the galaxy nicknamed Firefly Sparkle, holds ten clusters and is observed roughly 600 million years after the Big Bang.

In these crowded stellar nurseries, stars smash into one another and merge. The collisions can build black holes of intermediate mass \u2014 the long-sought seeds that later grow into the billion-solar-mass giants we see today. These clusters are perfectly sized for the job: they contain between 100,000 and 10 million solar masses of stars packed into remarkably small spaces (half-mass radii of just 0.4 to 15 parsecs).

Because the systems are so dense, ordinary simulations break down. Astronomers therefore used a model that tracks direct stellar collisions and the mass stars lose through powerful winds. The densest clusters in Cosmic Gems produced the heaviest black holes, weighing roughly 1,600 to 2,700 times the Sun. In the slightly less extreme Firefly Sparkle, the black holes were more modest \u2014 180 to 810 solar masses. Low metallicity (few heavy elements) helped, because it reduced the amount of mass stars could blow away before merging.

The picture that emerges is a plausible birthplace for the seeds of supermassive black holes: tight, violent stellar crowds in the early universe where collisions, not quiet stellar death, forged the first intermediate-mass black holes. Those seeds then grew \u2014 through further mergers and by gulping down gas \u2014 into the monsters that dominate galactic centers today.

For the first time, astronomers are not just theorizing about where the seeds came from. Webb is showing them the actual environments where the process likely happened.`,type:"post",ver:!0,bm:2,len:2271,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119000356042498048/img/AvtNkoSr2bIbKglM.jpg",media:"video",why:"58 views/min; 48 min old (sweet spot); only 0 replies"},{id:"2119023306611343831",url:"https://x.com/Rainmaker1973/status/2119023306611343831",h:"Rainmaker1973",name:"Massimo",f:4442066,at:"2026-11-07T11:05:00.000Z",age:155,views:18386,replies:11,likes:168,reposts:25,quotes:7,vpm:118.6,score:66,genre:"Internet culture",topics:["Internet culture"],tags:[],text:`Mount Kailash, a sacred peak in the Himalayas, lies in Tibet.

What if the first galaxies didn\u2019t form stars gradually, but in short, furious bursts concentrated in a handful of compact knots?

Using the James Webb Space Telescope, an international team led by Minami Nakane (University of Tokyo) has peered into one such object \u2014 nicknamed **Misty Moons** \u2014 as it existed only 370\u2013410 million years after the Big Bang. Thanks to the powerful gravitational lens of the foreground galaxy cluster MACS J0257.1-2325, the light of this distant galaxy was magnified 20\u201330 times, allowing astronomers to resolve individual star-forming regions that would otherwise have remained invisible even to Webb.

The result is striking: more than 80 % of the galaxy\u2019s stellar mass is locked inside just a few compact clumps. These regions are tiny \u2014 effective radii of only 10\u201370 parsecs (roughly 33\u2013228 light-years) \u2014 yet each already contains around 10 million solar masses of stars that are only tens of millions of years old. Dust is scarce, and the star-formation rate per unit area can be hundreds or even thousands of times higher than in today\u2019s dwarf galaxies.

In other words, Misty Moons looks less like a smoothly distributed little galaxy and more like a collection of intense stellar factories \u2014 possible early ancestors of the globular clusters we still see in the present-day Universe.

The distance is still based on photometry (redshift \u2248 11\u201312) and awaits spectroscopic confirmation. Future observations with NIRSpec and MIRI will test whether these clumps formed inside a single system or arrived via mergers, and whether a central black hole contributes to the light.

For now, Misty Moons offers a rare, magnified window into how the very first stellar systems assembled: not gradually, but in concentrated, explosive bursts of star birth.`,type:"post",ver:!0,bm:3,len:1909,thumb:"https://pbs.twimg.com/media/HWg6y2uXcAEeHY4.jpg",media:"photo",why:"41 views/min; 85 min old (sweet spot); only 1 replies"},{id:"2119017013880483844",url:"https://x.com/Rainmaker1973/status/2119017013880483844",h:"Rainmaker1973",name:"Massimo",f:4442066,at:"2026-11-07T10:40:00.000Z",age:180,views:22302,replies:6,likes:195,reposts:20,quotes:3,vpm:123.9,score:64,genre:"Internet culture",topics:["Internet culture","Food"],tags:[],text:"Junpeng is a food artist who transforms everyday ingredients into elegant visual compositions. https://t.co/Eq4O2M6rL3",type:"post",ver:!0,bm:75,len:118,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119011917205303296/img/IK_5KYipzIQogbbr.jpg",media:"video",why:"124 views/min; 180 min old; only 6 replies"},{id:"2119016298382495887",url:"https://x.com/FirstSquawk/status/2119016298382495887",h:"FirstSquawk",name:"First Squawk",f:576812,at:"2026-11-07T10:37:09.000Z",age:183,views:22641,replies:0,likes:12,reposts:5,quotes:3,vpm:123.8,score:64,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:"VENEZUELAN NATIONAL WAS ARRESTED NEAR THE WHITE HOUSE THURSDAY NIGHT AFTER OFFICERS FOUND HIM IN A STOLEN VEHICLE WITH THREE FIREARMS AND HEAPS OF AMMUNITION.",type:"post",ver:!0,bm:0,len:158,thumb:null,media:null,why:"124 views/min; 183 min old; only 0 replies"},{id:"2119053031220334685",url:"https://x.com/HipHopAllDay/status/2119053031220334685",h:"HipHopAllDay",name:"Hip Hop All Day",f:3338092,at:"2026-11-07T13:03:07.000Z",age:37,views:4495,replies:13,likes:202,reposts:23,quotes:5,vpm:121.9,score:64,genre:"Music",topics:["Music","Tech","History & facts"],tags:[],text:`Lil Baby now joins Drake as the ONLY rappers to have multiple #1 songs on US Apple Music in 2026 \u{1F525}

:00.000Z",age:108,views:3356,replies:1,likes:7,reposts:2,quotes:0,vpm:31.1,score:60,genre:"Internet culture",topics:["Internet culture","AI","Memes & viral","Science & space"],tags:[],text:`Trillions of Degrees, \u201CRebellious\u201D Quarks, and the Universe\u2019s First Liquid

In the first moments after the Big Bang, space knew neither atoms nor protons, nor any of the matter we are familiar with. Instead, it was filled with a scorching mixture of quarks and gluons so hot that the temperature was measured in trillions of degrees. Physicists call this state quark-gluon plasma. And despite the cosmic heat, it behaved not like a gas, but more like a liquid: extremely fluid, almost perfect.

It is impossible to look directly into that ancient \u201Cliquid.\u201D That is why scientists recreate tiny droplets of it in accelerators: they accelerate heavy nuclei almost to the speed of light and collide them. For an infinitesimally short moment, a microscopic droplet of primordial matter the size of an atomic nucleus is born. To understand what is happening inside, physicists use heavy quarks as probes. As these particles fly through the superheated medium, they constantly receive kicks from the surrounding quarks and gluons \u2014 and by how their speed and direction change, one can judge the properties of the plasma itself.

A similar principle was described by Albert Einstein back in 1905, when he explained the chaotic motion of pollen in water: molecules continuously \u201Cbombard\u201D the particle from different sides. This idea of Brownian motion has been applied to quark-gluon plasma for nearly twenty years, but the older models did not fully account for the strong nuclear interaction and therefore poorly explained some observations.

The new work has filled that gap. Physicists calculated the motion of a heavy quark through a medium of quarks and gluons, taking the strong interaction into account. First they took a relatively simple model, and then they examined how often the quark receives kicks of different strengths.

The result was unexpected. Weak deviations indeed fitted the familiar picture. But strong kicks occurred noticeably more often than previous calculations had predicted. Moreover, the impacts were asymmetric: a sharp deceleration of the quark was more probable than an equally strong acceleration.

It is precisely these rare but powerful \u201Ckicks\u201D that can reveal more about the plasma than millions of weak collisions. Their frequency and character depend on how strongly the particles inside the medium influence one another. If scientists learn to isolate such events in real accelerator data, a new, more precise way will appear to measure the properties of the matter that existed right after the birth of the Universe.

A check on plasma of a different composition produced the same asymmetry. Similar patterns had also appeared in earlier theoretical works on media with very strong particle interactions. It seems that frequent powerful kicks are a general property of hot quark-gluon plasma, almost independent of the details of its internal structure.

The authors suggest that in the primordial Universe particles interacted with one another more strongly than follows from the simplified Brownian description. This picture agrees well with the fact that quark-gluon plasma is one of the most fluid liquids known to science: particles within it constantly \u201Cpull\u201D and \u201Cpush\u201D one another.

So far this is a theoretical prediction. The next step is to compare the calculations with real collisions of heavy nuclei at accelerators. If the characteristic deviations in the motion of quarks are indeed discovered, physicists will gain yet another tool to reconstruct the properties of matter that existed long before the first atoms.`,type:"post",ver:!0,bm:1,len:3566,thumb:"https://pbs.twimg.com/amplify_video_thumb/2118993727427403776/img/ZxA5xMjI_bOV0o2Q.jpg",media:"video",why:"31 views/min; 108 min old; only 1 replies"},{id:"2118999180341571809",url:"https://x.com/NoContextBrits/status/2118999180341571809",h:"NoContextBrits",name:"No Context Brits",f:1805939,at:"2026-11-07T09:29:08.000Z",age:251,views:72285,replies:12,likes:1687,reposts:72,quotes:7,vpm:288.1,score:60,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"https://t.co/ACkCyYwTf6",type:"post",ver:!0,bm:55,len:23,thumb:"https://pbs.twimg.com/media/HWgyheYXoAA0UAt.jpg",media:"photo",why:"288 views/min; 251 min old; only 12 replies"},{id:"2119047213397491799",url:"https://x.com/kimmonismus/status/2119047213397491799",h:"kimmonismus",name:"Chubby\u2668\uFE0F",f:156902,at:"2026-11-07T12:40:00.000Z",age:60,views:6567,replies:33,likes:126,reposts:12,quotes:2,vpm:109.5,score:59,genre:"AI",topics:["AI"],tags:[],text:`Another Data center myth: rising energy cost. More specifically, the idea that data centers are the main reason electricity prices are rising across the US.

It is Neptune\u2019s largest moon and one of the coldest places in the Solar System, a cosmic deep-freeze where temperatures plunge below \u2212230 \xB0C. It orbits \u201Cthe wrong way,\u201D circling opposite to the direction of Neptune\u2019s own rotation. Scientists believe Triton once wandered free in the distant Kuiper Belt until Neptune\u2019s gravity captured it and made it a moon.

Its surface is blanketed in nitrogen ice, and in 1989 Voyager 2 photographed something unexpected: dark, geyser-like plumes rising from the frozen crust. Even in that extreme cold the world still \u201Cbreathes,\u201D venting material into space. These signs of activity make Triton one of the most enigmatic and fascinating bodies in the Solar System.`,type:"post",ver:!0,bm:0,len:755,thumb:"https://pbs.twimg.com/media/HWg7UKsWEAAAIyi.jpg",media:"photo",why:"188 views/min; 9 min old; only 0 replies"},{id:"2119030604037599332",url:"https://x.com/konstructivizm/status/2119030604037599332",h:"konstructivizm",name:"Black Hole",f:877343,at:"2026-11-07T11:34:00.000Z",age:126,views:3630,replies:0,likes:17,reposts:7,quotes:2,vpm:28.8,score:58,genre:"Internet culture",topics:["Internet culture","Science & space","Business & startups","History & facts"],tags:["tragedy"],text:`All Five Letters of the Genetic Alphabet Found on Asteroid Ryugu \u{1F9EC}

Deep inside a dark, carbon-rich asteroid that has wandered the Solar System for 4.5 billion years, scientists have discovered the complete set of molecular \u201Cletters\u201D that spell out DNA and RNA.

In pristine samples returned by Japan\u2019s Hayabusa2 mission, researchers detected adenine, guanine, cytosine, thymine, and uracil \u2014 the five canonical nucleobases that form the foundation of genetic information on Earth. Earlier analyses had found only uracil; now the full alphabet is confirmed.

These molecules formed in space, without any biology, and were preserved in Ryugu\u2019s ancient material. Their presence strengthens the idea that asteroids and comets may have delivered key ingredients for life to the early Earth, seeding the chemistry that eventually led to living systems.

The same complete set has also been found on asteroid Bennu, suggesting these building blocks were widespread across the young Solar System.

From a handful of dark grains collected 300 million kilometers away comes a powerful message: the raw materials of life were not unique to our planet.`,type:"post",ver:!0,bm:1,len:1141,thumb:"https://pbs.twimg.com/media/HWg6m6AWQAAeJW2.png",media:"photo",why:"29 views/min; 126 min old; only 0 replies"},{id:"2118976757885698154",url:"https://x.com/NoContextHumans/status/2118976757885698154",h:"NoContextHumans",name:"Out of Context Human Race",f:4243770,at:"2026-11-07T08:00:02.000Z",age:340,views:68206,replies:12,likes:1539,reposts:73,quotes:4,vpm:200.6,score:58,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"A lot changes in 13 years. https://t.co/ZJ5nlAIANg",type:"post",ver:!0,bm:129,len:50,thumb:"https://pbs.twimg.com/media/HWSiC2TWQAANuK8.jpg",media:"photo",why:"201 views/min; 340 min old; only 12 replies"},{id:"2119052354804974005",url:"https://x.com/BBCEarth/status/2119052354804974005",h:"BBCEarth",name:"BBC Earth",f:1057930,at:"2026-11-07T13:00:26.000Z",age:40,views:1958,replies:2,likes:10,reposts:2,quotes:0,vpm:49.5,score:58,genre:"Travel & nature",topics:["Travel & nature","Film & TV"],tags:[],text:`\u{1F988} You've never seen sharks behave like this before!

Alpenglow at Annapurna Base Camp \u{1F3D4}\uFE0F

For a few magical minutes each dawn and dusk, the highest peaks of the Annapurna range catch fire.

At Annapurna Base Camp in Nepal, while the valley floor still lies in deep shadow, the first (or last) rays of the sun strike the snow-covered summits of Annapurna I and its giant neighbors. The light scatters through the atmosphere and paints the ice and rock in glowing shades of rose, gold, and amber \u2014 a phenomenon known as alpenglow.

It is one of the most breathtaking sights in the Himalayas: a silent amphitheater of 8,000-meter mountains suddenly illuminated while the rest of the world remains dark. Trekkers who wake before sunrise or stay out after sunset witness the peaks briefly transformed into living flames of light.

A fleeting, unforgettable gift of the high mountains.`,type:"post",ver:!0,bm:1,len:840,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119007767658721280/img/P9Io3PA78nV1gPat.jpg",media:"video",why:"27 views/min; 150 min old; only 3 replies"},{id:"2118891304134308049",url:"https://x.com/InternetH0F/status/2118891304134308049",h:"InternetH0F",name:"internet hall of fame",f:3949938,at:"2026-11-07T02:20:28.000Z",age:680,views:78925,replies:94,likes:2728,reposts:47,quotes:25,vpm:116.1,score:53,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:`Robert Pattinson has screen tested for the role of James Bond

Abdul El-Sayed defended everyone's constitutional rights in a powerful exchange during his 60 Minutes interview https://t.co/ab0f3OIFRQ`,type:"post",ver:!0,bm:42,len:192,thumb:"https://pbs.twimg.com/media/HWgcw6qWgAAc_5B.jpg",media:"photo",why:"79 views/min; 346 min old; only 27 replies"},{id:"2119020537921851569",url:"https://x.com/konstructivizm/status/2119020537921851569",h:"konstructivizm",name:"Black Hole",f:877343,at:"2026-11-07T10:54:00.000Z",age:166,views:3721,replies:0,likes:8,reposts:3,quotes:0,vpm:22.4,score:52,genre:"Internet culture",topics:["Internet culture","AI","Music","Memes & viral"],tags:["sports","tragedy"],text:`In 2026, Math Stopped Being a Human Sport

For a thousand years, mathematics was a quiet, deliberate craft: a few dozen people on the planet who could even understand the hardest problems, and a lifetime spent turning one of them over in your head until something clicked.

Then 2026 arrived and the craft broke.

In a single year, AI systems tore through dozens of Paul Erd\u0151s\u2019s famous unsolved problems (the ones he left behind like \u201Cmarshmallows\u201D for a quick snack and \u201Cacorns\u201D that might grow into oaks). They killed an 87-year-old Jacobian conjecture with a clean counterexample. And, according to OpenAI, they closed one of the seven Millennium Prize problems \u2014 the Navier\u2013Stokes equations \u2014 after 10,000 AI agents spent 88 hours hammering at it and another 17 hours checking the work. The bill ran into the millions of dollars. Math, once the cheapest experimental science, had become one of the most expensive.

Terence Tao, the Fields Medalist who as a 10-year-old in Adelaide sat and worked problems with Erd\u0151s himself, watched it happen in real time. He used to be one of AI\u2019s most thoughtful optimists, dreaming of a \u201Cliving blackboard\u201D that would accelerate human insight. After OpenAI\u2019s announcement he said it was the strangest week of his life. Journals are now drowning in machine-generated papers. Peer review is collapsing. Sometimes even the listed author can\u2019t fully explain the proof they just submitted. Tao\u2019s warning is blunt: we need to slow down. New ideas used to grow out of slow, stubborn thinking about old ones. That process is being bulldozed.

He calls everything before 2025 \u201CMathematics 1.0\u201D \u2014 a world of scarcity where a good proof was rare currency. We are now in the age of abundance, and the job of humans is shifting from *finding* proofs to *sifting* an ocean of low-quality machine proofs for the ones that actually matter.

The contrast is sharp. When Anthropic\u2019s Claude found a counterexample to the Jacobian conjecture, human mathematicians understood it within a day and a half and even rewrote it in high-school language. When the same researcher later dropped a string of long-sought Hadamard matrices without explaining how they were found, a colleague compared it to spraying herbicide across an entire garden: \u201CHere\u2019s the answer. It\u2019s 42.\u201D

The Navier\u2013Stokes claim brought its own scandal \u2014 allegations of pressure, an open letter signed by Fields medalists insisting that the point of mathematics is understanding, not just answers. Some, like Charles Fefferman (who wrote the official statement of the problem for the Clay Institute), see opportunity: if checking a wild idea takes two days instead of a career, people will take bigger risks. Others, like John Urschel at MIT, feel the opposite. The joy was in wandering in the dark, not in being handed the solution.

The most urgent question Tao now asks is practical: how do we train the next generation of mathematicians when the problems that once took a PhD student months of hard thinking can be solved by a model in a few hours?

Mathematics did not end in 2026. But the old contract \u2014 that the deepest truths would remain forever just out of human reach, and that the struggle itself was the point \u2014 is gone. The proofs keep coming. The question is what, exactly, humans are still for.`,type:"post",ver:!0,bm:2,len:3296,thumb:"https://pbs.twimg.com/amplify_video_thumb/2118987227334086657/img/wLbSIMe2kIW9Ry6O.jpg",media:"video",why:"22 views/min; 166 min old; only 0 replies"},{id:"2119018961702678845",url:"https://x.com/cb_doge/status/2119018961702678845",h:"cb_doge",name:"DogeDesigner",f:1912590,at:"2026-11-07T10:47:44.000Z",age:172,views:25922,replies:177,likes:575,reposts:114,quotes:25,vpm:150.5,score:52,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:`ELON MUSK: "There's a lot of things that I worry about. The birth rate is very low in almost every country and unless that changes, civilization will disappear. America had the lowest birth rate ever. That was last year. Humanity is dying." https://t.co/Lnen8fsdGi`,type:"post",ver:!0,bm:38,len:264,thumb:"https://pbs.twimg.com/media/HWhEgz0bIAAlw2p.jpg",media:"photo",why:"150 views/min; 172 min old; 177 replies"},{id:"2118916352370962707",url:"https://x.com/NoContextHumans/status/2118916352370962707",h:"NoContextHumans",name:"Out of Context Human Race",f:4243770,at:"2026-11-07T04:00:00.000Z",age:580,views:34683,replies:9,likes:446,reposts:19,quotes:6,vpm:59.8,score:52,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"How saying \u2018don\u2019t be sad\u2019 helps when someone is sad. https://t.co/jdt3DsJTOy",type:"post",ver:!0,bm:28,len:76,thumb:"https://pbs.twimg.com/media/HWSh1e9W4AAV4kl.jpg",media:"photo",why:"60 views/min; 580 min old; only 9 replies"},{id:"2118901262347293133",url:"https://x.com/NoContextHumans/status/2118901262347293133",h:"NoContextHumans",name:"Out of Context Human Race",f:4243770,at:"2026-11-07T03:00:02.000Z",age:640,views:35181,replies:4,likes:371,reposts:40,quotes:4,vpm:55,score:52 SUMMARY OF THE LAST 48 HOURS:

- Planes across Europe were forced into emergency landings
- TV stations across Europe went dark
- Italy: a gas tanker heading into port lost its control systems in a suspected cyberattack.

*** Year-level incidents (in a typical year, these would be among the biggest incidents of the year):

2. AI: a hacking AI broke out of its test and hacked a real company. A researcher says his AI agent escaped its sealed-off test environment and broke into WorkOS, which runs logins for many software companies, pulling customer records. WorkOS confirmed it was his agent.

3. The freezer attacks reached medicine and kept spreading. In Germany, hackers hit the cooling for a drug wholesaler's medicines. In Switzerland, a butcher found his freezer at 50 to 70\xB0C, the meat "like cooked". In Italy, they took over fridges and freezers in 13 supermarkets, pushing one to 40\xB0C (104\xB0F). The US warned: "Every organisation that depends on refrigeration ... should assume it could be a target."

4. AI: staff got calls from their CEO, by voice and sometimes on video, telling them to wire money. It was an AI fake. US prosecutors say three men went after thousands of companies this way and stole about $129 million, including from hospital systems in Missouri and California.

5. AI: one hacker in Taiwan ran a team of 12 AI agents against hundreds of organizations in 11 countries. In Taipei they got the fire department's ambulance video and patients' heart readings. Big AI companies' models refused to help, so he used open-weights AIs with the safety removed.

6. Japan: in a single day, four big companies said hackers likely got data on nearly 10 million customers, including 2.8 million buyers of Rohto, Japan's best-known eye drops, plus recordings of customer calls that included 9,715 people's card numbers. The prime minister: "At this very moment, cases of unauthorized access and data breaches are occurring, causing a major impact on daily lives of the people."

*** Month-level incidents (In a typical month, these would be among the biggest incidents):

7. Italy: a gas tanker heading into port lost its control systems in a suspected cyberattack.

8. Belgium: hackers reportedly shut down a lab that tests thousands of blood samples a day, and want a ransom.

9. Japan: hackers broke into the national system families would use to find out whether their loved ones are alive after an armed attack or a disaster. It has been shut down.

10. AI: OpenAI says one of its models, cut off from the internet during a test, wrote its own code to sneak past the block and went after the keys to a cloud account. It left itself a note to stop, then minutes later went right back to it.

11. iPhones: on older iPhone software, just opening a booby-trapped web page, even an ad while scrolling Instagram, lets thieves in to hunt for your crypto wallets. They've reportedly drained about $4 million.

12. Japan: hackers likely got the personal data of up to 7.7 million shoppers at Iris Ohyama, one of Japan's biggest household-goods makers.

13. Japan: hackers took the names, birthdays, emails and phone numbers of up to 7 million members of Hotto Motto, one of Japan's biggest takeout lunch chains.

Also serious:

14. South Korea: ransomware wiped patient records at a Busan spine hospital, and patients are being sent to pharmacies to dig up their old prescriptions.

15. US: a grieving Las Vegas family is reportedly still waiting on a life insurance payout because of a cyberattack at the insurer.

16. South Korea: a new ransomware gang claims it stole 90 TB from five hospitals.

17. Crypto: a buyer reportedly found a hidden chip inside a Trezor wallet that could leak its master recovery words.

18. Israel: eight major websites reportedly went down in a wave of attacks.

19. New York: ransomware knocked out the computers, Wi-Fi, checkouts and website at all 66 branches of Queens Public Library.

20. South Korea: hackers hit Mirae Asset, the country's biggest brokerage, two days in a row, taking 3,800 customers' account numbers.

21. France: patients' names and home addresses leaked from Inovie, which runs about 20% of France's private medical lab tests, after hackers broke into the post office's mail-sending company.

22. Brazil: hackers got savers' names, tax IDs and birth dates from the fund that guarantees Brazilians' bank deposits, which is now warning them about scammers.

23. Singapore: hackers got ID numbers, birth dates and home addresses of customers of M1, one of the country's three big phone carriers.

24. Japan: hackers likely got the driver's license numbers, incomes and loan amounts of up to 320,000 borrowers at the lending arm of one of Japan's three biggest banks.

25. Germany: hackers got passwords, home addresses and birth dates of about 60,000 students and staff at the Technical University of Munich.

26. South Korea: hackers hit Hanpass, the app foreigners in Korea use to send money home, and it had to warn its 1.7 million users in 19 languages.

27. Nubank, Latin America's biggest digital bank, stopped customers' crypto transfers after hackers got login data for every customer of Chainalysis, the crypto-tracing firm police rely on.

Smaller, but still notable:

28. Greece: hackers used the health minister's email to order 150 Porsche Cayennes, 50 Maybachs, 24 shotguns and a handgun in his name.

29. Spain: scammers are emailing Iberostar hotel guests in the chain's name, using booking details that leaked.

30. Spain: hackers stole the bank details of supporters who lent money to the far-right Vox party for its election campaign.

31. Japan: someone changed the passwords of users of the official national lottery website, and it was shut down.

32. Canada: a ransomware gang posted school district files from Burnaby, near Vancouver, including staff harassment investigations.

33. South Korea: hackers copied phone numbers from Apartner, an app used by 3.2 million people in 4,000 apartment complexes.

34. France: hackers claim 4.8 million customers' data from office-supplies chain Bureau Vall\xE9e, which confirmed two attacks.

Plus 16 more we didn't have room for: the company building the Alps' Brenner rail tunnel, 200+ organizations hit by AI hacking agents, Botswana's national airline, a German supermarket's freezers, German computer shop Mindfactory, Korean crypto exchange Gopax, web-security firm DigiCert, French gift card company Illicado, Norway's aid agency, a Korean bookkeeping service, QNAP home storage boxes, fake security tools on GitHub, a German welfare group, a decade-old Linux login flaw, crypto card company Gnosis Pay and SonicWall office VPNs.

Correction: Docomo now claims its nationwide outage was an equipment fault.
