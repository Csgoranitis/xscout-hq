Nvidia's board can still make things right.

It has now been 48 hours since Jensen Huang resigned from his role as CEO, President, and board member of Nvidia.

Meanwhile, a thorough investigation has not been completed, countless critical questions are unanswered, and one of the world's greatest CEOs was forced out before the full facts of the situation were established.

In fact, the US Attorney General, the CIA, the DNI, and members of the House Intelligence Committee have also suggested that the current evidence remains inconclusive regarding whether Jensen Huang was involved in an affair with a Chinese spy.

The reality is that Jensen Huang resigned in the heat of the moment and the board acted based on speculative information.

We believe Nvidia's board, $NVDA, has a duty to shareholders to openly acknowledge that Jensen Huang could return to the company, pending a thorough investigation.

What happens in a CEO's personal life should not automatically dictate his role in a company, particularly if an investigation fails to establish national security misconduct or other wrongdoing that warrants removal.

The right move is to acknowledge that Jensen Huang is innocent until proven guilty.

Nvidia's board must do this now. It is not too late.`,type:"post",ver:!0,bm:131,len:1290,thumb:null,media:null,why:"2,413 views/min; 70 min old (sweet spot); only 262 replies; on pace for 100K+ views, where your replies do best"},{id:"2121574060144644587",url:"https://x.com/animetv_jp/status/2121574060144644587",h:"animetv_jp",name:"AnimeTV \u30C1\u30A7\u30FC\u30F3",f:1647209,at:"2026-11-14T12:00:47.000Z",age:101,views:119958,replies:50,likes:6578,reposts:729,quotes:94,vpm:1185.2,score:93,genre:"Anime",topics:["Anime","Film & TV","TV & streaming"],tags:["sports"],text:`Re:ZERO -Starting Life in Another World- Season 5 Officially Announced!

The haunting line \u201CHell is empty and all the devils are here\u201D comes from William Shakespeare\u2019s play The Tempest, written around 1610\u20131611. The words are spoken by Ariel while recounting the terror of a violent https://t.co/UQLvFIX0CI`,type:"post",ver:!0,bm:35,len:302,thumb:"https://pbs.twimg.com/media/HWp5gWgXkAA5Ww0.jpg",media:"photo",why:"242 views/min; 162 min old; only 10 replies"},{id:"2121597770087727429",url:"https://x.com/Rainmaker1973/status/2121597770087727429",h:"Rainmaker1973",name:"Massimo",f:4450923,at:"2026-11-14T13:35:00.000Z",age:7,views:5046,replies:2,likes:6,reposts:2,quotes:0,vpm:720.9,score:69,genre:"Internet culture",topics:["Internet culture","Science & space","Animals & wholesome","Health & fitness"],tags:[],text:`Could extending female fertility help address declining global birth rates? Researchers in China are actively exploring how to make that concept a reality. Hongmei Wang, a reproductive biologist at the State Key Laboratory of Stem Cell and Reproductive Biology in Beijing, is investigating a straightforward biological hypothesis. Because women are born with a finite reserve of eggs that naturally depletes over time, leading to menopause once that supply runs low, reducing the frequency of ovulation could theoretically conserve those eggs for a longer period.

Wang and her research group are currently testing this hypothesis in laboratory animal models. Speaking with the newspaper El Pa\xEDs, she noted that delaying menstruation or extending a woman's reproductive lifespan may be technically achievable. Alongside ovulation suppression, her laboratory is also investigating stem cell techniques aimed at rejuvenating ovarian function.

This research arrives as women worldwide increasingly delay childbirth, and as United Nations demographic projections warn that China's population could decline by half by the year 2100 if current birth trends persist. Developing a safe method to slow down the ovarian clock could grant women greater flexibility and extended time to decide when, or if, they wish to have children.

Nevertheless, this concept remains strictly an early-stage experimental hypothesis undergoing animal testing rather than a viable clinical treatment, and it carries a major physiological drawback. As Wang explains, suppressing ovulation successfully preserves the remaining egg reserve, but it simultaneously blocks the production of estrogen, a vital hormone that protects bone density, cardiovascular health, and brain function. She also emphasizes that whether women would actually desire such an intervention remains an entirely separate social question. Still, if scientists can engineer a way to preserve eggs without sacrificing natural estrogen production, it could transform the future of women's reproductive medicine.`,type:"post",ver:!0,bm:0,len:2053,thumb:"https://pbs.twimg.com/media/HXFtcjyWYAA095E.jpg",media:"photo",why:"721 views/min; 7 min old; only 2 replies"},{id:"2121442835392053631",url:"https://x.com/DramaAlert/status/2121442835392053631",h:"DramaAlert",name:"DramaAlert",f:826090,at:"2026-11-14T03:19:21.000Z",age:623,views:194036,replies:17,likes:2486,reposts:89,quotes:6,vpm:311.6,score:69,genre:"Internet culture",topics:["Internet culture"],tags:[],text:"FAA Ground stop visualized\u2026 insane.  https://t.co/UDk2rNk1C1",type:"post",ver:!0,bm:382,len:60,thumb:"https://pbs.twimg.com/amplify_video_thumb/2121390332189249536/img/4PlObJNCkYq0xTrt.jpg",media:"video",why:"312 views/min; 623 min old; only 17 replies; on pace for 100K+ views, where your replies do best"},{id:"2121483270877774310",url:"https://x.com/InternetH0F/status/2121483270877774310",h:"InternetH0F",name:"internet hall of fame",f:3946534,at:"2026-11-14T06:00:01.000Z",age:462,views:173905,replies:95,likes:14175,reposts:400,quotes:26,vpm:376.4,score:69,genre:"Memes & viral",topics:["Memes & viral","Gaming"],tags:[],text:`Rockstar says every NPC in 'GTA 6' was individually designed

Astronomers have spotted a quiet, city-sized ghost tugging on a red giant star in the system J0008+0128. The unseen companion weighs somewhere between 1.8 and 2.8 times the mass of the Sun (best estimate: 2.2 solar masses). That places it right on the edge of\u2014or possibly inside\u2014the long-mysterious \u201Cmass gap\u201D between neutron stars and black holes.

Neutron stars are the crushed cores left behind when massive stars explode. Most weigh around 1.4 solar masses and are packed into a sphere only about 12 miles across. Nothing heavier than roughly 2.5 solar masses has ever been confirmed. Black holes, by contrast, usually start at about 5 solar masses. The awkward empty zone in between has puzzled astronomers for years.

What makes this object even stranger is its orbit. The pair takes about 3.3 years to circle each other on a surprisingly wide, nearly circular path. Most heavy neutron stars live in tight binaries and bulk up by stealing material from a companion. This one appears too far away to do that, and there are no signs of such feeding. After running hundreds of thousands of binary-evolution simulations, researchers still couldn\u2019t reproduce the system under standard assumptions. It may have formed only under extreme conditions\u2014or through some channel we don\u2019t yet understand.

It could still turn out to be a low-mass black hole, a pair of closer objects, or the remnant of a past merger. Whatever it is, this nearly invisible heavyweight is giving scientists a rare probe into the extreme physics that decides whether a dying star becomes a neutron star or collapses all the way into a black hole.

Source: Science Advances

This faint white smudge at the bottom of a glass tube is pure stardust\u2014microscopic diamonds forged in the dying breaths of ancient stars that lived, exploded, and scattered their ashes long before our Sun was born.  

They are more than 4.6 billion years old. Older than the Earth. Older than the solar system itself.  

Extracted from the Cold Bokkeveld meteorite (a rare carbonaceous chondrite that fell in South Africa in 1838), these pre-solar grains survived the birth of our solar system, the violence of asteroid collisions, and a journey through space before finally falling to Earth.  

You are looking at the ashes of stars that no longer exist.

On 20 October 2026 at 04:41 Japan Standard Time, an H3 rocket lifted off from Tanegashima Space Center carrying the Martian Moons eXploration (MMX) probe. Roughly 71 minutes later the spacecraft separated cleanly and began its roughly ten-month cruise to Mars. Led by JAXA and involving NASA, ESA, CNES and DLR, the mission aims to become the first to return material from the Martian system.

The scientific prize is solving a long-standing riddle: are Phobos and Deimos captured asteroids, or are they chunks of debris blasted into orbit when a massive body slammed into early Mars? Because Phobos orbits so close to the planet, the samples may also contain tiny grains of genuine Martian material ejected by impacts \u2014 a free bonus sample of the Red Planet itself.

MMX is a hefty ~4.5-tonne craft with solar arrays spanning nine metres. It is scheduled to enter Mars orbit in August 2027 and then settle into a quasi-satellite orbit around Phobos the following month, flying in formation with the moon while mapping its surface in detail.

In early 2029 the mission will drop the 25 kg Franco-German rover Idefix. Phobos\u2019s gravity is only about 1/2000th of Earth\u2019s, so the rover will be released from roughly 40 metres, bounce several times, then deploy its wheels to scout safe landing zones. In 2030 the main spacecraft itself will make one or two brief touchdowns, using two different sampling systems to gather at least 10 grams of regolith from depths of a few centimetres.

The return capsule is targeted to land in Australia in 2031. Ten grams sounds modest, but laboratory instruments on Earth can extract far more information from those grains than any instrument that could be flown to Phobos. Along the way the mission will also rehearse the technologies needed to bring material \u2014 and eventually people \u2014 home from the Mars system.
