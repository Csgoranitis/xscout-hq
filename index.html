al",topics:["Memes & viral"],tags:["politics"],text:`\u{1F1F8}\u{1F1FB}\u{1F1ED}\u{1F1F9} El Salvador sends MORE TROOPS into gang-ravaged Haiti

Fresh Salvadoran forces have reportedly landed in Port-au-Prince as military flights continue despite worsening weather.

El Salvador has reportedly deployed over 2,000 personnel, with unverified estimates suggesting numbers could eventually reach 5,000.

The reinforcements arrive as gangs control much of Haiti's capital and international forces struggle to restore security.

Source: The Washington Sun, Reuters, Axios / Writer: Marie`,thumb:"https://pbs.twimg.com/media/HVz5nWAaQAEJm0o.jpg",media:"photo",why:"466 views/min; 40 min old (sweet spot); only 15 replies"},{id:"2115868769759174884",url:"https://x.com/MarioNawfal/status/2115868769759174884",h:"MarioNawfal",name:"Mario Nawfal",f:3972697,at:"2026-10-29T18:10:00.000Z",age:50,views:27622,replies:33,likes:164,reposts:36,quotes:6,vpm:552.4,score:81,genre:"Memes & viral",topics:["Memes & viral","Crypto"],tags:["politics","sports"],text:`\u{1F1EA}\u{1F1FA} Christine Lagarde is QUITTING the European Central Bank nine months early.

And she's leaving behind one hell of an unfinished project.

The ECB president will step down on February 7, 2027, after years of fighting Bitcoin, defending the euro and trying to sell 450 million Europeans on the DIGITAL EURO.

A government-backed digital currency that practically nobody asked for.

Lagarde says she wants the freedom to speak her mind about politics and world affairs.

Fair enough. But why leave nine months early?

Her beloved digital euro is still stuck in political negotiations, with no guarantee it will ever see the light of day.

And now its biggest cheerleader is walking out before the project even gets off the ground.

Maybe the timing means nothing. Maybe Lagarde knows something we don't.

But there's something rather amusing about spending years lecturing people about Bitcoin, championing a digital currency controlled by central bankers, and then leaving before anyone gets to use it.

Wouldn't it be something if the digital euro ended up retiring with her?

The Intelligence Index is still our primary measure of current model intelligence. It uses the evaluations most relevant to developers today, so its mix changes as evaluations are added and retired, and scores from different versions can\u2019t be compared.

The Progress Index is built for comparisons across time. It uses item response theory, a statistical method used to score standardized tests, to estimate one general capability score for each model from the underlying tasks in all our evaluations, including those that are retired or excluded from the Intelligence Index.

Use the Intelligence Index to choose a model today. Use the Progress Index to see how capability has changed over time.

The Progress Index builds on prior work placing models on a single capability scale, in particular @EpochAIResearch's Epoch Capabilities Index and the capability scale @AnthropicAI published in its Claude Mythos Preview system card.

Key takeaways:

\u27A4 Since reasoning models arrived, the frontier has risen ~65 to 70 points a year, about double the 2023 pace: the highest score among released models rose 35 points in 2023 (GPT-3.5 Turbo 125 to GPT-4 Turbo 160), 67 in 2024 (to o1 at 228), 68 in 2025 (to GPT-5.2 at 296) and 56 so far in 2026 (to Gemini 4 Carbon at 352).

\u27A4 Open weights models generally trail proprietary models by about 4 months: since January 2025, each new highest open weights score came 2-8 months (median ~4) after a proprietary model first reached it. DeepSeek V4.1 Flash 1017 is the highest-scoring model with released weights at 324, a level Claude Fable 5 reached in June 2026. Kimi K3.1 Pro (weights not yet released) scores 341, about two months after the closed frontier

\u27A4 New frontier scores are being set more often: the highest score among released models was raised on 2 release dates in 2023, 4 in 2024, 9 in 2025 and 11 so far in 2026. That is about once every four weeks this year.

\u27A4 OpenAI has held the top score most of the time since November 2022, but the frontier has become a close contest: OpenAI held the number one position for the first 27 months measured, but in 2026 especially there have been rapid changes in the leader between OpenAI, Anthropic, and now Google`,thumb:"https://pbs.twimg.com/media/HVz-yc0aAAAtRK7.jpg",media:"photo",why:"120 views/min; 131 min old; only 40 replies"},{id:"2115836056499065114",url:"https://x.com/Crunchyroll/status/2115836056499065114",h:"Crunchyroll",name:"Crunchyroll",f:10456748,at:"2026-10-29T16:00:00.000Z",age:180,views:30544,replies:7,likes:407,reposts:56,quotes:5,vpm:169.7,score:65,genre:"Anime",topics:["Anime","Film & TV"],tags:["sports"],text:`One last dream \u{1F499} The conclusion to the Rascal Does Not Dream series is here.

To extract oxygen from lunar dust you need a lot of concentrated solar heat. To collect that heat you need a very large mirror. The catch is that \u201Cvery large\u201D and \u201Cdeliver to the Moon\u201D are expensive enemies. Every extra kilogram and cubic meter drives the cost of the mission sharply upward.

L\u2019Garde\u2019s solution is an inflatable parabolic concentrator. Folded, it is a compact package that fits easily inside a rocket. Once on the lunar surface the reflective membrane deploys and inflates into a large, high-precision mirror.

The company has been working on this technology for years. Under the Highly Accurate Inflatable Reflector program it built a three-meter inflatable reflector with excellent surface accuracy. Later it studied much larger versions specifically intended as space solar concentrators.

In 2021 NASA awarded L\u2019Garde SBIR funding to develop a lightweight solar concentrator for ISRU \u2014 primarily to extract oxygen from lunar regolith using concentrated sunlight. In Phase 1 the team designed a full-scale system and successfully demonstrated the folding and deployment mechanism on small prototypes. In 2022 NASA provided another $749,941 for Phase 2, which covered design optimization, construction of a demonstration prototype, and tests of optical concentration performance and environmental durability.

Phase 2 ended in May 2024. The test results have not been publicly released.

NASA is also exploring the process itself. In the CaRD project, concentrated sunlight was used to process lunar regolith simulant and produce carbon monoxide \u2014 an intermediate step toward oxygen extraction. These experiments are useful. But without a major reduction in the mass and volume of the hardware (exactly what L\u2019Garde is working on), even promising technologies risk remaining stuck on Earth for a long time.

That is why inflatable concentrators are more than an engineering trick \u2014 they are one of the practical keys to making a lunar industry real.`,thumb:"https://pbs.twimg.com/media/HVz_lprWsAAam_k.jpg",media:"photo",why:"64 views/min; 39 min old (sweet spot); only 2 replies"},{id:"2115866036826153119",url:"https://x.com/CNET/status/2115866036826153119",h:"CNET",name:"CNET",f:3071719,at:"2026-10-29T17:59:08.000Z",age:61,views:2760,replies:0,likes:0,reposts:0,quotes:0,vpm:45.3,score:65,genre:"Science & space",topics:["Science & space","Film & TV","Gaming"],tags:[],text:"Keep spooky season going a little longer with these PlayStation Plus games in November. https://t.co/Ri5yzxzcc9 https://t.co/QxCzqYKLJ5",thumb:"https://pbs.twimg.com/media/HV0Q8nqWMAAxd8B.jpg",media:"photo",why:"45 views/min; 61 min old (sweet spot); only 0 replies"},{id:"2115861679133040941",url:"https://x.com/newscientist/status/2115861679133040941",h:"newscientist",name:"New Scientist",f:4315802,at:"2026-10-29T17:41:49.000Z",age:78,views:3754,replies:1,likes:12,reposts:0,quotes:1,vpm:48,score:65,genre:"Science & space",topics:["Science & space"],tags:[],text:"Often described as a genius, physicist Sabrina Pasterski built and flew her own plane by the age of 16 and is now developing a mind-bending idea that could finally unify gravity and quantum theory https://t.co/JFdwIEb97M",thumb:null,media:null,why:"48 views/min; 78 min old (sweet spot); only 1 replies"},{id:"2115868098376892572",url:"https://x.com/engadget/status/2115868098376892572",h:"engadget",name:"Engadget",f:3650132,at:"2026-10-29T18:07:20.000Z",age:53,views:3461,replies:3,likes:0,reposts:0,quotes:0,vpm:65.7,score:65,genre:"Tech",topics:["Tech","Cars"],tags:[],text:"BMW's latest EV will do over 450 miles on a charge and even close its own doors. https://t.co/ARpzJh5UZH",thumb:"https://pbs.twimg.com/media/HV0SzxxXgAAkOvB.jpg",media:"photo",why:"66 views/min; 53 min old (sweet spot); only 3 replies"},{id:"2115863827640107203",url:"https:/
