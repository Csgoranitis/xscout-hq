- Horace

Horace\u2019s timeless wisdom reveals how perfectionism and the fear of failure can prevent people from ever taking action. When individuals become consumed by the possibility of making mistakes or falling short of expectations, they often avoid trying altogether. Ironically, this hesitation guarantees the very failure they were hoping to escape.

Are miners becoming AI infrastructure companies first and Bitcoin miners second? https://t.co/GfHwkoi3x2`,type:"post",ver:!0,bm:5,len:214,thumb:"https://pbs.twimg.com/media/HWw5OYWWgAA2Vhp.jpg",media:"photo",why:"373 views/min; 73 min old (sweet spot); only 46 replies"},{id:"2120143185725067337",url:"https://x.com/Rainmaker1973/status/2120143185725067337",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T13:15:00.000Z",age:30,views:6725,replies:2,likes:11,reposts:2,quotes:1,vpm:224.2,score:78,genre:"Internet culture",topics:["Internet culture","Celebrity & pop culture","Travel & nature","Health & fitness"],tags:[],text:`Statistical modeling indicates that the probability of encountering an ideal romantic partner purely by chance is approximately 1 in 562. This calculation was developed by British mathematician and television broadcaster Rachel Riley, who evaluated data on behalf of the matchmaking platform eHarmony in 2017. 

Working alongside researchers from the University of Bath, the team integrated 18 distinct socioeconomic and personal criteria that dictate romantic compatibility, encompassing specific age brackets, perceived physical attractiveness, current relationship status, and geographical search boundaries. Following the strict application of these multi-layered demographic filters, only roughly 84,000 individuals out of the entire adult population of the United Kingdom successfully fulfilled the average consumer requirements, producing the final probability metrics.

The mathematical outlook, however, varies significantly based on demographic variables and individual lifestyle habits. For instance, residents of London experienced superior baseline odds of 1 in 394 due to the sheer density of the local urban population. Furthermore, the likelihood of establishing a meaningful connection paradoxically improved alongside advancing age, shifting from an unfavorable 1 in 1,024 for individuals aged 18 to 24 up to a more favorable 1 in 304 for those within the 65 to 74 age group. 

The probabilistic analysis ultimately concluded that small, deliberate behavioral modifications, including visiting fitness centers, expanding professional networks, widening geographic travel parameters, and utilizing online dating applications, all systematically shift the statistical distributions in favor of the individual.

[Walker-Arnott, E. The odds of finding love in London today are... Time Out London]`,type:"post",ver:!0,bm:2,len:1810,thumb:"https://pbs.twimg.com/media/HWw9a3dXgAAaMmN.jpg",media:"photo",why:"224 views/min; 30 min old (sweet spot); only 2 replies"},{id:"2120141926485950674",url:"https://x.com/Rainmaker1973/status/2120141926485950674",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T13:10:00.000Z",age:35,views:7519,replies:2,likes:30,reposts:1,quotes:1,vpm:214.8,score:78,genre:"Internet culture",topics:["Internet culture","Animals & wholesome"],tags:[],text:"A compilation of cats caught red-handed https://t.co/S0LPdGHv88",type:"post",ver:!0,bm:7,len:63,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119840149483708416/img/p-OEugghdATRjovs.jpg",media:"video",why:"215 views/min; 35 min old (sweet spot); only 2 replies"},{id:"2120140669289431453",url:"https://x.com/Rainmaker1973/status/2120140669289431453",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T13:05:00.000Z",age:40,views:8379,replies:1,likes:24,reposts:4,quotes:1,vpm:209.5,score:78,genre:"Internet culture",topics:["Internet culture","Science & space","Food","Animals & wholesome"],tags:[],text:`A preclinical discovery indicates that a specific strain of gut bacteria works in tandem with fasting cycles to activate cellular repair mechanisms prior to tissue injury. Investigators at The University of Texas MD Anderson Cancer Center demonstrated that a 24-hour fasting period significantly elevates the concentration of a symbiotic gut bacterium, Akkermansia muciniphila, within the small intestine. This microbial population secretes a short-chain fatty acid metabolite known as propionate. Working in conjunction with the host metabolic shifts induced by food deprivation, propionate chemically alters histones to relax the structural packaging around epithelial DNA. 

This epigenetic restructuring allows intestinal stem cells to preemptively transcribe genes linked to tissue regeneration. Consequently, when the intestinal lining subsequently sustains damage from radiation exposure, these pre-primed cells proliferate rapidly to accelerate structural restoration. Conversely, when the research team depleted this bacterial population using targeted antibiotics, the radioprotective benefits of fasting were entirely lost. Restoring the specific bacterial strain completely reinstated the protective effect.

Radiation oncology treatments targeting abdominal or pelvic malignancies frequently cause collateral damage to the highly sensitive mucosal architecture of the small intestine, triggering severe gastrointestinal side effects and occasionally forcing clinicians to limit therapeutic radiation doses. Because strict fasting protocols are frequently impractical or unsafe for oncological patients undergoing active treatment, the investigators hope that therapeutic administration of either Akkermansia muciniphila or its primary metabolite, propionate, could eventually mirror these protective benefits without requiring dietary restriction.

Nevertheless, because these findings are derived from a preclinical animal study, it remains unknown whether an identical microbial mechanism occurs in human subjects or if it can safely enhance clinical outcomes during clinical radiotherapy. Despite these translational limitations, the study identifies a clear, accessible biological lever via native gut microbes to protect healthy tissue during cancer care. Moving forward, the investigators plan to explore whether this microbial priming network can be leveraged to safeguard other rapidly dividing tissues, such as bone marrow.

[Chen, H., et al. (2026). Fasting primes small intestinal regeneration after damage via Akkermansia muciniphila-produced propionate. Proceedings of the National Academy of Sciences, 123(28), e2529215123. DOI: 10.1073/pnas.2529215123]`,type:"post",ver:!0,bm:15,len:2680,thumb:"https://pbs.twimg.com/media/HWw9G1jXsAAqorC.jpg",media:"photo",why:"209 views/min; 40 min old (sweet spot); only 1 replies"},{id:"2120138151985373381",url:"https://x.com/Rainmaker1973/status/2120138151985373381",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T12:55:00.000Z",age:50,views:9234,replies:2,likes:53,reposts:21,quotes:0,vpm:184.7,score:78,genre:"Internet culture",topics:["Internet culture","AI","Music","Cars"],tags:["tragedy"],text:`An innovative preclinical approach is transforming the body's native immune cells into targeted oncological destroyers without requiring external laboratory manipulation. Researchers at MIT engineered specialized lipid nanoparticles to transport a messenger RNA payload directly to natural killer cells. While these innate cells naturally defend the body, the internal delivery of mRNA provides them with genetic programming to synthesize a specific chimeric antigen receptor. To ensure high selectivity, the outer surfaces of the nanoparticles are functionalized with specific antibody fragments that guide the delivery system directly to the receptors on the natural killer cells.

This localized in vivo engineering technique bypasses the logistical bottlenecks that limit current cellular immunotherapies. Conventional chimeric antigen receptor treatments require an expensive and time-consuming manufacturing workflow, where patient cells must be isolated, structurally altered, and cultivated ex vivo before being reintroduced. Directing this modification within the living organism simplifies the therapeutic pipeline, though definitive cost reductions and manufacturing efficiencies await confirmation in upcoming human clinical trials.

The therapeutic platform demonstrated high efficacy across several distinct animal paradigms. In a melanoma model, 60% of the treated mice achieved complete disease remission. Furthermore, the protocol completely eradicated malignancy in a separate T-cell lymphoma mouse model engrafted with human blood cells following five systematic nanoparticle administrations. Natural killer cells are uniquely suited for targeting T-cell malignancies because using engineered T cells to eradicate diseased T cells often results in severe fratricide, where the therapeutic cells aggressively neutralize each other. 

The investigative team extended the utility of this technology to non-cancerous pathology by assessing its impact on autoimmune hepatitis, a state where aberrant T cells attack functional liver hepatocytes. A single nanoparticle injection selectively ablated these destructive, autoreactive T cells, allowing the damaged hepatic tissue to repair itself. While these versatile data highlight therapeutic potential spanning oncology and autoimmunity, the conclusions are based entirely on preclinical mouse models. Rigorous clinical evaluation is mandatory to verify the safety, therapeutic efficacy, and long-term durability of the system within human patients.

[Chen, Y., Monkovic, J., Mughal, H., et al. (2026). In vivo engineering of CAR natural killer cells for immunotherapy using ligand-directed lipid nanoparticles. Nature Biotechnology DOI: 10.1038/s41587-026-03310-1]`,type:"post",ver:!0,bm:22,len:2728,thumb:"https://pbs.twimg.com/media/HWw8NP8WIAASTtO.jpg",media:"photo",why:"185 views/min; 50 min old (sweet spot); only 2 replies"},{id:"2120136893362847801",url:"https://x.com/Rainmaker1973/status/2120136893362847801",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T12:50:00.000Z",age:55,views:9570,replies:1,likes:38,reposts:2,quotes:0,vpm:174,score:78,genre:"Internet culture",topics:["Internet culture","Memes & viral"],tags:[],text:"This is what real drift footwork looks like https://t.co/LMv1EeNS6K",type:"post",ver:!0,bm:7,len:67,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119845744492359680/img/1GIwXmuapFnry3V2.jpg",media:"video",why:"174 views/min; 55 min old (sweet spot); only 1 replies"},{id:"2120135635285758047",url:"https://x.com/Rainmaker1973/status/2120135635285758047",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T12:45:00.000Z",age:60,views:11100,replies:3,likes:42,reposts:2,quotes:1,vpm:185,score:78,genre:"Internet culture",topics:["Internet culture"],tags:[],text:"That time a rogue runaway vehicle wreaked havoc at Chicago's O'Hare International Airport, spiraling out of control and nearly crashing into a plane parked at the gate. https://t.co/wKEsVHvb3a",type:"post",ver:!0,bm:3,len:192,thumb:"https://pbs.twimg.com/ext_tw_video_thumb/1178781372623785985/pu/img/N9_xpO9SylHDQ0ez.jpg",media:"video",why:"185 views/min; 60 min old (sweet spot); only 3 replies"},{id:"2120131865462145329",url:"https://x.com/Rainmaker1973/status/2120131865462145329",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T12:30:01.000Z",age:75,views:13200,replies:1,likes:61,reposts:6,quotes:2,vpm:176,score:78,genre:"Internet culture",topics:["Internet culture"],tags:[],text:"This lady saw there was a prob The site also works as a care hub under a harm-reduction approach. Residents can reach mental health therapy, treatment for substance use, and case managers on the same floor. Operators report that more than 870 people have stayed there, that nearly 340 have moved into permanent housing, and that staff have reversed more than 260 overdoses on site.

- Friedrich Nietzsche

This interpretation connects Friedrich Nietzsche\u2019s criticism of weakness disguised as virtue with Gustave Dor\xE9\u2019s 1874 painting The Saltimbanques, exploring the relationship between strength, vulnerability, and genuine morality.

Nietzsche challenges the idea that being harmless automatically makes someone good. He argues that avoiding harm simply because one lacks the power to inflict it\u2014having \u201Cno claws\u201D\u2014is not necessarily virtue, but powerlessness. True moral strength comes from possessing the ability to cause harm while consciously choosing restraint.

Dor\xE9\u2019s haunting painting reflects themes of suffering and helplessness, portraying a family of traveling performers mourning their gravely injured child. The heartbreaking scene emphasizes the contrast between human vulnerability and the unforgiving realities of life, offering a powerful visual reflection on suffering, strength, and the meaning of morality.`,type:"post",ver:!0,bm:64,len:1022,thumb:"https://pbs.twimg.com/media/HWjZulJXYAAHaJ2.jpg",media:"photo",why:"250 views/min; 165 min old; only 12 replies"},{id:"2120148218834993391",url:"https://x.com/Rainmaker1973/status/2120148218834993391",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T13:35:00.000Z",age:10,views:4366,replies:1,likes:8,reposts:1,quotes:0,vpm:436.6,score:69,genre:"Internet culture",topics:["Internet culture","AI","Music","Memes & viral"],tags:[],text:`Biomedical researchers successfully induced human cells sourced from individuals over the age of 50 to activate specific pluripotency genes within a single week. The resulting induced pluripotent stem cells satisfied rigorous diagnostic evaluations validating their physiological health and genomic structural integrity. This discovery marks a substantial leap in cellular reprogramming, a discipline where traditional engineering strategies spent nearly two decades attempting to optimize the efficiency of the biological pathways responsible for resetting cellular identity. 

To achieve this breakthrough, OpenAI partnered with the longevity biotechnology firm Retro Biosciences to engineer a specialized foundation model designated as GPT-4b micro. This artificial intelligence architecture was trained heavily on expansive protein sequences and proteomic datasets rather than natural language. Designers utilized the model to entirely re-engineer two of the original Yamanaka factors, which are the famous core transcription factors that earned a Nobel Prize in 2012 for their ability to revert mature somatic cells into a pluripotent state. The synthetic variants produced by the model, named RetroSOX and RetroKLF, diverged from their wild-type ancestral sequences by an average of more than 100 amino acid residues. Despite these profound structural variations, the machine-designed proteins provoked over a 50-fold increase in the expression of crucial cellular reprogramming markers during laboratory screenings.

Historically, reverting specialized adult cells back into stem cells has been an exceptionally slow and highly inefficient process, regularly succeeding in fewer than 1 out of 1,000 targeted cells. This persistent barrier has severely restricted efforts to manufacture functional replacement tissues and to analyze how senescent cells might be biochemically rejuvenated. In addition to accelerating the overall timeline from several weeks down to just seven days, the newly engineered variants demonstrated an enhanced capability to facilitate DNA double-strand break repair within the host genome, indicating that their biological utility extends beyond simple conversion speed. 

It is important to note that these experimental milestones were achieved entirely within in vitro laboratory cultures. Furthermore, the findings were disclosed directly via corporate technical announcements by OpenAI and Retro Biosciences rather than through a traditional, peer-reviewed scientific journal. Additionally, OpenAI Chief Executive Officer Sam Altman maintains a significant personal financial investment in Retro Biosciences. Nevertheless, this development serves as clear evidence that artificial intelligence can deliberately optimize core biological mechanisms, offering a robust new approach for automated tool design within regenerative medicine.

OpenAI & Retro Biosciences. (2025, August 22). Accelerating life sciences research. OpenAI]`,type:"post",ver:!0,bm:1,len:2964,thumb:"https://pbs.twimg.com/media/HWw-F88W4AA_8ri.jpg",media:"photo",why:"437 views/min; 10 min old; only 1 replies"},{id:"2120146962104090646",url:"https://x.com/Rainmaker1973/status/2120146962104090646",h:"Rainmaker1973",name:"Massimo",f:4444314,at:"2026-11-10T13:30:00.000Z",age:15,views:5433,replies:6,likes:32,reposts:3,quotes:1,vpm:362.2,score:69,genre:"Internet culture",topics:["Internet culture"],tags:[],text:`Sheep frequently fall over onto their backs, and it can be fatal.

That same night, body snatchers dug up the fresh grave. Unable to pull the ring from her finger, they began cutting it off. The sudden flow of blood shocked the still-living Marjorie out of her deep coma. She sat upright in the coffin and screamed, terrifying the robbers, who fled and reportedly never returned to their grim trade.

Covered in dirt and still wearing her burial clothes, Marjorie climbed out of the grave and walked home. When she knocked on the door, her husband John, still in mourning, jokingly remarked that if his wife were alive, he would swear it was her at the door. Upon opening it and seeing Marjorie standing before him \u2014 alive, bleeding, and in her shroud \u2014 he collapsed from shock and died on the spot.

John McCall was later buried in the grave originally dug for his wife.

Marjorie survived the ordeal, eventually remarried, and had several children. When she died many years later, she was laid to rest in Shankill Cemetery in Lurgan. Her headstone famously reads:

Japanese astrophysicist Koji Tsumura from Tohoku University decided to test one of the boldest ideas out there: what if other civilizations in the Milky Way don\u2019t just exist, but have already been searching for each other and built a shared communication network? How realistic is it for our civilization to connect to that network?

The answer is pretty grim: almost impossible.

Why almost no one can hear us

There are billions of Sun-like stars in the Galaxy, and millions of them should have planets in the habitable zone. The classic Drake equation suggests there ought to be a lot of intelligent civilizations. But then we run into the famous Fermi paradox: \u201CSo where is everybody?\u201D

Tsumura started from the most optimistic scenario \u2014 civilizations exist, they\u2019re active, and they\u2019ve already built a galaxy-wide network. Even then, everything depends on location. The galactic habitable zone isn\u2019t the entire Galaxy; it\u2019s a relatively narrow band where three things line up:

- enough heavy elements to form planets,
- stars that live long enough,
- and not too many nearby supernovae sterilizing everything around them.

Modeling showed that the most densely populated part of the Galaxy is probably about 3,000 light-years closer to the center than the Solar System. We\u2019re sitting roughly 26,000 light-years from the center \u2014 on the rather distant periphery. Out in these \u201Csuburbs,\u201D the chances of plugging into a shared network are essentially zero. Either there are simply too few civilizations for a network to exist at all.
 Can we at least detect anyone?

Detecting even one extraterrestrial civilization is theoretically possible, but only if it:

- exists at the same time as we do,
- is deliberately beaming a signal toward the Sun,
- and is doing so in a way we can actually notice.

According to Tsumura\u2019s calculations, the fact that we still haven\u2019t heard anyone means there\u2019s a 35\u201338% chance that there really is nobody within about 6,000 light-years of us. But there\u2019s a 61\u201365% chance that civilizations do exist \u2014 we just can\u2019t detect them for some reason.

In other words: our cosmic loneliness is not yet proof that the Milky Way is empty. We might simply be sitting in a quiet neighborhood where signals either don\u2019t reach us or arrive too weakly to notice.

The study is available on arXiv (arxiv org/abs/2610.20475).`,type:"post",ver:!0,bm:3,len:2492,thumb:"https://pbs.twimg.com/amplify_video_thumb/2120094910787309570/img/e79f9eNobdkIEfmi.jpg",media:"video",why:"69 views/min; 35 min old (sweet spot); only 2 replies"},{id:"2120141926338850875",url:"https://x.com/konstructivizm/status/2120141926338850875",h:"konstructivizm",name:"Black Hole",f:877361,at:"2026-11-10T13:10:00.000Z",age:35,views:2150,replies:1,likes:3,reposts:2,quotes:0,vpm:61.4,score:66,genre:"Internet culture",topics:["Internet culture","Science & space"],tags:[],text:`Galileo's Europa

- Fyodor Dostoevsky

Fyodor Dostoevsky (1821\u20131881) was a Russian novelist, philosopher, and one of the most influential writers in literary history. His works explored the complexities of the human mind, confronting themes of guilt, suffering, morality, faith, free will, and the eternal struggle between good and evil. Through psychologically intricate characters, he examined humanity\u2019s deepest contradictions and the search for meaning in an often unforgiving world. His most celebrated works include Crime and Punishment, The Brothers Karamazov, The Idiot, and Notes from Underground.

Dostoevsky\u2019s own life was filled with extraordinary hardship. In 1849, he was arrested for his involvement in an intellectual circle accused of discussing prohibited political ideas. Sentenced to death, he was brought before a firing squad and prepared for execution before a last-minute announcement revealed that his sentence had been commuted. Instead, he endured years of imprisonment and forced labor in Siberia, an experience that permanently altered his understanding of human nature, faith, and suffering. Throughout his later years, he also battled epilepsy, crushing debt, gambling addiction, and the devastating losses of his first wife and his beloved brother Mikhail.

Rather than allowing these experiences to silence him, Dostoevsky transformed his suffering into some of the most profound literature ever written. Despite illness, financial instability, and relentless personal tragedy, he continued producing novels that examined the darkest and most vulnerable aspects of the human condition. His firsthand encounters with imprisonment, desperation, and grief gave his characters a remarkable emotional and psychological realism. When he died in 1881 at the age of 59, he left behind a body of work that would profoundly shape modern literature, philosophy, and psychology, continuing to challenge generations of readers to confront the mysteries of human existence.`,type:"post",ver:!0,bm:123,len:2059,thumb:"https://pbs.twimg.com/media/HWhvM4MXcAEFbFb.jpg",media:"photo",why:"175 views/min; 285 min old; only 12 replies"},{id:"2120147966443114961",url:"https://x.com/konstructivizm/status/2120147966443114961",h:"konstructivizm",name:"Black Hole",f:877361,at:"2026-11-10T13:34:00.000Z",age:11,views:1650,replies:1,likes:1,reposts:0,quotes:0,vpm:150,score:57,genre:"Internet culture",topics:["Internet culture","Science & space","Animals & wholesome"],tags:["sports"],text:`In 1969, while the world watched Apollo 11 race to the Moon, Soviet scientists quietly sent living animals into the silent void of zero gravity \u2014 not to plant a flag, but to watch what happens to a body when \u201Cdown\u201D suddenly disappears.

Love is not defined by whether we are in a relationship, but by our capacity to feel, express, and share it with others. This image featuring Sylvia Plath and her words beautifully captures the idea that being a loving person is part of who we are, regardless of whether we have someone by our side. Our ability to love does not depend on having a partner; it exists within us, independent of our relationship status.`,type:"post",ver:!0,bm:51,len:518,thumb:"https://pbs.twimg.com/media/HWhueAdWwAAQltF.jpg",media:"photo",why:"111 views/min; 405 min old; only 12 replies"},{id:"2120018618792427640",url:"https://x.com/historyinmemes/status/2120018618792427640",h:"historyinmemes",name:"Historic Vids",f:6070325,at:"2026-11-10T05:00:01.000Z",age:525,views:57401,replies:25,likes:583,reposts:118,quotes:6,vpm:109.3,score:55,genre:"History & facts",topics:["History & facts","Science & space","Travel & nature"],tags:["tragedy"],text:`\u201CMan is the most insane species. He worships an invisible God and destroys a visible Nature. Unaware that this Nature he's destroying is this God he's worshipping.\u201D

- Hubert Reeves

Hubert Reeves (1932\u20132023) was a French-Canadian astrophysicist who dedicated his life to understanding the mysteries of the universe, only to become increasingly troubled by humanity\u2019s destruction of its own planet.

After earning his doctorate from Cornell University in 1960, Reeves worked as a scientific adviser to NASA before establishing himself as a respected researcher in France. His studies focused on how stars create the chemical elements essential to life, including the oxygen we breathe, the calcium in our bones, and the iron flowing through our blood. He helped bring widespread attention to the remarkable fact that much of the matter making up our bodies originated inside ancient stars.

Reeves found it extraordinary that humanity had developed the intelligence to explore the cosmos while simultaneously damaging the ecosystems necessary for its survival. This contradiction inspired him to become a passionate environmental advocate, speaking out against biodiversity loss and urging people to reconsider their relationship with nature. His scientific contributions were recognized in 1999 when an asteroid was named 9631 Hubertreeves in his honor.

- W. B. Yeats

William Butler Yeats (1865\u20131939) was an Irish poet, playwright, and one of the most influential literary voices of the twentieth century. As a leading figure in the Irish Literary Revival, he drew heavily from Ireland\u2019s mythology, folklore, spiritual traditions, and turbulent political history. His writing gradually shifted from romantic symbolism toward deeper philosophical reflections on love, ageing, mortality, national identity, and the passing of time. Among his most famous works are The Second Coming, Sailing to Byzantium, The Tower, and The Wild Swans at Coole.

Despite his literary success, Yeats endured years of personal heartbreak. He spent decades in love with Irish revolutionary Maud Gonne, who repeatedly refused his marriage proposals. In 1917, he married Georgie Hyde-Lees, whose companionship and spiritual interests profoundly shaped his later work. Meanwhile, Ireland\u2019s political struggles, particularly the 1916 Easter Rising and the fight for independence, left a lasting mark on his poetry and beliefs.

Rather than being defeated by heartbreak or political turmoil, Yeats transformed these experiences into some of his most powerful writing. He helped establish Dublin\u2019s Abbey Theatre, served in the Irish Free State Senate, and received the Nobel Prize in Literature in 1923 for poetry that captured the spirit of his nation. He remained creatively active until his final years, passing away in France in 1939 at the age of 73. His legacy endures as a testament to the power of turning personal struggles, historical change, and the mysteries of human existence into timeless literature.`,type:"post",ver:!0,bm:66,len:1790,thumb:"https://pbs.twimg.com/media/HWhrvkfWQAARWX-.jpg",media:"photo",why:"72 views/min; 645 min old; only 11 replies"},{id:"2120042365335519467",url:"https://x.com/AISafetyMemes/status/2120042365335519467",h:"AISafetyMemes",name:"AI Notkilleveryoneism Memes \u23F8\uFE0F",f:195475,at:"2026-11-10T06:34:23.000Z",age:431,views:32524,replies:16,likes:402,reposts:39,quotes:4,vpm:75.5,score:53,genre:"Memes & viral",topics:["Memes & viral"],tags:["sports","tragedy"],text:`"This trajectory, if continued, means a world-changing intelligence explosion in 2027, so the public needs to know."

,why:"Replied to your post. You don't follow back yet.",src:"https://x.com/lulustoryol/status/2114909458912702838"},{h:"yassineyas73562",f:1167,kind:"engaged",why:"Recently followed you. You don't follow back yet."},{h:"VMGGOLF",f:920,kind:"engaged",why:"Replied to your Anthropic reply ('Short. Short. Short.').",src:"https://x.com/VMGGOLF/status/2115059000756830653"}],brief:{at:"7:50 AM CT",atIso:"2026-11-10T13:50:00Z",analytics:"Pull 7:38 AM CT Nov 10 (vs 3:06 PM CT yesterday). Followers 706, flat: 2 new follows (@ai_benny100, 2,194 followers, who unfollowed yesterday and came back, and @NohNoh388536, 15) and 2 unfollows (@KingWitness_ 4,445 and @ohheyyang 844). Neither new follower shows up in your replies or mentions. No posts or replies in the last 24h; the last one is still the Nov 6 7:34 AM CT post, so this is day 4 of quiet and there is nothing new to rank. Your posts added about 2,325 views since yesterday afternoon, and 2,198 of them came from the @RockstarGames 'We are so close' reply (now 261,194 views, 3,924 likes, 16 replies, 96 reposts, 147 bookmarks). The rest was scraps: @JensenHuang 'Duck, Duck, GPUs' reply +11, @BRICSinfo reply +10 (185,344), and two $VIX posts at +4 each. Engagers: no new mentions since @Cocoon_OTW at 9:19 AM CT yesterday. No spikes: the Rockstar reply ran about 130 views an hour overnight, slower than yesterday's ~170. What still works is the same thing: an early, short reply on a giant Rockstar post. Today Rockstar has a fresh one (Festival lottery, 283K views in 45 minutes) and the timeline is CPI plus the Anthropic IPO, so there's a ready audience for both lanes.",ai:[{t:"Anthropic launched its IPO roadshow. Per @DeItaone: $70-$78 a share, 825M Class A shares, up to $64.35B raised at the top of the range, Nasdaq listing, pricing expected next Wednesday and trading Thursday, targeting about a $1 trillion valuation",label:"Worth knowing",by:"AnthropicAI",u:"https://x.com/AnthropicAI/status/2120117722230968385",why:"The biggest AI-and-markets story of the week, and it sits right where your two lanes overlap. Numbers: https://x.com/DeItaone/status/2120118320355582218 and https://x.com/DeItaone/status/2120118760116036029. Reuters says a leaked email raised questions about the valuation (https://x.com/Reuters/status/2120139435400442363), so keep posts to the reported numbers."},{t:`Simon Willison: Anthropic's updated prompting guide says telling Fable 5.2 "This codebase is yours" makes it less cautious about improving existing code`,label:"Could improve our workflow",by:"simonw",u:"https://x.com/simonw/status/2120029347948220500",why:"Just an idea for the TradingDeck vibe-coding sessions: if any of them run on Fable 5.2, try that line in the project instructions on one refactor and see if it stops tiptoeing around old files. Only for refactors you can roll back."},{t:"@TheAhmadOsman tip: ask your agent to consolidate your Python virtual environments by linking them, which can free tens of GBs",label:"Could improve our workflow",by:"TheAhmadOsman",u:"https://x.com/TheAhmadOsman/status/2119974440763363528",why:"Just an idea for the box and the Mac: each trader and tool tends to grow its own venv. Have Grok Bot or Hermes list them and their sizes first, then decide. Don't let it delete anything without a list."},{t:"Barclays: AI agents will trade up to 65% of US investment grade, per @unusual_whales",label:"Worth knowing",by:"unusual_whales",u:"https://x.com/unusual_whales/status/2120148720989962533",why:"Bonds, not options, so nothing changes for your desks. It's good context for anyone asking why you'd build autonomous traders at all, and it's a humor draft below."},{t:"Hermes Agent's mobile app lets you send your agent a sketch as a prompt attachment, and a public mobile app is coming soon (per @witcheer at Nous)",label:"Could improve our workflow",by:"witcheer",u:"https://x.com/witcheer/status/2120140165587042395",why:"Just an idea for the TradingDeck layout work from your phone: sketch a panel layout and send it to Hermes instead of describing it in text. Only once the app is available to you; today you work through Telegram."},{t:"Teknium: Hermes desktop UX is being redesigned, with a web version too, 1-2 week ETA",label:"Worth knowing",by:"Teknium",u:"https://x.com/Teknium/status/2120077047615926743",why:"Nothing to change yet. When it ships, check whether it replaces anything you do through Telegram today."},{t:"IBM plans to put Claude Mythos inside IBM Concert Protect to hunt unknown bugs; in one IBM case a follow-up check cut 5,700 scanner findings to 12 proven exploitable ones (via @rohanpaul_ai)",label:"Ignore",by:"rohanpaul_ai",u:"https://x.com/rohanpaul_ai/status/2120004635515846690",why:"Enterprise security tooling. Interesting, but it doesn't touch your workflow or the traders."},{t:"@omarsar0 on Sugar Glider, a new long-context architecture from @i14labs with a fixed-size KV cache; i14 reports up to 32x more requests per server at 1M tokens",label:"Ignore",by:"omarsar0",u:"https://x.com/omarsar0/status/2120142218316964143",why:"Company-reported research numbers, not something you can use today. Worth a look only if long agent memory becomes a problem for the traders."}],drafts:[{kind:"AI (curiosity hook)",text:`Anthropic's own prompting guide says if you tell Fable 5.2 "This codebase is yours," it gets less timid about fixing it.
