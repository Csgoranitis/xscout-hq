The attack, believed to be the BIGGEST financial heist in history, has prompted the Federal Reserve and Office of the Comptroller of the Currency to contact banks about suspicious activity and potential vulnerabilities.

Major banks are now examining their cybersecurity defenses, with one of the country's largest institutions contacting Binance directly to investigate how the hackers pulled it off.

What's worrying is that rapidly advancing AI could give hackers capabilities that banks may not fully be able to defend against...

Strange things are happening in European airspace again this AM, as multiple planes DIVERT following BOMB THREATS targeting passenger jets mid-flight.

The latest disruption began with a bomb threat against an Aer Lingus flight carrying 157 people from Dublin to Rome, which diverted to a French military air base under the escort of a Rafale fighter jet.

Then, a Wizz Air flight from Milan to Warsaw was diverted to Vienna, and a Ryanair flight from London Stansted to Sofia had to land in Plovdiv, Bulgaria.

A Finnair flight from Helsinki to Rome was also escorted by Italian fighter jets but landed normally, while a LOT Polish Airlines flight underwent security checks.

The latest incidents follow a similar wave earlier this week (see below) involving at least 7 flights, with no explosives discovered.

The threats are disrupting flights across Europe, with authorities still trying to figure out who's behind them.

Could it be Russia? Pranksters? WTF is going on here...

Writers: Mhedi, Michael

https://t.co/pGVu7TT6U0`,type:"post",ver:!0,bm:1,len:186,thumb:null,media:null,why:"226 views/min; 36 min old (sweet spot); only 15 replies"},{id:"2118319655353749848",url:"https://x.com/levelsio/status/2118319655353749848",h:"levelsio",name:"@levelsio",f:989789,at:"2026-11-05T12:28:56.000Z",age:72,views:12686,replies:27,likes:48,reposts:2,quotes:2,vpm:176,score:74,genre:"AI",topics:["AI","Gaming","Food"],tags:["sports"],text:`Fixed the mobile stretched interface on portrait mode in BF1942  by modding the engine

Claude Code told me how it did it:

"1. Spotting the HUD: 3D world draws use a perspective projection, where far things look smaller. The HUD uses a flat one. I can tell them apart from the projection matrix the game sets before each draw.

2. Measuring each element: before drawing a HUD piece (the ticket count, the map, an ammo icon), I calculate on the CPU where its corners land on screen. That uses the same matrix math the graphics card would do.

3. Squeezing it back: I shrink its height by that 2.9\xD7 factor toward a fixed edge depending on where it sits. Things at the top move toward the top edge, things at the bottom toward the bottom edge, and things in the middle toward the center. Because everything in the same band moves together, the map and its icons stay lined up.

4. Leaving some things alone: big panels, like the scoreboard and loading photo, keep the old stretch so their layout isn't changed. On menu and loading screens, text shrinks around its own center so tap areas don't move."`,type:"quote",ver:!0,bm:6,len:1098,thumb:"https://pbs.twimg.com/media/HWXIOI8XcAEVGwe.jpg",media:"photo",why:"176 views/min; 72 min old (sweet spot); only 27 replies"},{id:"2118304869396210128",url:"https://x.com/Reuters/status/2118304869396210128",h:"Reuters",name:"Reuters",f:26447987,at:"2026-11-05T11:30:11.000Z",age:131,views:37020,replies:21,likes:56,reposts:19,quotes:6,vpm:283,score:74,genre:"Business & startups",topics:["Business & startups","Tech"],tags:[],text:"EXCLUSIVE: Nvidia chips pile up in Hong Kong as China withholds import approval https://t.co/aRVsPcM4dY",type:"post",ver:!0,bm:10,len:103,thumb:null,media:null,why:"283 views/min; 131 min old; only 21 replies"},{id:"2118331822408937797",url:"https://x.com/Pirat_Nation/status/2118331822408937797",h:"Pirat_Nation",name:"Pirat_Nation \u{1F534}",f:374491,at:"2026-11-05T13:17:17.000Z",age:24,views:7957,replies:11,likes:126,reposts:4,quotes:1,vpm:335.5,score:74,genre:"Gaming",topics:["Gaming","Science & space"],tags:[],text:`The Legend of Zelda: Ocarina of Time has a issue that doesn\u2019t launch with VRR activated in docked mode, despite Nintendo previously listing the feature as supported.

It was long assumed that late-stage impacts would strip away primordial H/He envelopes. However, a study in *Nature Astronomy* (by Dariush Modirrousta-Galian and Jun Korenaga) reveals a more complex picture.

When an impact occurs, a planet gains both heat and mass. The added mass strengthens the gravitational "grip" on the atmosphere, while only a portion of the impact energy actually heats the mantle or drives off gas; furthermore, the melting of the mantle absorbs heat, and metallic core material sinks deep into the interior. This shifts the balance toward the retention of atmospheric envelopes\u2014a finding that helps explain the observed differences between super-Earths and sub-Neptunes.`,type:"post",ver:!0,bm:1,len:760,thumb:"https://pbs.twimg.com/media/HWWd7hlXYAApa77.jpg",media:"photo",why:"40 views/min; 81 min old (sweet spot); only 0 replies"},{id:"2118306939931332628",url:"https://x.com/Rainmaker1973/status/2118306939931332628",h:"Rainmaker1973",name:"Massimo",f:4444382,at:"2026-11-05T11:38:25.000Z",age:123,views:13058,replies:5,likes:53,reposts:5,quotes:1,vpm:106.5,score:64,genre:"Internet culture",topics:["Internet culture"],tags:[],text:"Booby Cactus, Myrtillocactus Geometrizans Fukurokuryuzinboku. https://t.co/DLRYR4cZxx",type:"post",ver:!0,bm:6,len:85,thumb:"https://pbs.twimg.com/media/HWW85L0XwAA_XS3.png",media:"photo",why:"107 views/min; 123 min old; only 5 replies"},{id:"2118295023473287576",url:"https://x.com/Rainmaker1973/status/2118295023473287576",h:"Rainmaker1973",name:"Massimo",f:4444382,at:"2026-11-05T10:51:04.000Z",age:170,views:16139,replies:1,likes:92,reposts:9,quotes:2,vpm:95,score:64,genre:"Internet culture",topics:["Internet culture","Music"],tags:[],text:`This video shows the process of crafting a  briefcase made from a single bamboo culm, cloth and pieces of leather

e of the most distant galaxies we have ever seen.

Its light has been traveling to us for 13.3 billion years. We are seeing it as it was only 420 million years after the Big Bang \u2014 at a time when the universe was less than 3% of its current age. The first stars were just beginning to ignite, galaxies were only starting to assemble from gas, and space was still filled with a fog of neutral hydrogen.

This tiny red point sits almost at the very edge of what we can detect. Its red color comes from extreme redshift: the ultraviolet light of young stars has been stretched into the infrared and shifted into the red part of the spectrum. What looks like a barely visible dot is actually an entire early galaxy that existed when the first structures in the cosmos were only beginning to form.

Every object like this is a window into the era of cosmic dawn. It is precisely these \u201Cred dots\u201D that force astronomers to rethink how quickly and efficiently the first galaxies appeared in the universe.`,type:"post",ver:!0,bm:0,len:1092,thumb:"https://pbs.twimg.com/media/HWWfX5tW0AA3qcu.jpg",media:"photo",why:"116 views/min; 19 min old; only 1 replies"},{id:"2118292565917413729",url:"https://x.com/wallstengine/status/2118292565917413729",h:"wallstengine",name:"Wall St Engine",f:212115,at:"2026-11-05T10:41:18.000Z",age:180,views:20569,replies:14,likes:103,reposts:8,quotes:1,vpm:114.5,score:62,genre:"Markets & stocks",topics:["Markets & stocks","AI","Business & startups"],tags:["politics"],text:`OPENAI IPO IN 2027?

- Marcus Aurelius

This powerful pairing of Marcus Aurelius\u2019s Stoic philosophy and Briton Rivi\xE8re\u2019s 1888 painting Requiescat offers a profound reflection on mortality and the meaning of life. The artwork portrays a fallen knight resting peacefully in full armor, with his faithful hound keeping watch beside him, symbolizing loyalty, honor, and a life devoted to duty.

Rather than presenting death as something to dread, the image portrays it as a natural and peaceful conclusion to life\u2019s journey. Combined with Aurelius\u2019s wisdom, it delivers a timeless reminder that death itself is not life\u2019s greatest tragedy. The greater loss is reaching the end without having lived with purpose, courage, and meaning while the opportunity remained.`,type:"post",ver:!0,bm:252,len:784,thumb:"https://pbs.twimg.com/media/HWPkPnYWgAAxBf7.jpg",media:"photo",why:"168 views/min; 521 min old; only 11 replies"},{id:"2118296837811749333",url:"https://x.com/Rainmaker1973/status/2118296837811749333",h:"Rainmaker1973",name:"Massimo",f:4444382,at:"2026-11-05T10:58:16.000Z",age:163,views:12055,replies:7,likes:52,reposts:7,quotes:3,vpm:74.1,score:57,genre:"Internet culture",topics:["Internet culture","Travel & nature"],tags:[],text:`Lake Cakora is is intermittently open to the ocean at Brooms Head Main Beach, Australia.

- Betty White

Betty White was one of America\u2019s most cherished actresses and comedians, leaving behind an extraordinary legacy that spanned more than eight decades. A true pioneer of television, she broke barriers as one of the first women to exercise creative control both in front of and behind the camera. Her unforgettable portrayals of the sharp-witted Sue Ann Nivens on The Mary Tyler Moore Show and the sweet, hilariously naive Rose Nylund on The Golden Girls cemented her place in television history.

At a symposium on crewed spaceflight in Beijing, the mission architecture was presented: it begins with checkouts in Earth's orbit, followed by a flight to the Moon. The project will utilize the Long March 10 (Changzheng-10) rocket, the "Mengzhou" spacecraft, and the "Lanyue" lunar lander. The Tiangong space station will be used for docking maneuvers and testing key operations, while an uncrewed flight of the Lanyue lander will take place prior to the actual landing to gather data on the lunar surface.

The mission to the Moon involves two separate launches of the Long March 10, each carrying different payloads, with a rendezvous taking place in lunar orbit. Two versions of the rocket will be employed: the Long March 10A for low-Earth orbit missions, and a three-stage variant equipped with boosters for lunar missions, capable of carrying a payload of up to 27 metric tons. Several critical tests have already been completed, including tethered tests of the lander, emergency system checks for the Mengzhou spacecraft (scheduled for June 2025), and a low-altitude launch demonstration of the Long March 10. The objective is to thoroughly refine the entire mission cycle without a crew on board, ensuring the safety of the astronauts.

Edgar Allan Poe was one of America\u2019s most influential and haunting literary figures. Born in Boston, Massachusetts, in 1809, he became a celebrated poet, author, and literary critic whose work helped shape modern detective fiction and American Gothic literature.

Known for his chilling imagination and psychological depth, Poe explored themes of death, sorrow, insanity, and obsession through unforgettable stories and poems. His most iconic works include The Raven, The Tell-Tale Heart, The Black Cat, and The Fall of the House of Usher. Despite his extraordinary talent, Poe endured financial hardship and devastating personal losses throughout his life, experiences that often influenced the darkness of his writing.

K), theinvestnow (1.5K), PenneyInvests (1.2K) and BenTradesData (469) 2 each (BenTradesData asked whether you ever step in manually on the bots, a good post idea); Satovinci (4.8K) on the trader log: 'honest daily logs are rare... make it a hard limit'; worstgeneD (5.3K), 3FinanWolverine (4.1K), Candace_XSI (2.6K), Olympusperspect, adrianviewpoint, BacklogAlpha, BrightLabsMedia, Gandalfthegrn, ZacWhelan_. Spike: none. Overnight was all replies, so this morning starts with nothing new on your profile for visitors to find.",ai:[{t:"Hermes /handoff telegram: moves a running terminal session to Telegram, whole chat included, so you don't have to stop the agent and retype. Same post covers /steer for slipping in a note mid-run",label:"Could improve our workflow",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2118161160075878743",why:"Your Mac and phone setup: start a long TradingDeck coding run at the desk, hand it to Telegram when you leave, and keep steering from your phone. Proposal only: check that your Hermes version has /handoff before relying on it, and try it on a low-stakes task first."},{t:"Max Planck paper: turning on reasoning makes different LLMs agree more, even on mistakes. With reasoning on, the share of cases all 9 models got wrong rose 2.0 to 2.4 points",label:"Could improve TradingDeck",by:"rohanpaul_ai",u:"https://x.com/rohanpaul_ai/status/2118288607106764857",why:"Trader team desk: if you ever have several model-based traders or a second model double-check a signal, agreement isn't independent confirmation. Proposal for the backtest: log when every trader agreed and was wrong, not just the win rate. You and Hermes decide."},{t:"Hermes plugins: search the catalog, install one (e.g. a crontab plugin) with --enable, look inside it, or build and submit your own",label:"Could improve our workflow",by:"witcheer",u:"https://x.com/witcheer/status/2118314736236233089",why:"Scheduled jobs (daily trader updates, morning pulls) could run from a plugin instead
