The entire shale play has narrowed to four counties in two states. And a war in the Gulf just closed the most obvious backup plan.

Dr. Chris Martenson, founder of Peak Prosperity and one of the analysts who called the 2008 housing collapse years in advance, joins me to explain what the energy math actually looks like right now.

The Bakken is past peak. The Eagle Ford is past peak. The Permian is the last play standing, and even that is narrowing. When U.S. shale starts to decline, the answer had to be Canada, Venezuela, or the Gulf. 

And the Gulf is now a war zone...

A third carrier is closing in on the region. If both sides go hard, Martenson says global oil supply takes a year to recover. Cracking towers and desalination plants are not quick fixes.

On markets: gold, silver, corn and wheat are all behaving strangely. Martenson thinks governments learned they could manipulate one market, then two. Now the whole camel is in the tent.

On the war\u2019s origin: Trump is the dog that caught the bumper of a semi-truck. The countervailing voices were fired before the war started. Nobody knows what to do with it now.

$NVDA`,type:"post",ver:!0,bm:8,len:82,thumb:null,media:null,why:"362 views/min; 105 min old; only 19 replies"},{id:"2122074661861368084",url:"https://x.com/MarioNawfal/status/2122074661861368084",h:"MarioNawfal",name:"Mario Nawfal",f:3986378,at:"2026-11-15T21:10:00.000Z",age:20,views:15078,replies:7,likes:9,reposts:0,quotes:1,vpm:753.9,score:78,genre:"Markets & stocks",topics:["Markets & stocks","AI","History & facts"],tags:["tragedy"],text:`\u{1F1FA}\u{1F1F8} AI drives U.S. electricity demand to RECORD HIGHS as coal loses ground...

America's AI boom needs enormous amounts of electricity. Data centers run around the clock, putting growing pressure on the power grid.

U.S. electricity generation reached a record ~4,430 terawatt-hours in 2025.

But coal supplied just 17% of America's electricity last year, down from HALF in 2000.\xA0Does the U.S. need more of the fossil fuel to keep up with growing electricity demands?

Here's a breakdown or where the country gets its supply:

\u{1F539} Natural gas: 41% America's largest power source, helping meet demand spikes.
\u{1F539} Renewables: 24% Solar and wind are expanding rapidly. Renewables overtook coal in 2022.
\u{1F539} Nuclear: 18% Reliable power around the clock.
\u{1F539} Coal: 17% Down dramatically from its dominance 25 years ago.

AI data centers and expanding industries are increasing electricity needs just as America moves away from one of its most polluting fuels.

Natural gas, nuclear, solar, and wind are helping meet demand, but more power plants, batteries, and transmission lines are needed.

Can America's AI-powered future stay in the race without bringing back coal?

It was approved by the president, but it was NEVER publicly acknowledged.

8 fishermen vanished in January. Two more boats were struck in March. Survivors say small drones dropped munitions on them, then armed men in khaki uniforms hooded and handcuffed them, transported them to El Salvador, and released them without explanation.

No drugs found. No charges filed. No explanation given.

A surveillance jet with no FAA registration flew out of Ilopango airport before each attack. The same airport the CIA used in the 1980s to run weapons to the Nicaraguan contras. The company that reserved the tail number lists its address as a UPS store in Virginia.

Trump signed a covert action authorization giving the CIA lethal authority against drug traffickers. The agency surged resources across Latin America. Now this.

The question former officials are asking: if the administration is openly bombing suspected drug boats and bragging about it, why run a separate secret program to do the same thing?

\u201CIt begs the question about why you would need to do this. What would be the purpose of the secrecy?\u201D

Three years ago, astronomers announced something that looked almost too good to be true: a galaxy called UHZ1, seen when the universe was only about 480 million years old, appeared to host a black hole weighing as much as every star in its host galaxy put together. The claim was exciting because it pointed to a \u201Cdirect-collapse\u201D seed\u2014an enormous black hole born straight from collapsing gas clouds rather than growing slowly from a dead star. A new reanalysis says the evidence for that monster has largely evaporated.

Led by Fan Zou of the University of Michigan, the team reprocessed the original Chandra X-ray observations and added nearly a million more seconds of new Chandra time, then folded in fresh mid-infrared data from the James Webb Space Telescope. The results are published in *The Astrophysical Journal*.

The original X-ray \u201Cdetection\u201D turns out to be fragile. When the researchers randomly shifted the alignment between the X-ray and infrared images across many plausible registrations, only about 0.1 % of those shifts produced a signal as strong as the one first reported. Worse, the extra Chandra exposure\u2014exactly the kind of deeper look that should have made a real source brighter and more secure\u2014added almost nothing. A genuine, stable X-ray source simply doesn\u2019t behave that way.

They also hunted for the infrared glow that a powerful, dust-buried black hole should produce when it heats its surrounding cocoon. JWST\u2019s MIRI instrument saw none. Scaling standard templates up to the instrument\u2019s detection limit still left any possible hidden black hole 10 to 1,000 times fainter than the original claim required.

The team checked the usual loopholes. If there were no dust at all, the black hole\u2019s ultraviolet light should have shone through\u2014but it doesn\u2019t appear in the JWST spectra. If the dust were cold and distant, it should have shown up in far-infrared observations from ALMA\u2014but the galaxy contains very little dust and its light is barely reddened. Neither escape route works.

The cleaner explanation is simply a low-mass, metal-poor, star-forming galaxy of roughly 100 million solar masses. Its emission lines fit ordinary young stars; no active black hole is needed. As the authors put it, \u201Cno compelling evidence for such an AGN exists.\u201D

Extraordinary claims still demand extraordinary evidence. On the current data, the outsize, dust-enshrouded black hole in UHZ1 does not clear that bar. What remains is a fascinating but far more ordinary early galaxy\u2014and a reminder that in the youngest reaches of the universe, some of the most dramatic headlines can still dissolve under closer scrutiny.`,type:"post",ver:!0,bm:2,len:2704,thumb:"https://pbs.twimg.com/amplify_video_thumb/2122030696084520960/img/6CjKxxB__j4CUQ7s.jpg",media:"video",why:"46 views/min; 79 min old (sweet spot); only 3 replies"},{id:"2122035654859149639",url:"https://x.com/cryptorover/status/2122035654859149639",h:"cryptorover",name:"Crypto Rover",f:1623986,at:"2026-11-15T18:35:00.000Z",age:175,views:38547,replies:69,likes:256,reposts:9,quotes:3,vpm:220.3,score:64,genre:"Markets & stocks",topics:["Markets & stocks","Crypto"],tags:[],text:`Will Bitcoin make new lows?

:10:00.000Z",age:20,views:2219,replies:2,likes:5,reposts:1,quotes:0,vpm:111,score:61,genre:"Internet culture",topics:["Internet culture","Markets & stocks","Memes & viral","Science & space"],tags:["tragedy"],text:`The Iconic Black Hole \u201CDoughnut\u201D Just Got Independently Confirmed \u2014 And the Ring Is Real

In April 2019, the Event Horizon Telescope Collaboration dropped one of the most famous scientific images ever made: a glowing orange ring surrounding a dark void at the heart of the galaxy M87, 55 million light-years away. It looked exactly like what Einstein\u2019s general relativity predicted for a supermassive black hole \u2014 a \u201Cshadow\u201D ringed by light bent around it by extreme gravity.

It instantly became a modern icon. But scientists soon started arguing about the details. Was that clean ring structure genuinely there in the data, or had imaging algorithms, human choices, and residual errors from Earth\u2019s atmosphere and the telescopes themselves subtly sculpted it into existence?

A new independent analysis, published in *Nature*, has now put those doubts to rest.
 Imaging the Impossible

Photographing M87* is absurdly hard. It\u2019s roughly equivalent to trying to snap a clear picture of a doughnut sitting on the Moon while standing on Earth. You need a telescope the size of the entire planet.

The EHT solved this by linking radio telescopes around the globe into one virtual Earth-sized dish, capturing the sharpest views of a black hole\u2019s immediate surroundings ever achieved. Multiple teams inside the collaboration all recovered a ring-like structure in 2019, though the fine details differed \u2014 something expected when you\u2019re reconstructing an image from a sparse array of telescopes. One later study even challenged whether a ring was present at all.

The problem is noise. Atmosphere and instruments inject errors into the raw data. Astronomers try to correct them, but leftover imperfections can bias the final picture.

 A Clever New Way to Clean the Data

Researchers led by Samuel Lai and Nithyanandan Thyagarajan (with colleagues from CSIRO in Australia) developed a different approach called **closure invariants**. Instead of combining signals from pairs of telescopes (the usual method), they combined triplets \u2014 three telescopes at once. This cancels out atmospheric and instrumental errors more effectively while preserving real information about the source\u2019s structure.

They then fed the cleaner data into a machine-learning imaging method they called GenDIReCT. Crucially, they trained it only on ordinary terrestrial pictures \u2014 cats, dogs, cars \u2014 so the algorithm had zero preconceived notion of what a black hole \u201Cshould\u201D look like. They rigorously tested it on non-ring structures and real data from other galaxies before ever letting it see the M87 observations.

When they finally applied it (on data from the 2017 campaign), the ring appeared consistently across datasets. Its size and appearance matched a black hole roughly 6.5 billion times the mass of the Sun, viewed nearly face-on \u2014 like staring straight down into the eye of a hurricane.
 Fresh Perspective, Same Iconic Structure

Their reconstruction agrees with the original EHT image in overall diameter and orientation. There are minor differences in the exact brightness variations and ring thickness around the circumference, but the fundamental structure holds. A completely separate traditional statistical method, using the same new closure-invariant data, confirmed the same result.

This is strong independent validation that the glowing ring is real astrophysics, not an artifact of the original analysis pipeline. It boosts confidence in one of the most significant scientific achievements of the 21st century and in general relativity\u2019s description of spacetime near a black hole.

The techniques may also prove useful beyond astronomy \u2014 anywhere multiple sensors must be combined to map unknown structures, such as medical imaging or earthquake mapping.

In short: the famous black hole doughnut survived the most rigorous independent check yet. The ring is real.`,type:"post",ver:!0,bm:1,len:3861,thumb:"https://pbs.twimg.com/amplify_video_thumb/2122038076658573312/img/zOs2FQ4SOpo45qF3.jpg",media:"video",why:"111 views/min; 20 min old; only 2 replies"},{id:"2122055535499300885",url:"https://x.com/konstructivizm/status/2122055535499300885",h:"konstructivizm",name:"Black Hole",f:877667,at:"2026-11-15T19:54:00.000Z",age:96,views:3577,replies:4,likes:15,reposts:5,quotes:0,vpm:37.3,score:61,genre:"Internet culture",topics:["Internet culture","Science & space"],tags:[],text:"NASA\u2019s Curiosity Mars rover used two cameras to create this selfie in front of Mont Mercou, which stands 20 feet (6 meters) tall. The panorama is made up of 60 images from the MAHLI camera on the rover\u2019s robotic arm along with 11 images from the Mastcam on the mast, or \u201Chead,\u201D of the rover.",type:"post",ver:!0,bm:0,len:291,thumb:"https://pbs.twimg.com/media/HXL1rIHXEAIcZlM.jpg",media:"photo",why:"37 views/min; 96 min old; only 4 replies"},{id:"2122035176712572934",url:"https://x.com/TechCrunch/status/2122035176712572934",h:"TechCrunch",name:"TechCrunch",f:11083403,at:"2026-11-15T18:33:06.000Z",age:177,views:15933,replies:14,likes:27,reposts:2,quotes:4,vpm:90.1,score:61,genre:"Tech",topics:["Tech"],tags:[],text:`A new Kickstarter campaign aims to usher in the \u201Creturn of the human internet.\u201D

Before ChatGPT, the detector flagged just 0.4% (that's where the threshold was set). For papers sampled in August to October 2026 it's 38%, and the curve has gone up every year since 2023.

- Computer Science is highest at 62%, then Quantitative Biology at 58% and Electrical Engineering at 51%. Math sits at 3.7%, though equation-heavy papers give the detector less prose to work with
