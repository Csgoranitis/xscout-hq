\u201CBefore everything else, Patrick was defined by being born and bred in Yorkshire, the proud county in the north of England which he loved to the end. You could hear it in his accented voice and in the stern honesty with which he told you what he thought and felt. Yorkshiremen have no truck with half-truths or avoidance of big issues. He wore his heart on his sleeve, which made him a man to rely on, to admire and in my case, love.

We first met as ambitious young actors with the Royal Shakespeare Company half a century ago but we weren't in the same productions. My first strong memory was a few years later, meeting him in the street in central London when he told me about an offer to take over a leading part in 'Star Trek'. \u201CBut Patrick think of your stage career in the UK. Do you really want to risk-getting lost in Hollywood for years and years?".
Well, he took the risk and thank goodness for us all that he did for not just his devoted Trekkies but film and theatre audiences, who marvelled at his using international celebrity to star in a string of cinema successes ('X-Men' of course) and in great classical plays by Shakespeare, Ibsen, Arthur Miller, Peter Shaffer, Pinter and Beckett at Stratford-upon-Avon, in London's West End and on Broadway.

America was his adopted home, where he met his adored Sunny who has cared for him through sickness and health, through thick and thin. But he never forsook his origins: and the proudest achievement of the most respected and beloved actor of his generation on either side of the Atlantic, was his appointment as Chancellor of Huddersfield University in Yorkshire.\u201D`,type:"post",ver:!0,bm:882,len:1689,thumb:"https://pbs.twimg.com/media/HV1pHesWAAAHHOs.jpg",media:"photo",why:"1,993 views/min; 91 min old; only 40 replies; on pace for 100K+ views, where your replies do best"},{id:"2115976277366571300",url:"https://x.com/saylor/status/2115976277366571300",h:"saylor",name:"Michael Saylor",f:5216915,at:"2026-10-30T01:17:12.000Z",age:38,views:95832,replies:104,likes:865,reposts:64,quotes:14,vpm:2535.2,score:97,genre:"Crypto",topics:["Crypto","AI","Markets & stocks"],tags:[],text:`Our Q3 2026 $MSTR Earnings Call covered record financial results, Digital Capital, Digital Equity, Digital Credit, tokenization, and our strategy for the next bull market.

Peter Alexander, an American investor still doing business on the ground in Shanghai, tells Gordon Chang that his collapse calls lulled DC into doing nothing, and that China's slowdown is a deliberate cleanup. 

Gordon puts real growth near zero, well below the official 4.5%, and owns the miss on his 2001 book:

"So, yeah, I admit I was wrong on timing."

Mt. Gox (2014): $BTC roughly halved. It hit $19.7k by 2017, nearly 100x off its post-collapse low.

Bitfinex (2016): $BTC fell ~20%. It was back above pre-hack levels within 3 months and hit new all-time highs in 2017.

Coincheck (2018): The hack hit during the 2018 bear market. $BTC climbed from its $3.1k bottom to $29k by the end of 2020, then reached $69k in 2021.

Binance (2019): $BTC dipped ~4%. It rallied ~136% in just 7 weeks.

FTX (2022): $BTC fell ~22% in a week to ~$15.5k. It was up ~134% a year later and hit a new ATH of $73.7k by March 2024, ~375% off the low.

Bybit (2025): The largest hack on record at the time. $BTC dipped ~5%, hit a new ATH exactly 3 months later and went on to $126k, ~70% above its 2025 low.

Binance (2026): $BTC is down ~3% so far, Binance says user funds are SAFU, and ~$2.4B of the stolen funds is already frozen.

Blockchain researchers spotted billions of dollars in suspicious transfers from Binance's hot wallets to newly created addresses, with some funds quickly moved to other wallets.

One of the initial Ethereum transfers involved roughly $1.6B in USDT and 167,000 ETH.

Estimates of total suspicious outflows have now reached approximately $5.9B across multiple blockchain networks, although the amount actually stolen remains unconfirmed.

In response, Tether and Circle have frozen more than $2.38B in stablecoins linked to the incident, preventing those funds from being transferred further.

Binance founder CZ says it \u201Cdoes look like a hack\u201D and expects customer funds to be fully covered.

Binance says user funds remain safe and is investigating the security issue. Some customers have also experienced withdrawal disruptions.

For context, the previous largest crypto hack was the $1.5B Bybit theft in February 2025.

If the full reported amount is confirmed stolen, this would surpass that record by nearly four times.`,type:"post",ver:!0,bm:11,len:1087,thumb:"https://pbs.twimg.com/media/HV1VomWbIAAs7vV.jpg",media:"photo",why:"122 views/min; 167 min old; only 12 replies"},{id:"2115956919496028329",url:"https://x.com/billboard/status/2115956919496028329",h:"billboard",name:"billboard",f:16842938,at:"2026-10-30T00:00:16.000Z",age:115,views:10855,replies:2,likes:32,reposts:4,quotes:0,vpm:94.6,score:65,genre:"Music",topics:["Music"],tags:[],text:`EYEKONS, KATSEYE is taking the Wildworld Tour to Asia, Australia and New Zealand! The group has added 11 shows across the region, kicking off Jan. 27 at Yokohama Arena in Japan and wrapping March 5 at Auckland\u2019s Spark Arena.

Four thousand light-years away in Scorpius, the Cat\u2019s Paw Nebula (NGC 6334) is a nursery in full upheaval. In this layered view, the James Webb Space Telescope\u2019s infrared light reveals thick, overlapping rings of dark orange dust, while Chandra\u2019s X-rays paint a mottled pinkish-purple glow across the heart of the cloud\u2014marking the presence of million-year-old stars still half-hidden behind their natal blankets.

Webb\u2019s longer wavelengths expose the turbulence still unfolding. Massive newborn stars blast cavities into the surrounding gas and dust with fierce radiation and stellar winds, their intense light flooding the region in electric blue. These energetic infants are both architects and destroyers: they sculpt the nebula into its familiar paw-like shape even as their feedback begins to choke off the next generation of star formation.

Sleazy, born Joseph Isaac, was prohibited from having firearms due to a 2016 robbery conviction in Michigan. However,  in 2022, the feds began a criminal investigation after seeing the rapper holding multiple guns on social media. On Oct. 19, 2022, agents followed Sleazy and watched him retrieve a firearm from his vehicle. Police later seized the gun, which had the rapper's DNA on it.
