This is a powerful Mongolian proverb that emphasizes the value of silence, patience, and discretion in achieving success. It reminds us that even the strongest and most capable individuals can undermine their own potential by revealing their intentions too soon.

That's their biggest quarter since late 2024 and way above the usual 227 tonnes a quarter, according to the World Gold Council.

It's also up 42% from a year ago, and more than 5 TIMES what they bought in Q1.

China owned up to 63 tonnes and Poland to 40. Nearly two-thirds went unreported.

re:67,genre:"History & facts",topics:["History & facts","Animals & wholesome","Travel & nature","Health & fitness"],tags:["sports","tragedy"],text:`The crew entered their cryogenic chambers believing their mission would last just 123 years. It was an extraordinary journey, but one they had carefully prepared for. Their ship\u2019s systems were programmed to keep them in suspended animation until they reached their destination, where they expected to awaken and continue humanity\u2019s mission among the stars.

But when the crew finally regained consciousness, something was terribly wrong. The ship was deteriorating, emergency lights flickered, and its systems showed signs of centuries of neglect. Confused and desperate for answers, they accessed the ship\u2019s log, only to discover a horrifying truth.

923 years had passed.

What should have been a 123-year journey had somehow stretched into nearly a millennium. The civilization they expected to encounter might have disappeared, evolved beyond recognition, or forgotten their existence entirely.

The crew had gone to sleep believing they were carrying humanity\u2019s future. Instead, they awakened in a universe that had moved on without them.

No familiar world awaited their return. No rescue mission was coming. Their original purpose had been lost to time, and the people they once knew had been gone for centuries.

They hadn\u2019t simply overslept. They had awakened almost 800 years later than planned, becoming strangers in a future they were never meant to see.`,type:"post",ver:!0,bm:168,len:1366,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119490132306735104/img/JkNkyf8HkOl090H3.jpg",media:"video",why:"263 views/min; 398 min old; only 22 replies; on pace for 100K+ views, where your replies do best"},{id:"2120743389553430596",url:"https://x.com/historyinmemes/status/2120743389553430596",h:"historyinmemes",name:"Historic Vids",f:6068734,at:"2026-11-12T05:00:00.000Z",age:518,views:110167,replies:4,likes:155,reposts:13,quotes:0,vpm:212.7,score:67,genre:"History & facts",topics:["History & facts","Memes & viral"],tags:[],text:`Imagine fighting for your life on a medieval battlefield when a 20-foot giant suddenly decides that the nearest windmill would make an excellent weapon.

In Jack the Giant Slayer (2013), this absolute menace casually rips a massive wooden blade off a windmill and launches it across the battlefield like an oversized boomerang. Forget swords, spears, and catapults. This guy looked at ordinary farming equipment and immediately recognized its potential as a weapon of mass destruction.

The funniest part is imagining the villagers watching their entire livelihood fly through the air. One moment, that windmill is grinding grain to make bread. The next, it\u2019s spinning toward an army at terrifying speed.

While other fantasy villains rely on elaborate weapons and powerful magic, this giant proves that brute strength and a little creativity can be just as devastating.

, let alone believed, by the masses.\u201D

- Plato

Plato (c. 427\u2013347 BCE) was an ancient Greek philosopher whose ideas profoundly influenced the course of human thought. As a student of Socrates and mentor to Aristotle, he examined fundamental questions about justice, truth, love, knowledge, and existence. In works such as The Republic and the renowned Allegory of the Cave, he encouraged people to challenge their assumptions, question accepted beliefs, and seek understanding beyond what their senses reveal.

Plato believed that genuine wisdom requires acknowledging the limits of our knowledge and pursuing deeper truths. His teachings laid the foundation for much of Western philosophy, leaving a legacy that continues to inspire generations to think critically, question appearances, and search for meaning beyond the surface of everyday life.`,type:"post",ver:!0,bm:50,len:944,thumb:"https://pbs.twimg.com/media/HWoMqY4WAAAM8J9.jpg",media:"photo",why:"146 views/min; 278 min old; only 6 replies"},{id:"2120872239083974896",url:"https://x.com/konstructivizm/status/2120872239083974896",h:"konstructivizm",name:"Black Hole",f:877445,at:"2026-11-12T13:32:00.000Z",age:6,views:1634,replies:1,likes:8,reposts:3,quotes:2,vpm:272.3,score:57,genre:"Internet culture",topics:["Internet culture","Gaming","Science & space","Food"],tags:[],text:`Tiny \u201Cwater bears" woke up in space \u2014 and calmly came home.

For the first time, scientists ran a full cycle of experiments with multicellular animals directly in orbit. Tardigrades in a state of cryptobiosis were sent to the ISS. On the sixth day, an Indian astronaut added water to the samples \u2014 and about an hour later, 106 of the 180 observed individuals began to move.

After the 18-day mission, the samples were returned to Earth. Rehydration showed that roughly 45% of the space-faring tardigrades successfully survived the entire 64-day experiment: two cycles of \u201Chibernation \u2014 awakening,\u201D microgravity, elevated doses of cosmic radiation, and prolonged lack of food and water.

The survivors didn\u2019t just revive \u2014 they retained the ability to reproduce fully, laid eggs, and produced healthy offspring.
