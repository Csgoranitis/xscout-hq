The animal suffered severe burns that caused its spines to fall out https://t.co/uQV1tLhT8W`,type:"post",ver:!0,bm:1087,len:162,thumb:"https://pbs.twimg.com/media/HV5ayNvWYAA6T6Y.jpg",media:"photo",why:"4,077 views/min; 125 min old; only 215 replies; on pace for 100K+ views, where your replies do best"},{id:"2116247895020294246",url:"https://x.com/MarioNawfal/status/2116247895020294246",h:"MarioNawfal",name:"Mario Nawfal",f:3973542,at:"2026-10-30T19:16:30.000Z",age:48,views:66982,replies:34,likes:166,reposts:53,quotes:0,vpm:1381.1,score:95,genre:"Markets & stocks",topics:["Markets & stocks","Memes & viral"],tags:["politics","tragedy"],text:`\u{1F6A8} Something STRANGE is happening across multiple countries: governments are telling people to prepare for systems failing.

Britain wants households to keep three days of supplies. The EU says citizens should be ready for 72 hours without essential services. Japan is pushing for a full week. Scandinavian countries have already sent crisis guidance directly to the public.

The U.S. military is going much further.

The Pentagon is preparing bases to keep operating for up to 90 days if a major conflict knocks out power, communications or other critical infrastructure.

That would normally sound like boring civil-defense planning.

Except it is happening while the U.S. is moving forces around Iran, Washington is openly weighing another confrontation, and fears of Iranian retaliation are increasingly focused on cyberattacks against power grids, banks and communications networks.

There is still a diplomatic off-ramp.

JD Vance has renewed outreach, and another escalation is not inevitable.

But this is why the preparedness push is getting so much attention now.

Christa Pike got 2 doses of pentobarbital on September 30, enough to kill her. 

But somehow, she made it, becoming the only known person to survive a lethal injection execution attempt.

And a month later, she's still hurting. Her arms, hands, throat, pretty much her whole body. She says she even struggles to speak.

Pike's been on death row for killing a 19-year-old girl when she was just 18.

Now her lawyers want her sentence changed to life in prison. But Tennessee's governor says it'll probably stay the same unless a court says otherwise.

At least 350 AI towers are already up along the Mexican border, from California to Texas, watching areas where over a million people live, including homes, schools and playgrounds.

And these things can see for miles. They spot movement, zoom in, figure out if it's a person, animal or car, and alert Border Patrol.

Now Trump has secured over $1 billion for 1,500 more towers, with plans to expand beyond the Mexican border.

But there's a catch. People living nearby can't opt out, and one Texas woman says a tower across from her home watches who's coming and going.

Border officials say the cameras help keep people safe, but haven't shared figures showing how well they work.

So the border is getting smarter, and people living nearby are getting a lot less privacy.

Source: The New York Times / Writer: Daniyal`,type:"post",ver:!0,bm:4,len:906,thumb:"https://pbs.twimg.com/media/HV5dhdAbcAAa1Ba.jpg",media:"photo",why:"377 views/min; 55 min old (sweet spot); only 12 replies"},{id:"2116244356722290764",url:"https://x.com/MarioNawfal/status/2116244356722290764",h:"MarioNawfal",name:"Mario Nawfal",f:3973542,at:"2026-10-30T19:02:27.000Z",age:63,views:25726,replies:22,likes:111,reposts:8,quotes:1,vpm:411.3,score:80,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics","tragedy"],text:`\u{1F1F5}\u{1F1F0}\u{1F1EE}\u{1F1F7}\u{1F1FA}\u{1F1F8} Pakistan's military is cautiously optimistic about its efforts to bring Iran and the U.S. closer to peace.

Army chief Asim Munir has visited Tehran twice this month, most recently with senior Saudi and Turkish officials.

And the military spokesman sees that as a good sign:

\u201CWhy would the Field Marshal be going twice if it is not for some positivity?\u201D

But the talks could go beyond ending the war.

Pakistan, Saudi Arabia and Turkey signed a joint defense pact in August, and the military spokesman says Iran is welcome to join too, if all three countries agree.

The pact means an attack on one member counts as an attack on all three, so bringing Iran in would be a pretty big move.

For now, there's no peace deal, but Islamabad is keeping the door open to both talks and closer ties with Tehran.

Anthropic is reportedly negotiating with Beacon Data Centers to lease a large AI data center campus near Edmonton, Alberta.

The proposed site would feature four data halls powered by a 920 MW natural gas plant, which received regulatory approval on October 23.

Construction of the power plant is expected to begin in Q4 2026, with operations targeted for Q4 2027.

m/media/HV5zO3PXoAAGUC0.jpg",media:"photo",why:"725 views/min; 18 min old; only 5 replies"},{id:"2116228649141883200",url:"https://x.com/historyinmemes/status/2116228649141883200",h:"historyinmemes",name:"Historic Vids",f:6083747,at:"2026-10-30T18:00:02.000Z",age:125,views:41785,replies:14,likes:159,reposts:13,quotes:2,vpm:334.4,score:76,genre:"History & facts",topics:["History & facts","Film & TV","Music","Celebrity & pop culture"],tags:[],text:`The unforgettable transformation scene in John Landis\u2019s An American Werewolf in London (1981) took legendary makeup artist Rick Baker six grueling days of ten-hour shoots to complete. His groundbreaking work earned him the first-ever Academy Award for Best Makeup, establishing a new standard for practical effects in cinema.

Baker and his team created an elaborate collection of mechanical heads, hands, and feet known as \u201CChange-o\u201D pieces, each designed to capture a different stage of David Kessler\u2019s horrifying transformation. Landis insisted the entire sequence be filmed under bright lighting, without relying on dissolves or convenient cutaways to conceal the effects. Every stretching limb, shifting bone, and patch of emerging fur had to look convincing on camera.

Actor David Naughton endured extensive prosthetics, contact lenses, artificial teeth, and layers of body hair to bring the transformation to life. The nearly three-minute sequence was made even more surreal by the unexpected use of The Marcels\u2019 1961 recording of \u201CBlue Moon,\u201D creating an eerie contrast between the upbeat music and the agonizing transformation.

Baker\u2019s collaboration with Landis began years earlier on the 1973 film Schlock, where the director first introduced him to the werewolf concept. Baker would eventually collect seven Academy Awards for his extraordinary makeup work, but his groundbreaking achievement in 1981 remains one of the most celebrated moments in practical-effects history.`,type:"post",ver:!0,bm:19,len:1486,thumb:"https://pbs.twimg.com/amplify_video_thumb/2115654803527258112/img/wusF60F6A5zNCqf5.jpg",media:"video",why:"334 views/min; 125 min old; only 14 replies"},{id:"2116198693707878670",url:"https://x.com/DramaAlert/status/2116198693707878670",h:"DramaAlert",name:"DramaAlert",f:827930,at:"2026-10-30T16:01:00.000Z",age:244,views:363268,replies:110,likes:10460,reposts:381,quotes:33,vpm:1488.8,score:76,genre:"Internet culture",topics:["Internet culture","Gaming"],tags:["politics"],text:"Modders are adding military artillery to Minecraft. \u{1F480}\u{1F525}  https://t.co/A0J3Vvur8k",type:"post",ver:!0,bm:2277,len:79,thumb:"https://pbs.twimg.com/amplify_video_thumb/2116033564818935808/img/gkczrehBRzPArQyL.jpg",media:"video",why:"1,489 views/min; 244 min old; only 110 replies; on pace for 100K+ views, where your replies do best"},{id:"2116242362037109176",url:"https://x.com/AutismCapital/status/2116242362037109176",h:"AutismCapital",name:"Autism Capital \u{1F9E9}",f:1752784,at:"2026-10-30T18:54:31.000Z",age:70,views:11881,replies:10,likes:111,reposts:7,quotes:1,vpm:168.6,score:76,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:"Uh oh. https://t.co/ugpJRZ8rwo https://t.co/qPxM2xH6kY",type:"quote",ver:!0,bm:1,len:54,thumb:"https://pbs.twimg.com/media/HV5nNT7a8AEgdus.png",media:"photo",why:"169 views/min; 70 min old (sweet spot); only 10 replies"},{id:"2116238651411562551",url:"https://x.com/CNBC/status/2116238651411562551",h:"CNBC",name:"CNBC",f:6256951,at:"2026-10-30T18:39:46.000Z",age:85,views:13234,replies:6,likes:15,reposts:0,quotes:0,vpm:155.3,score:76,genre:"Markets & s Kalshi has closed a Series G co-led by Sequoia Capital and Wellington Management.

Its valuation has climbed from $1B in June 2025 to $40B in just sixteen months.

Kalshi launched in 2021 after spending nearly four years securing federal regulation. It gained traction during the 2024 election, then reached a much wider audience after introducing sports contracts in early 2025.

Growth is now increasingly driven by markets beyond sports, including crypto, commodities, and new derivatives products:

"Kalshi continues to experience significant growth, with Q4 revenue currently on track to surpass Robinhood's revenue."

- Oscar Wilde

Oscar Wilde, born in Ireland in 1854, was a celebrated writer, poet, playwright, and intellectual whose work explored beauty, individuality, morality, and the complexities of human nature. Known for his sharp wit and profound observations, Wilde challenged societal expectations while examining love, identity, and human behavior. His literary legacy continues to influence generations, securing his place among the most remarkable figures in English literature.

Wilde\u2019s philosophy offers a powerful reminder that people should never be judged solely by their past. Even those we admire have made mistakes, experienced hardships, and faced moments they would rather forget. Likewise, those who have made poor decisions deserve the opportunity to grow and change. Human beings are constantly evolving, learning from their experiences, and becoming different versions of themselves.

Yet society often defines individuals by their worst moments, overlooking their capacity for redemption and personal growth. Wilde challenges the idea that people are permanently good or bad, emphasizing that mistakes do not determine someone\u2019s entire character. A person\u2019s past may reveal where they have been, but it cannot predict who they will become. Ultimately, no one should be denied the possibility of a better future simply because of the choices they once made.`,type:"post",ver:!0,bm:64,len:1428,thumb:"https://pbs.twimg.com/media/HVxI4xcXUAAgWub.jpg",media:"photo",why:"94 views/min; 605 min old; only 23 replies"},{id:"2116234428892467448",url:"https://x.com/konstructivizm/status/2116234428892467448",h:"konstructivizm",name:"Black Hole",f:877057,at:"2026-10-30T18:23:00.000Z",age:102,views:3130,replies:2,likes:50,reposts:7,quotes:0,vpm:30.7,score:54,genre:"Internet culture",topics:["Internet culture","Science & space"],tags:[],text:`The Ghost of Cassiopeia

High above the plane of the Milky Way, in the royal constellation Cepheus, eerie shapes drift through the darkness at the edge of the vast Cepheus Flare molecular cloud complex, some 1,200 light-years away. These are no true spirits\u2014just vast clouds of interstellar dust, glowing faintly in the reflected light of young stars and looking for all the world like translucent, ghostly figures on the night sky.

Brightest and largest of them is vdB 141 (also known as Sh2-136), the Ghost Nebula. Spanning more than two light-years across, it shines with a warm yellowish-brown glow. Within it, reddish traces reveal dense cores collapsing in the earliest stages of star birth. Just left of center, the Iris Nebula (NGC 7023) stands out against the dark, its dust scattering the blue light of hot young stars into a soft, almost supernatural radiance.
