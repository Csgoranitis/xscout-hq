Citigroup incorrectly recorded certain trades at its European trading unit, understating risk-weighted assets by approximately $35 billion, according to Reuters.

The discrepancy represented roughly 2.7% of Citi's $1.2 trillion total risk-weighted assets.

The bank confirmed it identified and resolved the issue this summer and injected additional capital into the subsidiary to restore regulatory buffers.

Citi says regulatory minimums were never breached, with no impact on its main banking operations.

The incident adds scrutiny to CEO Jane Fraser's regulatory overhaul, following previous compliance failures and fines totaling hundreds of millions of dollars.`,type:"post",ver:!0,bm:12,len:758,thumb:null,media:null,why:"1,409 views/min; 54 min old (sweet spot); only 19 replies; on pace for 100K+ views, where your replies do best"},{id:"2123757500570931417",url:"https://x.com/unusual_whales/status/2123757500570931417",h:"unusual_whales",name:"unusual_whales",f:5375973,at:"2026-11-20T12:37:00.000Z",age:57,views:110664,replies:95,likes:544,reposts:61,quotes:18,vpm:1941.5,score:96,genre:"Markets & stocks",topics:["Markets & stocks","AI","Tech","Science & space"],tags:[],text:`SpaceX\u2019s, $SPCX, lenders want to stop it from launching $40 billion worth of AI chips into space, according to the Financial Times.

The chips back a roughly $40 billion financing deal led by Apollo. An Apollo-managed entity buys Nvidia GPUs and leases them to SpaceX, which pays it back over about five years. If SpaceX defaults, the lenders can take back the chips and sell them.

That\u2019s the problem with space. Lenders worry that if SpaceX later sends the chips into orbit for its planned space-based data centers, they couldn\u2019t reclaim them in a default. They\u2019re now demanding legal protections to keep the chips on the ground.

Veterinarians spent 11 days fighting to save Fiona after she swallowed a visitor's hat. On November 19, the Cincinnati Zoo announced that the beloved nine-year-old Nile hippo had passed away despite extensive medical efforts to clear the obstruction.

The incident occurred on November 8 when a child tossed a knit cap into the air, and a ceiling fan propelled it through a small opening above the viewing windows into Fiona's habitat. Zoo officials emphasized that the event was completely accidental.

As Fiona's appetite declined, the animal care team pursued several interventions to help the fabric pass naturally, including a lengthy endoscopic exam, an enema, and a specialized vibration platform borrowed from a local horse farm. Surgery was ruled out as a viable option because a hippo's massive, multichambered stomach makes locating and retrieving foreign objects extremely difficult, while anesthesia and post-operative recovery carry severe risks.

Fiona first captured hearts around the world in 2017 when she was born six weeks premature, weighing just 29 pounds. Unable to stand on her own, she required round-the-clock intensive care, bottle-feeding, and intravenous fluids to survive.

https://t.co/4AjDs0pJUF`,type:"post",ver:!0,bm:2,len:159,thumb:null,media:null,why:"242 views/min; 116 min old; only 37 replies"},{id:"2123740895795089732",url:"https://x.com/IGN/status/2123740895795089732",h:"IGN",name:"IGN",f:10391746,at:"2026-11-20T11:31:01.000Z",age:123,views:23066,replies:9,likes:45,reposts:5,quotes:2,vpm:187.6,score:73,genre:"Gaming",topics:["Gaming","Science & space"],tags:[],text:"About 5 months after launch, you can finally just buy a Steam Machine without a reservation. https://t.co/WwN8V7qb5N https://t.co/m0fMBpCS0g",type:"post",ver:!0,bm:5,len:140,thumb:"https://pbs.twimg.com/media/HXkLF0eWcAAtajL.jpg",media:"photo",why:"188 views/min; 123 min old; only 9 replies"},{id:"2123767063890079846",url:"https://x.com/Rainmaker1973/status/2123767063890079846",h:"Rainmaker1973",name:"Massimo",f:4449630,at:"2026-11-20T13:15:00.000Z",age:19,views:5972,replies:2,likes:6,reposts:1,quotes:0,vpm:314.3,score:73,genre:"Internet culture",topics:["Internet culture","AI","Film & TV","Music"],tags:[],text:`On average, autistic and non-autistic brains appeared remarkably similar, yet looking closer at individuals revealed major differences.

In a study led by researchers at the University of Iowa, scientists reanalyzed brain scans of autistic and non-autistic adults watching movies, using neuroimaging data previously collected at Indiana University and Caltech. To analyze the scans, the team trained a computational model to link neural activity with specific elements of the films, including sounds, visuals, and social cues.

When researchers compared group averages, the model predicted brain activity similarly across both autistic and non-autistic participants. However, examining individual scans told a different story, as autistic participants diverged significantly more from their own group's average than non-autistic participants did. This heightened individual variability appeared across nearly all brain systems studied, and it was especially pronounced in networks responsible for processing social information.

These results suggest that searching for a single, averaged pattern of autistic brain activity can mask meaningful differences from person to person. At the same time, the findings do not indicate that autistic and non-autistic brains are identical, nor do they mean that every autistic individual processes information in the exact same way, particularly since the study focused strictly on passive movie viewing rather than all aspects of brain function.

Ultimately, researchers hope that mapping these unique individual patterns will help guide more personalized support in the future, though further work is still needed to connect these neural variations to everyday behavior and lived experiences.

[Van De Water, A. L., Byrge, L., Kennedy, D. P., Kliemann, D., & Traer, J. A. (2026). Heterogeneous Encoding Patterns of Dynamic Audiovisual Social Stimuli in Autism Spectrum Disorder. The Journal of Neuroscience. DOI: 10.1523/JNEUROSCI.0055-26.2026]`,type:"post",ver:!0,bm:2,len:1985,thumb:"https://pbs.twimg.com/media/HXkhOOKW8AAYGzn.jpg",media:"photo",why:"314 views/min; 19 min old; only 2 replies"},{id:"2123769631152439550",url:"https://x.com/FirstSquawk/status/2123769631152439550",h:"FirstSquawk",name:"First Squawk",f:579833,at:"2026-11-20T13:25:12.000Z",age:9,views:10590,replies:1,likes:3,reposts:0,quotes:0,vpm:1203.4,score:73,genre:"Markets & stocks",topics:["Markets & stocks","Cars"],tags:["politics"],text:"UK OFFICIALS: EU DEAL COULD LEAD TO MIRRORING CHINA EV TARIFFS - FT",type:"post",ver:!0,bm:0,len:67,thumb:null,media:null,why:"1,203 views/min; 9 min old; only 1 replies"},{id:"2123769270488481834",url:"https://x.com/StockSavvyShay/status/2123769270488481834",h:"StockSavvyShay",name:"Shay Boloor",f:464125,at:"2026-11-20T13:23:46.000Z",age:10,views:13501,replies:13,likes:101,reposts:7,quotes:2,vpm:1319.3,score:73,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:"$NVDA is now experiencing its largest drawdown in 4 years  \u{1F633} https://t.co/O3K9j9gB6j",type:"post",ver:!0,bm:5,len:84,thumb:"https://pbs.twimg.com/media/HXkk3GGaIAARatK.jpg",media:"photo",why:"1,319 views/min; 10 min old; only 13 replies"},{id:"2123743788241649880",url:"https://x.com/CNBC/status/2123743788241649880",h:"CNBC",name:"CNBC",f:6265221,at:"2026-11-20T11:42:31.000Z",age:111,views:16479,replies:9,likes:18,reposts:4,quotes:0,vpm:147.8,score:73,genre:"Markets & stocks",topics:["Markets & stocks","AI"],tags:[],text:"Tech wreck drags Anthropic into the red on its second day of trading https://t.co/3e7qsmJSnc",type:"post",ver:!0,bm:2,len:92,thumb:null,media:null,why:"148 views/min; 111 min old; only 9 replies"},{id:"2123767063365791849",url:"https://x.com/Kalshi/status/212 A new assessment from Google's Threat Intelligence Group and Mandiant predicts that AI systems could independently plan and execute sophisticated attacks with little or no human involvement.

Simpler attacks involving multiple AI agents could emerge within 1-3 MONTHS, with more advanced operations following within 3-6 months.

Launched on November 17 by Botanical Sciences and Edibles. com, the program uses USPS certified mail to fulfill orders. While the service is initially rolling out to a limited group of patients, there are plans to expand availability statewide. To place an order, buyers must verify their patient registration, identity, and delivery details, and all shipments are strictly restricted to eligible patients residing within Georgia.

Unlike home-delivery models operated directly by licensed dispensaries in other states, Georgia's approach relies on established commercial shipping carriers. For patients who live hours away from a dispensary, cannot drive, or face mobility limitations, mail delivery could remove a major barrier to obtaining their medication.

Even so, state authorization has not resolved lingering federal questions. A USPS spokesperson stated that medical marijuana remains nonmailable while postal authorities evaluate the implications of its federal reclassification, whereas Georgia regulators and the participating companies maintain that the initiative is lawful. As a result, this rollout does not signify nationwide permission to mail cannabis or confirmed federal postal endorsement.

The new delivery option arrives amid rapid growth in Georgia's medical cannabis program, which climbed from roughly 34,500 registered patients in March to nearly 65,000 by early November. Regulatory updates that took effect in July also broadened patient eligibility and expanded available products, allowing cannabis flower for vaporization while keeping smoking prohibited.`,type:"post",ver:!0,bm:0,len:1804,thumb:"https://pbs.twimg.com/media/HXkh-VpWEAACh3o.jpg",media:"photo",why:"523 views/min; 9 min old; only 1 replies"},{id:"2123736355322638521",url:"https://x.com/CNBC/status/2123736355322638521",h:"CNBC",name:"CNBC",f:6265221,at:"2026-11-20T11:12:58.000Z",age:141,views:17299,replies:1,likes:1,reposts:0,quotes:0,vpm:122.7,score:69,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:"The Path: Philanthropist Priscilla Chan\u2019s bold bet on rare disease https://t.co/9P64HF6UFf",type:"post",ver:!0,bm:0,len:90,thumb:null,media:null,why:"123 views/min; 141 min old; only 1 replies"},{id:"2123734521996861874",url:"https://x.com/FirstSquawk/status/2123734521996861874",h:"FirstSquawk",name:"First Squawk",f:579833,at:"2026-11-20T11:05:41.000Z",age:148,views:23236,replies:5,likes:12,reposts:2,quotes:2,vpm:156.7,score:69,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:"ALPHABET: FILES FOR PRICING TERM SHEET OF C$6.00B OF NOTES IN FOUR TRANCHES - FILING",type:"post",ver:!0,bm:0,len:84,thumb:null,media:null,why:"157 views/min; 148 min old; only 5 replies"},{id:"2123732628746699147",url:"https://x.com/FirstSquawk/status/2123732628746699147",h:"FirstSquawk",name:"First Squawk",f:579833,at:"2026-11-20T10:58:10.000Z",age:156,views:31554,replies:7,likes:167,reposts:22,quotes:5,vpm:202.5,score:69,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:"EXPLOSIONS HEARD IN STRAIT OF HORMUZ - SABREN NEWS",type:"post",ver:!0,bm:6,len:50,thumb:null,media:null,why:"202 views/min; 156 min old; only 7 replies"},{id:"2123741477238890516", In the heart of galaxy NGC 1672, a blazing bar of stars stretches like a cosmic bridge, funneling rivers of gas straight toward its core. Some 49 million light-years away in the constellation Dorado, this barred spiral is alive with activity.

Three of our most powerful telescopes joined forces to reveal it:
- Chandra\u2019s X-rays (purple) light up growing black holes along the bar and center  
- Hubble\u2019s optical view (white, yellow, and blue) captures the brilliant stars  
- James Webb\u2019s infrared (red) traces the delicate dust filaments  

Together they paint a stunning portrait of a galaxy in motion.

e you) and replies around the same big market and gaming posts. Following back keeps that going. You don't follow him yet.",src:"https://x.com/ForgetfuP"}],brief:{atIso:"2026-11-20T13:45:00Z",at:"7:45 AM CT",analytics:"Pull 7:27 AM CT Fri Nov 20 (vs 3:21 PM CT yesterday). Followers 773, down 3 from 776. Follower list: 1 new, @haileymoonqw (13 followers); 2 lost, @xizl159 (2,234) and @dlde156 (2,340). Last 24h: no new posts or replies. Yesterday was a zero-post day, and the only item since Wednesday night is the @DumbBullCapital repost. So nothing new to rank today. All 1,065 tracked items together picked up 297 views overnight. Best post still: '$NVDA dumping after a great earnings report?' 456 views (+4), 29 likes, 16 replies (https://x.com/RagnarLongstock/status/2123065317240754676). Best recent reply: the @Mapago9 reply on why $NVDA is down, 608 views (+7), 2 likes (https://x.com/RagnarLongstock/status/2123081117393691117). Spikes (growing with no new posts): the Theo Von funeral quote +94 to 921 (https://x.com/RagnarLongstock/status/2122006815911051704), the @RockstarGames 'We are so close' reply +38 to 264,083 (https://x.com/RagnarLongstock/status/2118368249968542001), the Qwen speed quote +13 to 44,321. What worked and why: old humor and the big-account reply keep earning views days later because they sit on big posts. The NVDA question still has the most replies because it asked one simple question on a fresh headline. Who engaged: no new mentions since Wednesday night. Recent ones still unanswered: @bullish1312 asked what happened with precious metals (https://x.com/RagnarLongstock/status/2123097686270505267 thread) and @maxwilliamson__ replied about his TradingView plan. What it means: two days without posts and the count drifted down 4 from Wednesday's 780 high to 773. Posting is the fix, not anything else. Timeline right now (scan 7:34 AM CT): Anthropic ($ANT) is -10% premarket, about -22% from Thursday's open and only ~5% above the $83 IPO price (wallstengine, Kobeissi 265K in 69 min). AI stocks are sliding with it: AMD -6%, Intel -5%, Micron -4.5%, Nvidia -2.5% (DeItaone). S&P futures -1%, Nasdaq 100 futures -1.9%, VIX above 30, Bitcoin at a 4.5-month low of $61,225 (DeItaone). Citi understated risk-weighted assets by about $35B (Reuters via DeItaone). Other big posts: Elon says Tesla's AI4 computer can reach Torment II in Diablo (1.9M in 3h), WatcherGuru's Ashton Kutcher portfolio post (243K in 62 min), naval 'The iPhone Duo is the best iPad Apple's ever made' (62K in 26 min), and FT via unusual_whales: SpaceX's lenders don't want $40B of AI chips launched into space (111K in 57 min).",ai:[{t:"levelsio published 'THE X SPAMMERS LIST': 3,728 accounts he blocked for spamming automated AI replies to farm engagement. He adds that a block from a big account gets weighed heavily by the X algorithm and kills their reach. 143K views.",label:"Worth knowing",by:"levelsio",u:"https://x.com/levelsio/status/2123388955143893122",why:"Your plan runs on replies to big accounts. Keep every reply clearly written by you: short, specific to the post, and never pasted word for word from a list. A block from a big account is the most expensive mistake on that plan. His follow-up on the algorithm: https://x.com/levelsio/status/2123571040806977993"},{t:"Artificial Analysis broke down Google's three new Gemini 4 models. Carbon is the most expensive at $4/$20 per 1M input/output tokens, Neon is $3/$15, and Hydrogen is cheaper. minchoi says Gemini 4 Neon came out less than 39 hours ago and people are calling it 'magical'.",label:"Could improve our workflow",by:"ArtificialAnlys",u:"https://x.com/ArtificialAnlys/status/2123513872095269336",why:"Trader team: the research step that writes a short note on each signal doesn't need the most expensive model. Next time you backtest, run a week of those notes through Neon or Hydrogen next to your current model and compare cost and quality. Proposal only. minchoi's examples: https://x.com/minchoi/status/2123630368620220846"},{t:"witcheer shared a read-only prompt that makes Hermes Agent read the jobs you've scheduled and lay them out Monday to Sunday, then say what a full week of them adds up to. It doesn't create, change or run any job.",label:"Could improve our workflow",by:"witcheer",u:"https://x.com/witcheer/status/2123687797290565945",why:"Trader team on Hermes: run it once to see every scheduled trader job in one view. That way overlapping runs or a job firing outside market hours show up before you start backtesting. It's read-only, so it's safe to try. Proposal only."},{t:"BkashJosi: Hermes Agent has 162 official skills, and most people have added none. His list of 10 for everyday use starts with AgentMail (its own inbox), RSS Feeds (reads any news feed) and Reddit.",label:"Could improve our workflow",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2123747449475084640",why:"Signal-based trader: an RSS skill could pull headlines for the tickers she's about to trade, so each paper trade logs what the news was at entry. That helps explain stalls after entry, since she has no broader-market filter. Proposal only. Test it on paper first."},{t:"omarsar0 on a Meta paper: 'Benchmark Factory', an agent loop that turns merged internal code changes into coding evals for your own codebase.",label:"Could improve TradingDeck",by:"omarsar0",u:"https://x.com/omarsar0/status/2123767076745818281",why:"TradingDeck: the same idea at small scale means every fix Grok Bot or Hermes merges also leaves behind a test, so the next vibe-coded change can't quietly break it. Worth reading before backtesting adds more code. Proposal only."},{t:"Teknium posted 'What could this mean' and BkashJosi tied it to Google's Logan Kilpatrick saying 'December 2nd we take the first step'. He also says Hermes showed up in Microsoft Teams. It's speculation for now.",label:"Worth knowing",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2123689465680199879",why:"If Google does anything with Hermes Agent on Dec 2, it's a timely post for you since you build with Hermes. Nothing is confirmed, so don't post it as news. Teknium's post: https://x.com/Teknium/status/2123671783001948369"},{t:"0xSero: DeepSeek runs well inside Claude Code with a one-click deployment, and he plans to release the repo soon.",label:"Ignore",by:"0xSero",u:"https://x.com/0xSero/status/2123679474084646994",why:"Your stack is Grok Bot and Hermes, and there's no repo yet. Check back only if it ships and people say it holds up."}],drafts:[{kind:"Stock market (today's headline)",text:`Anthropic went public yesterday.
