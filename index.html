cellular service without relying as heavily on existing wireless carriers.

AT&T, Verizon and T-Mobile have asked the FCC to not make these bands available, arguing that 300 million users depend on them and that satellite operations in them are not technically feasible.

In addition to AT&T, Verizon and T-Mobile meeting with the FCC on Oct 20th, SpaceX met with the FCC on Oct 23rd, requesting:
\u2022 More spectrum: Add the 902\u2013928 MHz band to proposed satellite-to-phone rules, potentially opening additional frequencies for Starlink.
\u2022 Fewer restrictions: Modernize interference rules to give satellite networks more flexibility based on the frequencies they use.
\u2022 Easier expansion: Align satellite deployment requirements with terrestrial cellular networks to encourage broader coverage.
