Bank of America says October's hot CPI report virtually guarantees a December Fed rate hike \u2014 and opens the door to a larger 50bps move.

Headline CPI rose 0.4%, while core CPI climbed 0.3%, marking a third consecutive upside inflation surprise. BofA now estimates core PCE inflation at 3.3% YoY.

Price pressures are spreading across goods and services, with electronics, airfares and hotels driving increases.

BofA still expects 25bps in December, but sees growing risk of another hike in January rather than March.

The bank warns the Fed is falling behind inflation and calls October's decision to hold rates a potential policy mistake.`,type:"post",ver:!0,bm:28,len:705,thumb:null,media:null,why:"1,192 views/min; 76 min old (sweet spot); only 59 replies; on pace for 100K+ views, where your replies do best"},{id:"2120496009461780716",url:"https://x.com/unusual_whales/status/2120496009461780716",h:"unusual_whales",name:"unusual_whales",f:5380617,at:"2026-11-11T12:37:00.000Z",age:63,views:63337,replies:46,likes:140,reposts:15,quotes:10,vpm:1005.3,score:93,genre:"Markets & stocks",topics:["Markets & stocks"],tags:[],text:`California has 105 cities where a starter home costs $1 million or more, the most of any state, per Zillow.

The 10-year yield is expected to hold at 5.00% in three months, ease to 4.96% in six months, and fall to 4.75% in a year.

The 2-year yield is projected to decline to 4.66%, 4.59% and 4.33% over the same periods.

The consequences were clear: failing even one test would mean being removed from the film, with Spielberg prepared to reshoot every scene featuring his character. Given the scale and intensity of the production, replacing such an important cast member would have been a massive undertaking.

Despite the enormous pressure, Sizemore reportedly passed every test and completed filming without relapsing. His portrayal of Sergeant Horvath became one of the film\u2019s standout performances, bringing both toughness and emotional depth to Captain Miller\u2019s squad.

Tom\xE1s Natenzon was intercepted on Sunday while riding a Kawasaki motorcycle near the stage prepared for the Pope's appearance.

He reportedly carried four communication devices and a fake Vatican identification card presenting him as a papal liaison with unrestricted access.

A subsequent raid on his home uncovered a 9 mm Bersa pistol, 65 rounds of ammunition, a suspected fake police badge, and another forged diplomatic plate.

Investigators also seized 43 radio communication devices, seven computers, and specialised equipment used to analyse radio frequencies.

Federal authorities are investigating possible document forgery and public intimidation, while the suspect's reasons for entering the security operation remain unclear.

The arrest comes during Pope Leo XIV's visit to Argentina, where he was welcomed by President Javier Milei as part of a wider South American tour.

Authorities have not established that Natenzon intended to attack the Pope.

The human brain generates more electrical impulses per day than all the phones in the world combined. https://t.co/aFQBCaR2ek`,type:"post",ver:!0,bm:7,len:136,thumb:"https://pbs.twimg.com/amplify_video_thumb/2120194904068341760/img/2lhQSphFR3nyIbeK.jpg",media:"video",why:"244 views/min; 30 min old (sweet spot); only 2 replies"},{id:"2120503056874025369",url:"https://x.com/Rainmaker1973/status/2120503056874025369",h:"Rainmaker1973",name:"Massimo",f:4445987,at:"2026-11-11T13:05:00.000Z",age:35,views:7557,replies:1,likes:13,reposts:3,quotes:1,vpm:215.9,score:79,genre:"Internet culture",topics:["Internet culture","Tech","Music","Science & space"],tags:["tragedy"],text:`An unusual radio transmission appeared within archival astronomical data collected while observing a star system located 238 light-years away. The observation targeted K2-155, a red dwarf orbited by three known exoplanets, though the direction of the telescope does not confirm the true origin of the signal. Instead, investigators suspect the emission likely stems from terrestrial radio interference or an internal flaw within the observatory's equipment.

This detection emerged when a research team led by Zi-Qi Li re-evaluated data recorded in 2021 by China's Five-hundred-meter Aperture Spherical Radio Telescope (FAST), which is the largest single-dish radio observatory on Earth. The original survey monitored 33 distinct exoplanet systems. Using newly developed artificial intelligence software, the scientists scanned the archived recordings for faint anomalies and shifting frequency patterns that older analytical tools would have overlooked. 

Out of more than 139,000 initially flagged detections, a single new candidate stood out for closer review. Cataloged as NBS 260108, the anomaly was recorded while the dish was aimed toward K2-155. The transmission was compressed into an exceptionally narrow frequency band and exhibited a steady frequency drift over time. Furthermore, it registered exclusively in the central receiver beam focused on the target star, remaining absent from the surrounding reference beams monitoring adjacent areas of the sky.

These specific attributes warranted deeper scrutiny. Astronomers actively hunt for narrowband radio emissions as potential technosignatures because natural cosmic phenomena rarely generate such tightly focused frequencies, whereas engineered transmitters routinely do. However, human technology on Earth frequently produces identical radio patterns.

Subsequent diagnostic checks revealed significant doubts regarding an extraterrestrial origin. The transmission appeared far stronger in a single polarization channel than in the other, and comparable frequency artifacts surfaced during observations of three completely unrelated stars. These discrepancies substantially weakened the argument that the signal originated from the K2-155 system. Consequently, the researchers concluded that local human-made interference or an instrumental artifact represents the most plausible explanation, even though the exact source remains unconfirmed. Performing a comprehensive review of the raw recordings across all 19 telescope receiver beams could eventually pinpoint where the signal originated.

[Li, Z.-Q., et al. (2026). A Search for Technosignatures around 33 Exoplanet Systems Using Machine Learning on FAST Archival Data. The Astronomical Journal. DOI: 10.3847/1538-3881/ae0182]`,type:"post",ver:!0,bm:2,len:2748,thumb:"https://pbs.twimg.com/media/HW2EY-tWgAAID7v.jpg",media:"photo",why:"216 views/min; 35 min old (sweet spot); only 1 replies"},{id:"2120506204023820322",url:"https://x.com/FirstSquawk/status/2120506204023820322",h:"FirstSquawk",name:"First Squawk",f:578016,at:"2026-11-11T13:17:30.000Z",age:22,views:12721,replies:0,likes:4,reposts:1,quotes:0,vpm:565.4,score:79,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:"GERMAN GOVERNMENT SAYS ON POSSIBLE TALKS BETWEEN RUSSIA'S PUTIN, GERMANY'S MERZ: DISCUSSIONS CAN PROCEED ON BASIS OF PRINCIPLES AGREED UPON IN ABU DHABI",type:"post",ver:!0,bm:0,len:152,thumb:null,media:null,why:"565 views/min; 22 min old; only 0 replies"},{id:"2120505943586938976",url:"https://x.com/StockSavvyShay/status/2120505943586938976",h:"StockSavvyShay",name:"Shay Boloor",f:462994,at:"2026-11-11T13:16:28.000Z",age:24,views:16360,replies:8,likes:87,reposts:15,quotes:3,vpm:695.2,score:79,genre:"Markets & stocks",topics:["Markets & stocks","Tech"],tags:[],text:"$IBM just unveiled Nighthawk r3 designed for 10,000 quantum operations across 520 qubits with plans to connect two chips into a 1,040-qubit system in 2027. https://t.co/OdiZYqnppg",type:"post",ver:!0,bm:7,len:179,thumb:"https://pbs.twimg.com/media/HW2L4S-acAAFl65.png",media:"photo",why:"695 views/min; 24 min old; only 8 replies"},{id:"2120505871109402634",url:"https://x.com/FirstSquawk/status/2120505871109402634",h:"FirstSquawk",name:"First Squawk",f:578016,at:"2026-11-11T13:16:11.000Z",age:24,views:12242,replies:2,likes:9,reposts:0,quotes:0,vpm:514,score:79,genre:"Markets & stocks",topics:["Markets & stocks","AI"],tags:[],text:"ANTHROPIC MEGA-IPO IS SAID TO BE MULTIPLE TIMES OVERSUBSCRIBED.",type:"post",ver:!0,bm:1,len:63,thumb:null,media:null,why:"5 ars. Introduced at Sound Relief Tinnitus & Hearing Center in Arizona, this diagnostic technology assesses how patients perceive tones across a highly detailed spectrum of pitches. During the examination, patients wear calibrated headphones and press a space bar each time they detect a sound. Their inputs enable clinicians to map out exact hearing thresholds and uncover subtle auditory patterns that can help guide personalized clinical care.

For individuals dealing with chronic ringing, buzzing, or hissing sounds, this detailed mapping provides objective audiological data to pair with their subjective descriptions of the condition. Clinicians combine these frequency results with comprehensive questionnaires covering sleep quality, stress levels, and daily lifestyle habits. Gathering this combined dataset helps specialists evaluate both the mechanical auditory symptoms and the broader impact the condition has on daily functioning.

According to audiologist Madison Brown, the center's therapeutic philosophy relies heavily on neuroplasticity, which is the brain's natural capacity to reorganize and adapt its neural pathways. Many tinnitus interventions focus on retraining how the brain processes phantom sounds, ultimately making them less intrusive or distressing. For instance, tailored sound therapy uses background acoustics to shift focus away from the ringing and encourage auditory habituation. Additionally, specialized hearing aids can benefit individuals with underlying hearing deficits, while psychological interventions like cognitive behavioral therapy help patients manage the emotional distress linked to chronic tinnitus.

It is important to note that the 67-frequency evaluation serves strictly as a diagnostic mapping tool to inform treatment planning. The test itself is not a cure, and local clinical reports do not provide peer-reviewed clinical trial data proving that this specific testing technology directly improves patient outcomes. While there is currently no established cure for most forms of chronic tinnitus, customized management strategies can significantly lessen its interference with sleep, concentration, and overall quality of life.`,type:"post",ver:!0,bm:13,len:2323,thumb:"https://pbs.twimg.com/media/HW2Dbj_XUAAbjeu.jpg",media:"photo",why:"192 views/min; 45 min old (sweet spot); only 1 replies"},{id:"2120494250953523233",url:"https://x.com/Rainmaker1973/status/2120494250953523233",h:"Rainmaker1973",name:"Massimo",f:4445987,at:"2026-11-11T12:30:00.000Z",age:70,views:14354,replies:6,likes:173,reposts:28,quotes:0,vpm:205.1,score:78,genre:"Internet culture",topics:["Internet culture","Music"],tags:[],text:"This song became a Top 5 hit in 1974, selling over a million copies, and marked a rare mainstream breakthrough for a band with Native American roots. https://t.co/Nefu0iu5YD",type:"post",ver:!0,bm:29,len:173,thumb:"https://pbs.twimg.com/amplify_video_thumb/2005838805152972800/img/UBdW2Ee2tekUjMI3.jpg",media:"video",why:"205 views/min; 70 min old (sweet spot); only 6 replies"},{id:"2120511790236705258",url:"https://x.com/StockMKTNewz/status/2120511790236705258",h:"StockMKTNewz",name:"Evan",f:1172182,at:"2026-11-11T13:39:42.000Z",age:1,views:2201,replies:1,likes:2,reposts:0,quotes:0,vpm:2201,score:78,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:`Robinhood $HOOD just released some October operating data

Ookla\u2019s new report shows major progress for Starlink, comparing the first half of 2026 with the same period in 2025:

\u2022 Faster uploads: National median upload speeds rose from 14.63 Mbps to 20.73 Mbps, improving in every state and Washington, D.C.

\u2022 Faster downloads: National median download speeds increased 12% to 119.71 Mbps.

\u2022 Lower lag: Latency improved in 49 states and D.C., making connections more responsive.

\u2022 More states below 40 ms: 24 states recorded median latency under 40 milliseconds, up from just 10 a year earlier.

\u2022 More users reaching broadband speeds: 40% of U.S. Starlink Speedtest users achieved at least 100 Mbps downloads and 20 Mbps uploads, up from 18.9%.

\u2022 Winning customers: Around 9 in 10 new Starlink users tracked by Ookla switched from connections such as cable, DSL or fixed wireless.`,type:"post",ver:!0,bm:3,len:913,thumb:"https://pbs.twimg.com/media/HW2G-65b0AAz0Ak.jpg",media:"photo",why:"284 views/min; 49 min old (sweet spot); only 23 replies"},{id:"2120499281035730949",url:"https://x.com/Kalshi/status/2120499281035730949",h:"Kalshi",name:"Kalshi",f:508262,at:"2026-11-11T12:50:00.000Z",age:50,views:13050,replies:16,likes:43,reposts:1,quotes:0,vpm:261,score:77,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:'BREAKING: Democrats plan to move the Jan. 6 officers plaque to a "more public" Capitol location',type:"post",ver:!0,bm:1,len:95,thumb:null,media:null,why:"261 views/min; 50 min old (sweet spot); only 16 replies"},{id:"2120492703536525781",url:"https://x.com/cb_doge/status/2120492703536525781",h:"cb_doge",name:"DogeDesigner",f:1910385,at:"2026-11-11T12:23:52.000Z",age:76,views:20373,replies:33,likes:534,reposts:88,quotes:9,vpm:267.6,score:77,genre:"Markets & stocks",topics:["Markets & stocks","Science & space","Business & startups"],tags:[],text:`BREAKING: Louisiana signs a contract worth up to $6.8 million to support transportation planning for SpaceX\u2019s Starbase Louisiana.

The lawsuit, filed in Dec 2025, concerns a BBC Panorama documentary that edited together separate parts of Trump's Jan 6 speech, making it appear that he directly encouraged supporters to storm the Capitol.

Today, the court ruled that Trump had plausibly alleged reputational harm and presented sufficient grounds for his defamation claim to proceed.

The BBC previously acknowledged that the editing gave the impression of a direct call for violent action, with chairman Samir Shah apologising for what he described as an "error of judgment".

The controversy also contributed to the resignation of then-BBC director-general Tim Davie.

Trump celebrated the ruling on Truth Social, calling it a "Huge Victory against Fake News BBC" and accusing the broadcaster of deceiving the American public.

Rather than simply relying on thicker armor or stronger shields, the dwarves used their engineering expertise to create elaborate defensive formations and mechanisms capable of stopping incoming arrows. It perfectly reflects the strengths of both races. While elves are renowned for their precision and mastery of the bow, dwarves excel at craftsmanship, innovation, and mechanical ingenuity.

What makes this detail so interesting is how it adds depth to Middle-earth\u2019s military tactics. Instead of trying to match the elves at something they do best, the dwarves developed technology to neutralize their advantage.

It\u2019s a brilliant example of fantasy world-building, showing how opposing strengths can shape battlefield strategies. The dwarves couldn\u2019t outshoot the elves, so they found a way to out-engineer them.`,type:"post",ver:!0,bm:87,len:1012,thumb:"https://pbs.twimg.com/amplify_video_thumb/2119465258288852994/img/uB5AB3IWFq0SUTFW.jpg",media:"video",why:"459 views/min; 280 min old; only 25 replies; on pace for 100K+ views, where your replies do best"},{id:"2120508089925357602",url:"https://x.com/Rainmaker1973/status/2120508089925357602",h:"Rainmaker1973",name:"Massimo",f:4445987,at:"2026-11-11T13:25:00.000Z",age:15,views:6014,replies:5,likes:16,reposts:2,quotes:3,vpm:400.9,score:70,genre:"Internet culture",topics:["Internet culture","Music","Travel & nature","Health & fitness"],tags:[],text:`An experimental hair comb featuring electrified teeth has successfully restored nearly all lost hair on balding skin within a single month during preclinical testing. Engineered by a research team at Beihang University in Beijing and detailed in Nature Communications, the bioelectronic device is named Detangle. Its specialized teeth integrate microscopic electrodes positioned at varying heights alongside compact drug-loading chambers. With each brushing stroke, the system generates a localized electric field that penetrates approximately nine times deeper into the hair follicles than standard electrodes placed flat against the surface of the skin.

This targeted electrical pulse simultaneously stimulates the hair follicles and temporarily increases cellular permeability, enabling the comb to deliver two distinct genetic payloads directly into the target cells. The first payload is a plasmid carrying the gene for vascular endothelial growth factor A (VEGF-A), a signaling protein that promotes the formation of new blood vessels to nourish the follicle. The second is a small interfering RNA (siRNA) molecule designed to silence the enzyme responsible for producing dihydrotestosterone (DHT), the primary androgen hormone that shrinks follicles in pattern baldness. In laboratory evaluations, mice with experimentally induced pattern hair loss were brushed once every three days. Following 30 days of this regimen, the treated bald patches regrew nearly 100% of their hair.

Androgenetic alopecia, commonly known as pattern baldness, represents the most widespread form of hair loss, yet existing therapies carry notable limitations. Oral medications that inhibit DHT synthesis can trigger systemic side effects throughout the body, whereas topical solutions like minoxidil often fail to penetrate deep enough into the dermal layer to achieve consistent efficacy. Integrating targeted follicular delivery directly into a routine grooming tool offers a practical way to bypass both obstacles.

Despite these promising findings, all current data stem exclusively from preclinical trials in mice with artificially induced hair loss. Because human scalp architecture and endocrine profiles differ substantially from rodent models, clinical trials are necessary to determine whether the device will perform safely and effectively in people.

[Liu, F., et al. (2026). Combing-triggered electrostimulation synchronizing deep delivery for rapid hair regrowth in androgenetic alopecia. Nature Communications. DOI: 10.1038/s41467-026-79122-3]`,type:"post",ver:!0,bm:8,len:2545,thumb:"https://pbs.twimg.com/media/HW2GUmKWMAAmUIU.jpg",media:"photo",why:"401 views/min; 15 min old; only 5 replies"},{id:"2120479149337030872",url:"https://x.com/Rainmaker1973/status/2120479149337030872",h:"Rainmaker1973",name:"Massimo",f:4445987,at:"2026-11-11T11:30:00.000Z",age:130,views:18746,replies:12,likes:568,reposts:52,quotes:2,vpm:144.2,score:70,genre:"Internet culture",topics:["Internet culture","Memes & viral","Animals & wholesome"],tags:[],text:`This is a very sweet, elderly yellow Labrador.

https://t.co/vjrXV0lEdy`,type:"post",ver:!0,bm:2,len:260,thumb:null,media:null,why:"82 views/min; 31 min old (sweet spot); only 0 replies"},{id:"2120504314997170485",url:"https://x.com/konstructivizm/status/2120504314997170485",h:"konstructivizm",name:"Black Hole",f:877496,at:"2026-11-11T13:10:00.000Z",age:30,views:2389,replies:0,likes:13,reposts:5,quotes:0,vpm:79.6,score:68,genre:"Internet culture",topics:["Internet culture","History & facts"],tags:["politics","tragedy"],text:`A Cosmic Odd Couple Caught in a Rare Evolutionary Moment

Deep inside the crowded globular cluster NGC 362, about 29,300 light-years away, astronomers have found a striking stellar pair: a rapidly spinning millisecond pulsar and the youngest white dwarf companion ever identified next to one.

The pulsar, NGC 362D, rotates once every 5.83 milliseconds\u2014more than 10,000 times per minute. These extreme \u201Ccosmic lighthouses\u201D form only in binary systems. A companion star swells, spills material onto the neutron star, and spins it up to incredible speeds in a process called recycling.

What makes this system special is the timing. The companion, COM-NGC 362D, is a low-mass helium white dwarf still in its earliest \u201Cpre-cooling\u201D phase. Models indicate the mass-transfer phase ended only about 600 million years ago\u2014making it the youngest white dwarf partner to a millisecond pulsar known so far.

By combining radio data from the pulsar with a decade of Hubble ultraviolet and near-infrared observations, researchers led by Greta Ettorre found another clue: residual material still surrounding the young white dwarf, left over from the recent mass transfer. This material appears to dim some of its ultraviolet light, offering a rare snapshot of the system right after the recycling process finished.

\u201CWhat makes this system particularly interesting is the possibility of observing it at a very early stage of its evolution,\u201D Ettorre said.

These natural clocks, with their ultra-precise pulses, help test gravity and general relativity under extreme conditions. Catching one so soon after it was spun up gives astronomers a valuable laboratory for understanding how these remarkable objects form and evolve.`,type:"post",ver:!0,bm:1,len:1709,thumb:"https://pbs.twimg.com/amplify_video_thumb/2120386865161289728/img/LSfaCV23HFIMRC7L.jpg",media:"video",why:"80 views/min; 30 min old (sweet spot); only 0 replies"},{id:"2120477743834153045",url:"https://x.com/TheFigen_/status/2120477743834153045",h:"TheFigen_",name:"The Figen",f:2764464,at:"2026-11-11T11:24:25.000Z",age:136,views:14384,replies:7,likes:292,reposts:15,quotes:3,vpm:106.1,score:68,genre:"Internet culture",topics:["Internet culture","Memes & viral"],tags:["sports"],text:"This is the cutest and elegant paws in the world? https://t.co/U607VJXLIK",type:"post",ver:!0,bm:7,len:73,thumb:"https://pbs.twimg.com/media/HW1zRC0W4AAKw6t.jpg",media:"photo",why:"106 views/min; 136 min old; only 7 replies"},{id:"2120476632733360580",url:"https://x.com/Rainmaker1973/status/2120476632733360580",h:"Rainmaker1973",name:"Massimo",f:4445987,at:"2026-11-11T11:20:00.000Z",age:140,views:16887,replies:12,likes:91,reposts:11,quotes:2,vpm:120.6,score:68,genre:"Internet culture",topics:["Internet culture"],tags:[],text:`Buster Keaton was different.

- Niccolo Machiavelli

This reflects the central idea of Machiavellian political realism: the need to adapt your strategy to the harsh realities of the world around you. Paired with Santi di Tito\u2019s famous portrait of Niccol\xF2 Machiavelli, the message suggests that rigidly following traditional moral principles in a world where others disregard them can lead to defeat.

Rather than encouraging cruelty or dishonesty, the idea emphasizes practicality and strategic awareness. Machiavelli\u2019s philosophy reminds us that survival and success often depend on understanding the rules others actually play by, rather than the rules we wish they followed.`,type:"post",ver:!0,bm:255,len:696,thumb:"https://pbs.twimg.com/media/HWnGiqAWMAAoIH4.jpg",media:"photo",why:"113 views/min; 640 min old; only 23 replies"},{id:"2120480155709976893",url:"https://x.com/konstructivizm/status/2120480155709976893",h:"konstructivizm",name:"Black Hole",f:877496,at:"2026-11-11T11:34:00.000Z",age:126,views:3613,replies:6,likes:36,reposts:9,quotes:0,vpm:28.7,score:55,genre:"Internet culture",topics:["Internet culture","Science & space","TV & streaming"],tags:["sports"],text:`That\u2019s no Moon\u2014it\u2019s Venus, wearing its rarest and most dramatic disguise.

Every year and a half, Venus slips almost directly between us and the Sun. From Earth it becomes a razor-thin crescent, the kind that can fool you into thinking you\u2019re looking at a new Moon. But Venus refuses to play by lunar rules.

Its thick, carbon-dioxide atmosphere bends and scatters sunlight around the planet\u2019s edge, stretching the glowing arc past a perfect half-circle. The tips lengthen into luminous \u201Chorns\u201D that curl farther than geometry alone would allow\u2014an ethereal, almost living crescent that seems to wrap itself around the night side.

The effect is brief and spectacular. Catch it in the days around inferior conjunction and even a modest telescope (or steady binoculars at twilight) will show you a planet that looks less like a world and more like a glowing scythe suspended in the sky.

For seven years, a scorching gas giant roughly 1,000 light-years away regularly slipped in front of its star, dimming the light just enough for NASA\u2019s TESS telescope to notice. Then, in 2026, the transits simply stopped.

The planet hadn\u2019t been destroyed. It had tilted out of view.

TOI-2535 b is a classic \u201Chot Jupiter\u201D\u2014a Jupiter-sized world racing around its star in only 8.25 days, ten times faster than Mercury orbits the Sun. Its transits were never perfectly regular; they arrived up to six hours early or late, and grew steadily shorter and shallower until they vanished altogether.

UCLA astronomers Samuel Yee, Erik Petigura, and their team realized an unseen neighboring planet is to blame. The two worlds are gravitationally locked in a strong interaction that makes both of their orbits wobble like a spinning top. As TOI-2535 b\u2019s path tilts, it no longer crosses our line of sight\u2014exactly the same geometry that makes total solar eclipses on Earth rare instead of monthly.

\u201CThis is the most extreme example we\u2019ve seen,\u201D Yee says. \u201CThe planet\u2019s orbit is tilting so quickly that its transit disappeared while we were watching.\u201D

The planet is expected to swing back into view in 30 to 50 years. Its hidden companion may appear sooner. The discovery also offers a clue about how the hot Jupiter got so close to its star: the presence of a nearby neighbor suggests it migrated inward more gently through the disk rather than being violently flung onto an eccentric orbit.

It\u2019s a rare, real-time view of planets actively reshaping each other\u2019s paths\u2014proof that planetary systems are not fixed clockwork, but dynamic and ever-changing.`,type:"post",ver:!0,bm:1,len:1707,thumb:"https://pbs.twimg.com/amplify_video_thumb/2120384329322799104/img/Z2LGw-SR9_dFBBr_.jpg",media:"video",why:"25 views/min; 150 min old; only 3 replies"},{id:"2120350826342343093",url:"https://x.com/NoContextHumans/status/2120350826342343093",h:"NoContextHumans",name:"Out of Context Human Race",f:4241323,at:"2026-11-11T03:00:05.000Z",age:640,views:64747,replies:74,likes:776,reposts:36,quotes:13,vpm:101.2,score:53,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"You can\u2019t beat British cuisine.\u{1F1EC}\u{1F1E7} https://t.co/zLz33Lv2Y8",type:"post",ver:!0,bm:82,len:57,thumb:"https://pbs.twimg.com/media/HWtVOhwXwAA3LaU.jpg",media:"photo",why:"101 views/min; 640 min old; only 74 replies"},{id:"2120350366034518035",url:"https://x.com/PicturesFoIder/status/2120350366034518035",h:"PicturesFoIder",name:"non aesthetic things",f:5589587,at:"2026-11-11T02:58:16.000Z",age:642,views:52027,replies:14,likes:269,reposts:17,quotes:2,vpm:81.1,score:53,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"WANTED: Armed bomber on the run in Spain, could have fled to other EU countries. Report any sightings https://t.co/rPrLOMJQ3j",type:"post",ver:!0,bm:20,len:125,thumb:"https://pbs.twimg.com/media/HWz_TvHacAA9gVd.jpg",media:"photo",why:"81 views/min; 642 min old; only 14 replies"},{id:"2120442201217859939",url:"https://x.com/NoContextHumans/status/2120442201217859939",h:"NoContextHumans",name:"Out of Context Human Race",f:4241323,at:"2026-11-11T09:03:11.000Z",age:277,views:20318,replies:3,likes:8,reposts:1,quotes:0,vpm:73.4,score:53,genre:"Memes & viral",topics:["Memes & viral","AI"],tags:[],text:`AI agents are getting seriously interesting.
