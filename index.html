Harry S. Truman believed public office was a responsibility to the American people, not an opportunity for personal enrichment. Known for his modest lifestyle, he openly criticized politicians who used their positions to build personal fortunes. After leaving the White House, Truman returned to Missouri with relatively limited financial resources, helping inspire Congress to pass the Former Presidents Act of 1958.
