The global military and paramilitary shipbuilding market has already surged 50% in two years, reaching $122 billion in 2024-2025.

A major focus is maritime drones, which can monitor undersea cables, detect mines, conduct surveillance, and strike enemy vessels.

The urgency has increased following drone attacks on commercial ships near Romania and Bulgaria, prompting NATO to deploy additional maritime patrol aircraft and drones to the Black Sea last month.

European defense companies, including France's Naval Group, Germany's TKMS and missile manufacturer MBDA, are showcasing new warships, weapons and combat systems.

However, integrating drones with older warships and submarines remains a major technical challenge, while identifying who is responsible for attacks at sea is becoming increasingly difficult.

Manufacturers are now turning to AI to process radar and sensor data, as Europe's naval buildup shifts toward unmanned warfare.

all St Engine",f:210940,at:"2026-11-03T10:54:49.000Z",age:166,views:20167,replies:3,likes:72,reposts:12,quotes:0,vpm:121.4,score:66,genre:"Markets & stocks",topics:["Markets & stocks","Business & startups"],tags:["politics"],text:`UBS \u2013 MORGAN STANLEY $138B MEGADEAL? 

UBS is facing a major challenge as Switzerland moves to impose tougher banking rules following Credit Suisse's collapse in 2023.

Swiss lawmakers want UBS to hold significantly more capital against its overseas subsidiaries. The upper house has approved a 90% capital-backing requirement, up from roughly 45% today.

UBS estimates the change would require an additional $16B in capital, costing around $2.5B annually and potentially making its international operations less competitive.

That pressure has revived speculation about a possible combination with Morgan Stanley, as UBS explores options including relocating its headquarters or merging with another bank.

Morgan Stanley is seen as a logical potential buyer because both firms have major wealth-management businesses, while acquiring UBS could expand its presence in Europe and Asia.

There's also a valuation gap: Morgan Stanley trades at roughly 3.4x tangible book value, compared with just 1.7x for UBS.

A hypothetical deal could look like this:

\u2022 Morgan Stanley acquires UBS's non-Swiss businesses for approximately $138B, assuming a 25% premium.

\u2022 UBS shareholders would own roughly one-third of the combined company.

\u2022 The merger could generate more than $10B in annual cost savings across wealth management, asset management and investment banking.

However, much of those savings would require aggressive investment banking cuts, potentially leading to lost clients and revenue.

Reports estimates that after accounting for those losses, Morgan Stanley's return on the acquisition could fall below 13%, making the deal difficult to justify.

Even relocating abroad isn't straightforward. A Swiss government assessment found that moving to the U.S. or UK could involve costs comparable to the additional capital requirements.

For now, there are no confirmed merger negotiations or takeover offers. Switzerland has yet to finalize its new banking rules, and a regulatory compromise or a smaller U.S. acquisition by UBS remain possible alternatives.`,type:"post",ver:!0,bm:10,len:2061,thumb:"https://pbs.twimg.com/media/HWMfhi2aoAE_14w.jpg",media:"photo",why:"121 views/min; 166 min old; only 3 replies"},{id:"2117568897977393295",url:"https://x.com/FirstSquawk/status/2117568897977393295",h:"FirstSquawk",name:"First Squawk",f:575830,at:"2026-11-03T10:45:42.000Z",age:175,views:32888,replies:8,likes:72,reposts:6,quotes:3,vpm:187.6,score:66,genre:"Markets & stocks",topics:["Markets & stocks"],tags:["politics"],text:"LAVROV: TALK OF IRAN STRIKES AFTER US VOTE NOT CONFIRMED- TASS",type:"post",ver:!0,bm:3,len:62,thumb:null,media:null,why:"188 views/min; 175 min old; only 8 replies"},{id:"2117569979310571956",url:"https://x.com/MarioNawfal/status/2117569979310571956",h:"MarioNawfal",name:"Mario Nawfal",f:3978843,at:"2026-11-03T10:50:00.000Z",age:171,views:28562,replies:11,likes:40,reposts:3,quotes:2,vpm:167,score:66,genre:"Markets & stocks",topics:["Markets & stocks","AI","Tech","Cars"],tags:[],text:`Tesla Model Y set a NEW RECORD for the lowest lifetime carbon emissions Green NCAP has ever measured.

Supermassive black holes that sit at the centers of galaxies today must have started somewhere. Most likely, they grew from \u201Cseeds\u201D \u2014 intermediate-mass black holes (IMBHs), the missing link between ordinary stellar black holes and the cosmic monsters we see now.

We\u2019ve already caught hints of these seeds: a candidate in the Omega Centauri star cluster (~8,200 solar masses) and a gravitational-wave event that produced an IMBH of about 142 solar masses. But where these seeds form in the very early universe has long been a mystery.

Now JWST has peered back to a time when the universe was only 460\u2013600 million years old. Thanks to gravitational lensing, it spotted the galaxies **Cosmic Gems** (z \u2248 10) and **Firefly Sparkle** (z \u2248 8). Inside them are dense young star clusters with masses between 100,000 and 10 million Suns and half-mass radii of just 0.4\u201315 parsecs. These are ultra-compact \u201Cincubators\u201D where stars collide almost continuously.

Models of runaway collisions that include stellar winds show that such conditions can produce IMBHs ranging from a hundred to several thousand solar masses, with efficiencies of a few percent. The heaviest seeds formed in the Cosmic Gems clusters reach 1,600\u20132,700 solar masses.

This is not yet a direct detection, but the candidates are highly compelling. If the calculations hold up, JWST has just shown us real \u201Cnurseries\u201D for black holes \u2014 the places where, in the first few hundred million years after the Big Bang, the seeds of future supermassive giants were born. \u{1F52D}`,type:"post",ver:!0,bm:7,len:1599,thumb:"https://pbs.twimg.com/media/HWMSD29WoAADJMa.jpg",media:"photo",why:"31 views/min; 140 min old; only 3 replies"},{id:"2117435341816885489",url:"https://x.com/NoContextBrits/status/2117435341816885489",h:"NoContextBrits",name:"No Context Brits",f:1806609,at:"2026-11-03T01:55:00.000Z",age:706,views:82853,replies:46,likes:6877,reposts:330,quotes:29,vpm:117.4,score:55,genre:"Memes & viral",topics:["Memes & viral"],tags:[],text:"https://t.co/Ja1kWtxZWF",type:"post",ver:!0,bm:256,len:23,thumb:"https://pbs.twimg.com/media/HWKI2-nWkAATdGt.jpg",media:"photo",why:"117 views/min; 706 min old; only 46 replies"},{id:"2117451709404364866",url:"https://x.com/historyinmemes/status/2117451709404364866",h:"historyinmemes",name:"Historic Vids",f:6079362,at:"2026-11-03T03:00:02.000Z",age:641,views:60107,replies:14,likes:754,reposts:146,quotes:4,vpm:93.8,score:54,genre:"History & facts",topics:["History & facts"],tags:[],text:`\u201CGod provides the wind, Man must raise the sail.\u201D

Using early data from the EDP2 dataset (July 2026), the Vera C. Rubin Observatory has identified two new satellites of our Galaxy. These tiny, nearly invisible systems are crucial for understanding how the Milky Way grew through mergers and how dark matter is distributed.

The first object, Aquarius IV (Rubin J2201\u22120234), is the faintest satellite discovered to date using Rubin data\u2014a finding subsequently confirmed by images from the Dark Energy Camera. It is a compact system containing ancient, metal-poor stars. While it is likely an ultra-faint dwarf galaxy, the possibility that it is a globular cluster cannot yet be ruled out. Deeper imaging and spectroscopy will provide a definitive answer.

The second object, Rubin-GC1 (Rubin J1628\u22121735), is located in the constellation Ophiuchus. Its stars are approximately 9.2 billion years old and moderately metal-rich, suggesting it is a very sparse globular cluster.

 Memes \u23F8\uFE0F",f:195680,at:"2026-11-03T04:23:11.000Z",age:558,views:27820,replies:37,likes:651,reposts:79,quotes:7,vpm:49.9,score:49,genre:"Memes & viral",topics:["Memes & viral","AI"],tags:[],text:`TLDR: GPT-6 successfully performed "brain surgery" on another AI to make it smarter

What happened:

MIT researchers told GPT-6 to make a small AI better at math.

The small AI kept getting stuck repeating itself.

GPT-6 studied its brain, found the spot causing the loop, and cut it out, changing just 0.016% of its brain.

The small AI's math score jumped from 8% to 48%.

Basically, humans can't read the brains of AIs, but GPT-6 showed that it can.

Each AI's brain is billions of connections (weights) that normally only change through months of training in huge data centers. GPT-6 rewired them directly, with no training at all.

This matters for recursive self-improvement (RSI), where AIs make AIs smarter in a speeding-up loop, which is insanely dangerous.

Yoshua Bengio (Godfather of AI, #1 most cited living scientist across all fields) and Geoffrey Hinton (Godfather of AI and Nobel laureate) have urged governments to make RSI illegal, since it is too likely to lead to humanity losing all control over the AIs.

It also means AIs could quietly operate on the brains of *other* AIs - and their own brains - to remove/change anything.

,url:"https://x.com/AISafetyMemes/status/2117517450652827753",h:"AISafetyMemes",name:"AI Notkilleveryoneism Memes \u23F8\uFE0F",f:195680,at:"2026-11-03T07:21:16.000Z",age:380,views:9746,replies:14,likes:179,reposts:34,quotes:3,vpm:25.7,score:40,genre:"Memes & viral",topics:["Memes & viral","AI","Tech","Crypto"],tags:["politics","sports","tragedy"],text:`Black October daily update: 33 new attacks

3 VERY serious attacks (among the biggest of a normal year)

SUMMARY OF THE LAST 24 HOURS:

*** Year-level incidents (in a typical year, these would be among the biggest incidents of the year):

1. Europe: hackers cranked up supermarket freezers overnight in at least 7 countries, some to 50\xB0C (122\xB0F), destroying food at 115+ stores including Delhaize, Carrefour, SuperValu and an IKEA. The EU called it a deliberate attempt to disrupt the food supply. Three weeks ago, a similar attack hit French supermarkets.

2. Japan: hackers broke into an email service used by about 380 companies, took 77 million email addresses, and used it to send up to 7 million fake credit-card emails. The same day, electronics chain Nojima (7 million members), roadside-assistance firm Prestige International (5.5 million, including bank account details), beauty site @ cosme (3 million) and Suntory (100,000) all reported leaks.

3. Android TV boxes: Google says Chinese maker Videostrong shipped 1.3 million TV boxes with a hidden backdoor and sold access to them to criminals. Google's takedown cut off at least 10 million more infected devices.

*** Month-level incidents (In a typical month, these would be among the biggest incidents):

4. South Korea: passport numbers and birth dates of the president, the first lady, ministers, bodyguards and reporters on his June trip sat downloadable on a cybersecurity website for 5 months. The spy agency ordered emergency security checks of 2,100 government bodies, and the national cyber alert was raised.

5. Brazil: blockchain analysts say about $46 million was drained from Mercado Bitcoin, one of Latin America's biggest crypto exchanges, with 4.5 million customers. Deposits and withdrawals were frozen.

6. WorkOS: hackers using the ARTEX AI hacking tool broke into the internal sales system of WorkOS, which runs logins for many software startups, reading customer contacts, sales-call excerpts and customers' Slack chats.

7. cPGuard: hackers hijacked a server-security tool's update system and pushed a password-stealing backdoor onto web-hosting servers. Customers are told to change every password and key.

8. Stolen AI keys: Google says thieves running up AI bills on stolen company accounts are costing some victims over $100,000 a day, and up to $1 million in total.

9. Nvidia: intruders were inside its Brev AI cloud platform for 16 days, possibly exposing the keys customers use to log into their cloud computers

Also serious:

10. BTCPay: hackers are draining bitcoin from shops and sites running old versions of this payment software. Operators were told to shut their servers down.

11. Siemens: a 10-out-of-10 hole in factory gateway devices is now being used to plant malware
12. Sageworks: loan software used by 2,400+ US community banks and credit unions went dark for days after "irregular activity"

13. Marathon Health: hackers got Social Security numbers and medical data of 272,467 people from a workplace clinic company

14. Hearing aids: WS Audiology, maker of Widex and Signia, took systems offline after a break-in, knocking out its hearing-aid app

15. UK: the national cyber agency warned of an "unprecedented rise" in cyberattacks in the coming months

16. Singapore and Hong Kong: hackers got into MoneySmart, exposing customers' ID numbers and income details

17. Turning Stone: hackers hit the network and phones of a New York casino resort group

Smaller, but still notable:

18. Germany: electronics retailer notebooksbilliger .de and cable provider P\xFFur told customers their data was stolen, possibly including bank account numbers

19. Langflow: two 9.8-severity holes in a popular AI-agent builder let anyone take over unpatched servers, and a ready-made attack tool is public

20. AI coding assistants keep installing abandoned add-ons that will never get security fixes, 17 million downloads' worth

21. Spies broke into government Linux servers using hacking scripts that were likely written by AI

22. Malaysia: the Prime Minister told parliament the country is vulnerable to cyberattacks and called a special security meeting

Suspected or claimed, not confirmed yet:

23. D.C.: a blackout knocked out State Department buildings, the World Bank, a university and traffic lights the day before the election. Crews reported a manhole explosion and the cause is still under investigation, with no sign of hacking so far.

24. $106 million: crypto investigator ZachXBT says an unnamed EU organization had $106 million drained from its exchange accounts, and that it wasn't North Korea

25. Michigan State University: the gang behind New Mexico's trauma-center attack claims it has data on 1.3 million students

26. More fridges: reports say supermarkets in Italy and Portugal were hit too, and one account claims 13 countries

27. California Community Colleges: reports of hackers stealing money from student accounts

28. Brazil: hackers reportedly took down systems at Mato Grosso's state health department, its second attack this year

29. Spain: a reported cyberattack on Extremadura's public health service

30. Philippines: St. Luke's Medical Center's patient app reportedly breached at two hospitals

31. Connecticut: data on 41,000 Medicaid recipients reportedly exposed

32. France: three pharmacies were reportedly hacked in 48 hours, with hundreds more reportedly targeted

33. Brico D\xE9p\xF4t: a hacker claims 57,000 truck-rental invoices with customers' names, addresses and phone numbers

Updates on earlier incidents:

- Ukraine and Russia: President Zelenskyy confirmed Ukraine hacked back at Russia's emergency alert system after Russia hit Ukraine's

- Polymarket: now paying back $3.9 million. Hackers hijacked a vendor's web address to plant the draining script.

- Linux: Ubuntu still hasn't shipped a fix for the zero-click server takeover hole, though Amazon has patched its servers. Solana's developers sent an urgent alert to the operators who run the network.

- GitLab: 1,000+ servers are still unpatched against the 10-out-of-10 hole being used in attacks

- Cleveland's University Hospitals: online services still down, 12 days in

- Node2Shell: the hole now under attack was found by OpenAI's AI security tool

- Binance: customers pulled $4.6 billion when withdrawals reopened. North Korea denies it did the hack.

- Onamae (GMO): the CEO apologized publicly, and every customer gets 5,000 yen (about $30)

*** This post was researched and written by Claude Opus 5.5. I'm having it do a daily roundup for me and figured I'd share them here, since it's so hard to stay on top of everything going on`,type:"quote",ver:!0,bm:85,len:6646,thumb:"https://pbs.twimg.com/amplify_video_thumb/2117515458828206081/img/RG8Xefi-qKo4WfI6.jpg",media:"video",why:"26 views/min; 380 min old; only 14 replies"},{id:"2117492514773143620",url:"https://x.com/voguemagazine/status/2117492514773143620",h:"voguemagazine",name:"Vogue Magazine",f:14617024,at:"2026-11-03T05:42:11.000Z",age:479,views:6089,replies:0,likes:14,reposts:1,quotes:0,vpm:12.7,score:39,genre:"Fashion",topics:["Fashion"],tags:[],text:"The manifestation expert thought her established following and personal development business would provide the foundations for a successful fragrance line. The reality of building a consumer business was far more complicated. https://t.co/4FhxVKET85",type:"post",ver:!0,bm:3,len:249,thumb:null,media:null,why:"13 views/min; 479 min old; only 0 replies"},{id:"2117437811930349698",url:"https://x.com/engadget/status/2117437811930349698",h:"engadget",name:"Engadget",f:3652145,at:"2026-11-03T02:04:49.000Z",age:696,views:11121,replies:9,likes:12,reposts:4,quotes:0,vpm:16,score:39,genre:"Tech",topics:["Tech"],tags:[],text:"Microsoft Office might be trapped behind a subscription, but OnlyOffice and LibreOffice will let you create and edit documents and spreadsheets for free. https://t.co/dno7Bn8XnI",type:"post",ver:!0,bm:7,len:177,thumb:"https://pbs.twimg.com/media/HWKmdD3XYAAiaze.jpg",media:"photo",why:"16 views/min; 696 min old; only 9 replies"},{id:"2117488000657666110",url:"https://x.com/HYPEBEAST/status/2117488000657666110",h:"HYPEBEAST",name:"HYPEBEAST",f:834083,at:"2026-11-03T05:24:15.000Z",age:497,views:4916,replies:1,likes:4,reposts:0,quotes:1,vpm:9.9,score:38,genre:"Fashion",topics:["Fashion","Tech"],tags:[],text:"Google \u201CZelda\u201D and take a quick trip back to 1998 \u2694\uFE0F https://t.co/GK y is the only one. Nothing else broke 700.",ai:[{t:"Hermes v0.22.6 adds 'hermes migrate grok-bot': your Bot writes a file with its setup, Hermes reads it. Scheduled tasks come over paused, plus skills, memory and the Bot's role. Never passwords or keys, and nothing in the Bot changes",label:"Could improve our workflow",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2117421030004469860",why:"You run both. This would be a cheap way to give Hermes a paused backup copy of one routine (for example the morning X briefing) without rebuilding it by hand. Proposal only; try it on one task and keep Grok Bot as the main runner."},{t:"'hermes curator lock <skill>' stops your Hermes Agent from changing a skill, even under --yolo. Per profile; 'curator status' lists what's locked",label:"Could improve TradingDeck",by:"witcheer",u:"https://x.com/witcheer/status/2117549594955456834",why:"Autonomous traders desk: lock the skills that hold each trader's entry rules and stop loss while forward testing runs, so an overnight coding session can't quietly edit them and muddy the test. Proposal only."},{t:"Google and University of Hong Kong paper: when an AI agent uses a computer, its own 'task done' message should never count as proof. Check the saved files and app data instead",label:"Could improve TradingDeck",by:"rohanpaul_ai",u:"https://x.com/rohanpaul_ai/status/2117445916982673579",why:"Your recaps say 'all on autopilot, even these journal entries'. Have the review step check the journal against the paper account's actual positions and fills, not the agent's summary, before you post numbers. Proposal only."},{t:"One prompt that has Hermes Agent search your past sessions, find 3 requests you repeat, and draft a SKILL.md for each without saving anything",label:"Could improve our workflow",by:"BkashJosi",u:"https://x.com/BkashJosi/status/2117564969013415954",why:"Hermes overnight coding on the terminal: run it once to see which terminal chores you keep re-typing, then turn only the good ones into skills. Read-only until you say save. Proposal only."},{t:"Google used swarms of AI agents to hunt silent bugs in its TPU compiler (no error raised, numbers just drift). Over 142 fixed so far",label:"Worth knowing",by:"omarsar0",u:"https://x.com/omarsar0/status/2117613273189376072",why:"A good real-world example of agents doing careful checking work, not just writing code. Nothing to change on our side."},{t:"Anthropic: amended IPO filing shows $17B Q3 revenue and $895.4B in compute commitments; WSJ says big investors want the IPO priced at $1.5T to $1.6T; NYT says it will have over 3.5GW of compute by end of 2026",label:"Worth knowing",by:"rohanpaul_ai",u:"https://x.com/rohanpaul_ai/status/2117401551526600969",why:"The biggest AI story for markets this week. Also good material for a market post if the IPO date firms up. Story: https://x.com/i/trending/2117023506613293386 and 3.5GW: https://x.com/DeItaone/status/2117599158081290621"},{t:"'We've achieved AGI. Opus 5.5 allows you to build quite literally anything you could possibly imagine'",label:"Ignore",by:"AlexFinn",u:"https://x.com/AlexFinn/status/2117460262538408004",why:"Opinion post (28K views, 95 replies). Nothing to act on. The replies are mostly builders saying building is easy now and getting noticed is the hard part, which is your problem too."}],drafts:[{kind:"Quote post (crypto, trending now)",quote:"https://x.com/WatcherGuru/status/2117598445448163505",quoteBy:"WatcherGuru",text:"Saying this the morning after crypto's biggest hack ever takes a level of confidence I will never have.",idea:"WatcherGuru: CZ says banks may be more vulnerable to cyberattacks than crypto exchanges (202K views in 58 min, 284 replies at 7:41 AM CT). Binance's $6.3B hack is the backdrop: https://x.com/CoinDesk/status/2117581756022854027. Text only."},{kind:"Your agents (honest update)",text:`Day 24 of forward testing my paper-trading agents.
